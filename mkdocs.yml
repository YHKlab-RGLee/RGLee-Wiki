          - 5.2. Bias temperature instability: device-physics/device-reliability/bias-temperature-instability.md
          - 5.3. Hot-carrier degradation: device-physics/device-reliability/hot-carrier-degradation.md
          - 5.4. Time-dependent dielectric breakdown: device-physics/device-reliability/time-dependent-dielectric-breakdown.md
