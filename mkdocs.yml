site_name: RGLee's Wiki
site_description: AI가 생성하고 정리한 지식과 교차검증을 마친 소자 물리 연구 문서를 축적하는 개인 연구 위키
site_url: https://yhklab-rglee.github.io/RGLee-Wiki/
site_dir: site
docs_dir: docs

theme:
  name: material
  language: ko
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 다크 모드로 전환
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 라이트 모드로 전환

plugins:
  - search:
      lang:
        - ko
        - en

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 2-3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Device Physics:
      - Overview: device-physics/index.md
      - "(1) MOSFET: Basic Operation": device-physics/mosfet/basic-operation.md
      - "(2) MOSFET: Leakage Current": device-physics/mosfet/leakage-mechanisms.md
      - "(3) MOSFET: Short-Channel Effects": device-physics/mosfet/short-channel-effects.md
      - "(4) MOSFET: Architecture Evolution": device-physics/mosfet/architecture-evolution.md
      - "(5) Memory Device: Basics": device-physics/memory-device/basics.md
      - "(6) SRAM: 6T Bitcell": device-physics/memory-device/sram.md
  - Solid-State Physics:
      - Overview: solid-state-physics/index.md
      - "(1) Quantum Transport: RGF and NEGF Scheme": solid-state-physics/quantum-transport/rgf-negf-scheme.md
      - "(2) Many-Body Perturbation Theory: GW Approximation": solid-state-physics/many-body-perturbation/gw-approximation.md
      - "(3) Point Defects: Charged Defect Formation Energy": solid-state-physics/point-defects/charged-defect-formation-energy.md
      - "(4) Point Defects: Nonradiative Multiphonon Emission": solid-state-physics/point-defects/nonradiative-multiphonon-emission.md
  - Computational Science:
      - Overview: computational-science/index.md
      - "(1) Equivariant Neural Networks: e3nn Formalism": computational-science/equivariance/e3nn-formalism.md
