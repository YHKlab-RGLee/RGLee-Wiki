site_name: 연구형 과학·계산 위키
site_description: 독립적인 복수 출처로 검증한 advanced topic을 축적하는 개인 연구 위키
site_url: https://yhklab-rglee.github.io/RGLee-Wiki/
site_dir: site
docs_dir: docs

theme:
  name: material
  language: ko
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 다크 모드로 전환
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 라이트 모드로 전환

plugins:
  - search:
      lang:
        - ko
        - en

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 2-3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Device Physics:
      - Overview: device-physics/index.md
      - "(1) MOSFET: Leakage Current": device-physics/mosfet/leakage-mechanisms.md
      - "(2) MOSFET: Short-Channel Effects": device-physics/mosfet/short-channel-effects.md
  - Solid-State Physics:
      - Overview: solid-state-physics/index.md
  - Computational Science:
      - Overview: computational-science/index.md
  - Research Documentation Principles: research-workflow.md
