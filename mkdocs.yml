site_name: RGLee's Wiki
site_description: AI가 생성하고 정리한 지식과 교차검증을 마친 소자 물리 연구 문서를 축적하는 개인 연구 위키
site_url: https://yhklab-rglee.github.io/RGLee-Wiki/
site_dir: site
docs_dir: docs

theme:
  name: material
  language: ko
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 다크 모드로 전환
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 라이트 모드로 전환

plugins:
  - search:
      lang:
        - ko
        - en

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 2-3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Device physics:
      - Overview: device-physics/index.md
      - 1. MOSFET:
          - 1.1. Basic operation: device-physics/mosfet/basic-operation.md
          - 1.2. Leakage current: device-physics/mosfet/leakage-mechanisms.md
          - 1.3. Short-channel effects: device-physics/mosfet/short-channel-effects.md
          - 1.4. Architecture evolution: device-physics/mosfet/architecture-evolution.md
      - 2. Memory device:
          - 2.1. Basics: device-physics/memory-device/basics.md
          - 2.2. SRAM basic: device-physics/memory-device/sram.md
          - 2.3. SRAM advance: device-physics/memory-device/sram-advance.md
          - 2.4. DRAM basic: device-physics/memory-device/dram.md
          - 2.5. DRAM advance: device-physics/memory-device/dram-advance.md
  - Solid-state physics:
      - Overview: solid-state-physics/index.md
      - 1. Quantum transport:
          - 1.1. RGF and NEGF scheme: solid-state-physics/quantum-transport/rgf-negf-scheme.md
      - 2. Many-body perturbation theory:
          - 2.1. GW approximation: solid-state-physics/many-body-perturbation/gw-approximation.md
      - 3. Point defects:
          - 3.1. Charged defect formation energy: solid-state-physics/point-defects/charged-defect-formation-energy.md
          - 3.2. Nonradiative multiphonon emission: solid-state-physics/point-defects/nonradiative-multiphonon-emission.md
  - Computational science:
      - Overview: computational-science/index.md
      - 1. Equivariant neural networks:
          - 1.1. e3nn formalism: computational-science/equivariance/e3nn-formalism.md
