            Lecture 20 pp.152–154, Exercise 20.3. 원문의 block elimination 식을 직접 읽고 복원과 principal submatrix inverse의 차이를 대수 검산했다.'
          - '§6 최적성/오차: Saad linear systems §5.2.1 p.137, Propositions 5.2–5.3; 독립 Haasdonk tutorial Propositions 2.14–2.15,
            preprint pp.12–13, Exercise A.8; 최소잔차의 두 번째 근거는 Trefethen–Bau Lecture 11 pp.82–84, (11.11)–(11.13) normal equations와
            안정적 QR 비교. e=K^-1rho 및 출력 bound는 이 잔차 관계와 유도노름 부등식의 직접 적용이다.'
          - '§6 동역학/입출력: Benner survey (2.3)–(2.6); 독립 Pulch https://arxiv.org/pdf/1711.02912 §§2.1–2.2, (1),(5),(8)–(10).
