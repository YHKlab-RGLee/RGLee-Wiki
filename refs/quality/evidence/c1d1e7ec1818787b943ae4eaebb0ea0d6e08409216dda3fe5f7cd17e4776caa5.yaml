            (57)–(58), node176.html (88)–(89). 전자는 Krylov 생성/선조건 잔차, 후자는 Galerkin과 correction으로 공간 보강을 독립적으로 설명한다.'
          - '§4 재사용 ROM와 비용/표본 밖 검증: Haasdonk tutorial §2.6 greedy/projection error, pp.28–34; 독립 Benner–Gugercin–Willcox
            https://kiwi.oden.utexas.edu/papers/Parametric-model-reduction-survey-Benner-Gugercin-Willcox.pdf §§2.2–2.4, pp.491–495,
            (2.4)–(2.8). 두 글의 기준은 현재 eigenpair 수렴과 parameter-domain 축소의 차이를 뒷받침한다.'
          - '§5 resolvent 및 §6 Petrov–Galerkin/invertibility: Saad https://www-users.cse.umn.edu/~saad/IterMethBook_2ndEd.pdf
            §5.1.2 pp.135–136, (5.7), Example 5.2; 독립 Benner survey §§2.2,2.4, (2.4)–(2.6),(2.19)–(2.20), pp.492,495. K=zS−H
            대입 및 양쪽 source/reconstruction 사상은 직접 유도했다. 최종 본문은 원래와 축소 역행렬의 별도 가역성을 명시한다.'
