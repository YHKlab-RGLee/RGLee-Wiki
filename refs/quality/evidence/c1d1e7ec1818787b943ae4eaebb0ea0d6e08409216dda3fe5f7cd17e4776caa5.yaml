            §5.1, p.586, Theorem 5.1.1 및 (76)–(80)의 양의 에너지/음의 에너지 미분 유도. 본문은 엄격 음의 실수부와 A+A†<0를 명시하므로 해당 원문의 비양/음의 안정성 표현
            혼동을 확대하지 않는다.'
