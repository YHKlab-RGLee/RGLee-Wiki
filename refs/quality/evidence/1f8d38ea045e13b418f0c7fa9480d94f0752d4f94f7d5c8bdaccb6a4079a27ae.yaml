            그대로 가져오지 않았고, Shin arXiv 2107.10511 p3 Eq. 7–8의 Hk/S(k) 중 기본 모형은 S=I로 한정한다.
          locations:
          - 13–36행
          - 255–265행
          reason: Bloch 위상, block 차원, 직교와 비직교 계의 규약이 본문 안에서 일관된다. 수정된 검증 가중 함수 g(E)는 결합 행렬 w와 구분된다.
        B4:
          rating: 2
          evidence:
          - 원문은 2011 Mil'nikov의 에너지별 scattering-state 표본과 이 글의 k-격자 수집이 같은 세부 절차는 아님을 보여 준다; 본문은 이를 일반화된 표본 절차로 제시한다. 4절의
