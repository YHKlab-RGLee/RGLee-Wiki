  critical_questions:
    dependency_chain: 주기적 H(k)와 관심 window를 정한 뒤 Bloch 표본으로 공통 U를 만들고, block 투영과 band 검사를 거쳐 동일 조건의 열린 장치 NEGF 결과를 비교한다.
    reader_blocker: Bloch 표본에서 한 공통 U를 만드는 과정이 첫 개념적 난점이지만 SVD 설명과 차원 예가 이어져 있어 차단되지는 않는다.
    strongest_revise_case: 수정 전 epsilon_T의 0/0 가능성과 w 재사용을 새 버전에서 직접 재검산했다. g의 양의 유한 적분 조건과 분모 하한이 두 문제를 해소했으므로 남은 강제 revise
      근거는 없다.
  summary: 주기적 H(k)에서 device NEGF까지 요청한 기본 흐름을 설명하고 원문 근거·한계를 제시한다. 수정된 전송 오차 지표와 기호는 일관되며, 현재 full assessment는 pass이다.
