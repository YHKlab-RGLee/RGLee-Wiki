        B2:
          rating: 2
          evidence:
          - 기저 구성과 spurious branch는 Mil'nikov의 2011 원 연구, Huang의 별도 원자 소자 연구, Shin의 이종구조 연구를 범위별로 대조했다. NEGF·복잡도는 Grassi와
            Lewenkopf–Mucciolo, mode 결합은 Grassi와 Luisier, 산란은 Grassi와 Lemus, 비직교 계는 Shin과 Ozaki를 대조했다. 같은 논문의 arXiv와 DOI는
            하나로만 세었다.
          locations:
          - '[1–3] 1–3절'
          - '[4,5] 4–5절'
          - '[3,4,6–8] 7절'
          reason: 독립 저자·모형의 두 근거가 주요 주장군에서 같은 의미를 지지한다. Mil'nikov 절차를 후속 문헌이 재진술한 부분만 별도 실험 검증으로 세지 않았다.
        B3:
          rating: 2
          evidence:
