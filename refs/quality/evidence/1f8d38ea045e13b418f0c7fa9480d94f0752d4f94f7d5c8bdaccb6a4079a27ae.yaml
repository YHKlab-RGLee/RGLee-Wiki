          reason: 주요 주장군에 붙은 인용의 관련 원문을 직접 확인했다. 3절의 P/Q Schur 식은 [4,5]에 같은 기호로 인쇄되지는 않으나 [5]의 소거식과 직접 행렬 검산으로 맞는다; 인용의 특이성은
