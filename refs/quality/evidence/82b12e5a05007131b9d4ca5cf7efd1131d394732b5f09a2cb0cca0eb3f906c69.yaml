            ## Manual checks (no execution)


            - Sort mutation example gives a/b exactly as printed. Mixed-key order B,D,C,A; first time-descending pass C,A,B,D.
            Keys B,D coincide and preserve their order.

            - Merge takes right 1, left 2, both left 5s, right 5, right 9. Total length 6. For equal labeled records the left-first
            rule preserves the original left/right ordering.

            - Partition [6,2,5,3]: scan 6 stays; 2 swaps with 6 giving [2,6,5,3]; 5 stays; pivot swap gives [2,3,5,6], cut=1.
            Equal-only case leaves cut=lo.

            - Boundary table for [1,4,4,4,9]: (L,U)=(0,0),(1,4),(4,4),(5,5) for queries 0,4,6,12. x=4 trace and count_between([4,8])=3
            agree. Empty input returns 0 without access.

            - first_true [3,10), threshold7: mid6 false ->7..10; mid8 true ->7..8; mid7 true ->7..7. Nonmonotone [T,F,T] returns2,
            missing0 as stated.

            - Capacity sample sum31, maximum8. C12 batches [6,2]/[5]/[8,3]/[7], four; C13 [6,2,5]/[8,3]/[7], three; C19 [6,2,5]/[8,3,7],
            two. Binary candidates 19,13,10,12 yield final13; C10 needs [6,2]/[5]/[8]/[3,7], four. At optimum boundaries3,5.

            - Greedy induction handles e_(j-1)>=d_j separately. Otherwise greedy''s required suffix is contained in competitor''s
            jth batch and nonnegativity bounds its sum by C. This proves the endpoint dominance and minimum batch count, including
            zero weights. The exact-k splitting argument requires k<=n, stated.

            - All-zero bound collapses0; singleton9 ->9; k1 on [6,2,5] ->13; k3 ->6. Invalid empty/k0 hit guards. [5,-4] illustrates
            the inner positive-assumption rule, while public function rejects negatives.

            - Bound multiplication 200000*10^9=2*10^14. Average bound ceil(31/3)=11 does not certify capacity; direct C12
            impossibility establishes13 optimum.

            - coords=[-5,12,90]; ranks [2,0,2,1]; differences17,78 vs1,1; inserting0 shifts later ranks. Query [0,50] produces
            [1,2). Query [80,100] finds one coordinate kind, two original occurrences.


