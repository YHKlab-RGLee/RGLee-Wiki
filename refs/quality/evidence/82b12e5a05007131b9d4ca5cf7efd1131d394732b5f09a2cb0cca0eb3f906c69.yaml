            ## Findings


            R1 — §5(2), line 401, software-behavior mismatch. The sentence promises explicit rejection when inputs fall outside
            the specified range. The implementation checks nonempty weights, 1<=k<=n, and nonnegative weights, but does not
            check the published upper limits or integer types. For instance [1000000001], k=1 bypasses both guards and returns
            that weight. Change the prose to name only the checked conditions, treating the remaining restrictions as caller
            preconditions. The core function is correct within its stated input contract.


            R2 — §6(3), line 579, missing range assumption. Add start<=stop to the sentence claiming [bisect_left(coords,start),bisect_right(coords,stop))
            is a valid coordinate interval. With coords=[-5,12,90], start=100, stop=0, the endpoints are 3 and 1; this is
            not a normal half-open index interval. §3(3) correctly states the analogous assumption. No additional code needed.


            C1 — nonblocking convention reconciliation. Sources 7 and 8 use right-first ties in their merge pseudocode; source
            8''s general stability classification must not be treated as proof of that displayed implementation. The article
            itself warns that merge implementations need not be stable and supplies the correct left-first rule. For clearer
            attribution, cite 1 and 6 at the stability proof, using source 6''s linked Merge.java, inspected below. This is
            a provenance improvement, not a correction to the article algorithm.


            C2 — nonblocking partition attribution. Source 9 confirms partition-and-recurse and duplicate pitfalls, but its
            implementation is two-way, with non-strict partition boundaries. Source 7 Fig.1.8 is the direct Lomuto correspondence.
            Source 8 §3.5 independently uses a strict-less one-pass boundary with the pivot initially at the front. Mark the
            article''s half-open last-pivot code as that convention''s adaptation; do not claim source 9 prints it.


