            ## Independence and inspection provenance


            The whole final article was read first, then original source passages were inspected independently. `initial-findings.md`
            was written before reading any earlier assessment. Only afterward, the prior reference review `experiment/algorithm/python-toolkit/references/findings.md`
            was consulted to reuse still-valid source inspection for unchanged API clauses. That report reviewed SHA `510f9e23840d97f6ab30c1f8935a2ece180964911b0930fb73191b0504e1ebff`;
            its own file SHA when consulted was `25ee3e10688d56d1fc86b1e7f7e78490405aca12d47f687f0204e14a04a3e807`. Its previous
            verdict is not adopted. Its inspection records are reused only where the final clause is unchanged or narrower.
            New cost sources [41–43] and the final assumptions were independently inspected here.


            Bibliography numbers in the original inspection map below use the pre-renumbering bd31744d version. The final
            renumbering preserves the same works and claim associations; the explicit old-to-final mapping in the delta section
            disambiguates every identifier. All cited URLs were opened in this review; an open alone is not support. Rows
            marked **direct** name passages actually inspected here; **reused** names supporting passages from the prior review,
            not personal direct verification. Some sources have both categories for different passages.


