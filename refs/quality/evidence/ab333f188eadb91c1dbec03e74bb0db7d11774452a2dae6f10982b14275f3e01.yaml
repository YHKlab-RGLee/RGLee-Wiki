    check: 'q=min(1000,600)=600; 1000×600 times 600×600 times 600×600 yields 1000×600. U takes 100 columns (100≤600): (100×1000)(1000×1000)(1000×100)=100×100.
      The 1000×2000 comparison instead has q=1000. Orthonormal completion can produce all 600 thin-SVD columns even for rank-deficient
      snapshots; zero-singular-value columns need not be independent directions in their span. The illustrative m=100 is mathematically
      valid, not a claim that 100 nonzero singular values or sufficient band accuracy are guaranteed.'
    assumptions: Complex conjugate transpose and Euclidean metric S=I as stated in §2; thin SVD including any zero singular
