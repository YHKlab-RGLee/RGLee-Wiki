  findings:
  - id: snapshot-count
    claim: With N=1000 and 30 k points, each contributing 20 cell eigenvectors, the snapshot matrix is 1000×600; 100 k points
      with 20 each give 1000×2000. Snapshot count differs from selected mode count.
    locations:
    - §3(2), lines 113–129
    category: scientific
    status: supported
    method: calculation
    sources:
    - id: https://doi.org/10.1063/1.5010238; https://arxiv.org/html/1710.08064
      provenance: Huang, Ilatikhameneh, Povolotskyi and Klimeck, 2018; original author preprint v2
      locator: §II first paragraph and §IV.1, Fig. 5 discussion
      supports: 'Directly inspected: sample Bloch modes across Brillouin zone and orthogonalize; SVD discards small singular
        values in their example. The 30/100 k examples here are illustrative and not paper data.'
    - id: https://doi.org/10.1109/SISPAD.2011.6035033; https://in4.iue.tuwien.ac.at/pdfs/sispad2011/pdf/11-5.pdf
      provenance: Milnikov, Mori and Kamakura, 2011 original method
      locator: §II and §IV p. 316
      supports: 'Directly inspected: selected scattering states construct reduced basis; extra orthogonal basis states can
        be added independently to eliminate unphysical branches.'
    check: 'Arithmetic: P=30×20=600; P=100×20=2000. Each vector has N=1000 components and is one column. Fixed sampling assumptions
      make both examples possible; P need not equal m.'
    assumptions: Exactly 20 collected N-component eigenvectors at every stated k; counts do not assert linear independence
      or guarantee any prescribed mode accuracy.
