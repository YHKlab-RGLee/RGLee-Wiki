    A:
      percent: 100.0
      criteria:
        A1:
          rating: 2
          evidence:
          - 도입부가 반복 NEGF의 cell 자유도 축소를 목적으로 정하고, 직교 AO·이웃 cell 모형에서 비직교 SIESTA형 행렬쌍까지의 범위를 선언한다.
          - 기호표가 M,m,U,V,H0,W와 공통 선행 문서의 표기 차이를 설명한다.
          locations:
          - 도입부
          - 기호표
          reason: 대상 독자에게 필요한 상태·출력·snapshot·Galerkin 선행 링크와 계산 순서를 먼저 제공한다.
        A2:
          rating: 2
          evidence:
          - H2 순서는 real-space block→energy window→공통 basis→projection→band 검증→실행 예제→NEGF→확장→비용이다.
          - H3는 각 단계의 입력·정의·검증을 명사구로 구분하고 H4가 없다.
          locations:
          - H1–H3 전체
          reason: 제목만으로 기저의 구성과 열린 장치 검증의 의존 순서를 복원할 수 있다.
        A3:
          rating: 2
          evidence:
          - 이웃 cell 모형 내 정확한 Fourier 식, m<M 부분공간 근사, UMS 결합 삭제를 분리한다.
          - projected 원래 self-energy와 reduced lead 재계산의 비가환성, S0 metric과 S(k) norm, 조립 H와 S^{-1}H를 구분한다.
          locations:
          - 1(1)
          - '4'
          - 7(1)
          - '8'
          reason: 정확한 좌표변환·차원 절단·물리 모형·접촉 근사를 혼동하지 않는다.
        A4:
          rating: 2
          evidence:
          - 2→3은 수집한 cell 벡터의 중복을 SVD로 처리하고 4→5는 투영 잔차에서 검증으로 이어진다.
          - 6의 수치 검산을 7의 동일기저 transmission 비교가 회수하며 10의 요약은 앞선 다섯 결론만 정리한다.
          locations:
          - 절 전환
          - '10'
          reason: 전환이 선행 결과에 근거하고 요약에 새로운 과학 주장이 없다.
    B:
      percent: 100.0
      criteria:
        B1:
          rating: 2
          evidence:
          - 'G1 도입·1·2(1)·3(2)·4: 공통 Bloch cell 공간, energy window, onsite/hopping. 직접 확인 [1] https://arxiv.org/html/1710.08064
            §II 식(4)–(6), §IV.A; [2] https://in4.iue.tuwien.ac.at/pdfs/sispad2011/pdf/11-5.pdf pp.315–316 식(1)–(4); [3] https://arxiv.org/html/2107.10511
            §§III–IV 식(2)–(8). 서로 다른 연구팀의 원문 구성을 대조했다.'
          - 'G2 2(2): 전체 Bloch 직교성과 cell 계수 내적의 구별. [2] 위 SISPAD 원문 p.316 식(2)–(4)의 cell orbital 합 내적; [4] https://arxiv.org/pdf/cond-mat/0702295
            §II p.2 식(1)–(3)의 무한 lead Bloch 정규화. 유한 주기 위상합 식은 본문이 이 정의로부터 직접 대입해 도출한 항등식이며 저자들의 실측값으로 취급하지 않는다.'
          - 'G3 3(1),5(2),8(2): POD와 학습 꼬리, 고정 metric 압축. [5] https://kiwi.oden.utexas.edu/papers/Parametric-model-reduction-survey-Benner-Gugercin-Willcox.pdf
            p.502 §3.3.1 식(3.17)–(3.18); [6] https://pnp.mathematik.uni-stuttgart.de/ians/haasdonk/data/oberwolfach2014/RBtutorial.pdf
            preprint pp.49–51 Prop.3.18–3.19 식(3.12), Remark3.20. 최소 제곱오차와 최대 오차의 구별을 확인; 일반 내적을 S0=L†L로 바꾼 본문의 절차는 명시된 metric
            선택의 대수적 적용이다.'
          - 'G4 4(1),5: Galerkin, Ritz와 전체 잔차. [8] https://www-users.cse.umn.edu/~saad/eig_book_2ndEd.pdf §4.3 pp.97–101 식(4.17)–(4.27),
            §3.2 pp.61–63; [9] https://people.eecs.berkeley.edu/~demmel/ma221_Fall10/Lectures/Lecture_19.html Courant–Fischer
            및 Rayleigh quotient residual theorem. 내림차순 문헌을 본문의 오름차순 부등식으로 변환하면 일치한다.'
          - 'G5 5의 spurious branch·보강: [1] https://arxiv.org/html/1710.08064 §§II–IV, 식(6)의 직교여공간 및 표본 사이 unphysical bands
            논의; [2] https://in4.iue.tuwien.ac.at/pdfs/sispad2011/pdf/11-5.pdf p.316 basis 확장·추가 branch; [3] https://arxiv.org/html/2107.10511
            §§III,IV.4. 이 논문들의 최적화와 본문의 일반 보강 후보 설명을 구별했다.'
          - 'G6 4(2),7(1),8(1): cell별 경계 mapping, CMS·UMS. [3] https://arxiv.org/html/2107.10511 §IV 식(3)–(5), 접합 supercell
            조건; [7] https://arxiv.org/pdf/1302.0694 §II.B pp.3–4 식(9)–(17), CMS와 UGMS; [10] https://iis-people.ee.ethz.ch/~schenk/JApplPhys_100_043713.pdf
            §I, §§II–III, transverse shape 변화와 결합 효과. 완전 unitary·절단·결합 삭제가 다른 연산임을 직접 대조했다.'
          - 'G7 7(1–2): 접촉 self-energy, Green 함수, broadening, Caroli trace. [7] https://arxiv.org/pdf/1302.0694 p.3 식(11)–(13);
            [11] https://arxiv.org/pdf/1304.3934 §§2–3 pp.3–4 식(15)–(18); [12] https://arxiv.org/pdf/0908.4142 §II.A p.3 식(6)–(8);
            [13] https://arxiv.org/pdf/1403.3861 §II pp.3–4 식(2)–(4). Lead 제거 후 projection과 projection 후 제거의 차이는 이 식들의 직접
            대수적 비교이다.'
          - 'G8 7(2) WBL: [13] https://arxiv.org/pdf/1403.3861 §II pp.4–5 식(4)–(6), 상수 broadening과 level shift 생략; [14] https://arxiv.org/pdf/cond-mat/9404027
            §V.C.1 p.20 식(39). 직교·정상상태 한계에서 -iΓ/2와 일치한다. 교육용 접촉을 실제 chain lead라고 주장하지 않는다.'
          - 'G9 7(3) eigenchannel: [4] https://arxiv.org/pdf/cond-mat/0702295 §II pp.2–3 식(1)–(6); [11] https://arxiv.org/pdf/1304.3934
            §2 pp.2–3 식(1),(9)–(10). Flux-normalized t의 singular values 제곱과 basis 차원의 차이를 확인했다.'
          - 'G10 8(1) 산란: [7] https://arxiv.org/pdf/1302.0694 §II.B pp.3–4 식(17) 이후 mode-space phonon self-energy; [15] https://arxiv.org/pdf/2003.09536
            §§2.3–2.5 p.3 식(8)–(9). Mode 사이 산란과 form-factor 변환·비용을 각각 직접 확인했다.'
          - 'G11 8(2–3) 비직교 행렬쌍·complex z: [3] https://arxiv.org/html/2107.10511 §IV.3 식(6)–(8); [8] https://www-users.cse.umn.edu/~saad/eig_book_2ndEd.pdf
            §9.2.5 p.228 식(9.20) 이후 projected pencil; [12] https://arxiv.org/pdf/0908.4142 §II.A p.3 식(6)–(8); [16] https://arxiv.org/pdf/cond-mat/0110650
            §III.A p.4 식(7)–(13). 같은 z의 양쪽 block은 [12]에 명시되고 [16]의 inverse(zS-H)도 같은 Schur 대입을 준다. K_LD(z)≠K_DL(z)†는 이 정의에서
            직접 유도되며 복소켤레 z를 구분했다.'
          - 'G12 9 비용·관측량 범위: [1] https://arxiv.org/html/1710.08064 §I, §IV.B의 RGF 시간/저장량 및 변환 overhead·전하 복원; [7] https://arxiv.org/pdf/1302.0694
