            §1.1 p.485 offline/online; [12] https://arxiv.org/pdf/0908.4142 §II, [16] https://arxiv.org/pdf/cond-mat/0110650
            §III density matrix. 비용 부등식은 직접 장부이며 특정 speedup 실측으로 제시하지 않는다.'
