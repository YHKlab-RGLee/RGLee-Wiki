        B2:
          rating: 2
          evidence:
          - CMS·projection은 ETH effective-mass [1], Bologna GNR [2], Purdue atomistic [3], KAIST heterostructure [4]의 서로 다른
            provenance로 대조했다.
          - Atomistic sampling/completion은 Osaka의 원 방법 [5]과 Purdue·TSMC·KAIST의 별도 구현 [3,4,6,7]을 확인했으며, 후속 논문이 [5]를 계승한다는 공통
            provenance를 독립 유도로 중복 계산하지 않았다.
          - Scattering은 Bologna [2], Purdue nanowire [7], Purdue planar MOSFET [8]의 서로 다른 모형과 적용 범위를 대조했다.
          - Block NEGF/RGF는 JAIST/AIST [10]과 UCF [11], Wannier 구별은 별도 review [12]와 Jülich chapter [13]가 같은 핵심 의미를 지지한다.
          - 동일 논문의 DOI와 arXiv, 미러, 같은 연구계열의 재서술을 독립 근거로 세지 않았고 독립 references 재검토도 최종 SHA에서 blockers 0으로 판정했다.
