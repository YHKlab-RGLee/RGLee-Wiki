        B3:
          rating: 2
          evidence:
          - q는 양의 elementary charge로 유지하고 Bloch 변수는 길이 역수의 k, cell period a, 무차원 phase ka와 e^{±ika}로 분리했다.
          - 비직교 기저에서 zS-H, S-metric, H-zS 경계 인자, 같은 z에서 평가하는 두 방향 coupling을 하나의 convention으로 정합했다.
          - G^< 정의와 density 부호, spin degeneracy, conventional current 방향, exact/approximate reconstruction의 의미를 식 주변에서 고정한다.
