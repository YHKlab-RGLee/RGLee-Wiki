    A:
      percent: 100.0
      criteria:
        A1:
          rating: 2
          evidence:
          - 도입은 transverse 자유도 축소라는 문제와 계산 병목, mode-space의 목적, full-space와 달라지는 근사 범위를 먼저 제시한다.
          - 선행 문서인 NEGF formalism을 연결하고 slice 지표, full/reduced 차원, 변환행렬 U_i, 전하 q와 전류 방향을 본문 식보다 먼저 정의한다.
          locations:
          - 도입 1–3문단
          - §1(1)
          reason: 독자가 이후 투영식과 전류식에 필요한 문제 범위·선행 개념·기호를 도입에서 확보할 수 있다.
        A2:
          rating: 2
          evidence:
          - H1–H3를 별도로 읽으면 full-space 기준 → local projection → coupled/local basis → atomistic subspace → contact/scattering
            → 비용·한계 → full-space 검증 → 인접 방법 구별의 의존 순서가 드러난다.
          - 모든 H2는 번호형이고 H3는 괄호 번호형이며 같은 단계의 하위 개념을 병렬로 나눈다.
          locations:
          - 전체 H2/H3
          reason: 정의와 기준 모형에서 근사 구성, 적용 조건, 실패 양상과 검증으로 이어지는 구조가 명확하다.
        A3:
          rating: 2
          evidence:
          - Full-space inverse, P/Q exact Schur elimination, rectangular Galerkin truncation, CMS와 UMS를 서로 다른 모형·근사 단계로 구분한다.
          - Ballistic contact, SCBA scattering, four-index form factor와 diagonal/Hermitian-part 생략을 별도 근사로 설명한다.
          - 문헌의 speedup 사례와 dense-block asymptotic scaling, 실제 wall time을 구분한다.
          locations:
          - §2(2)
          - §3(1)
          - §5(2–3)
          - §6(1)
          reason: 정확한 선형대수 관계와 부분공간 절단·mode decoupling·산란 단순화의 근사 계층을 혼동하지 않는다.
        A4:
          rating: 2
          evidence:
          - §2의 복원은 투영된 Green 함수에서 관측량으로, §4의 subspace 구성은 §5의 contact/scattering와 §7의 검증으로 자연스럽게 이어진다.
          - §9의 여섯 항목은 앞서 정의한 projection, CMS/UMS, atomistic completion, 비용 및 full-space 검증만 회수한다.
          locations:
          - §2(2–3)
          - §4–7
          - §9
          reason: 절 전환과 요약이 앞선 결과를 계산 절차로 연결하며 새 미검증 주장을 추가하지 않는다.
