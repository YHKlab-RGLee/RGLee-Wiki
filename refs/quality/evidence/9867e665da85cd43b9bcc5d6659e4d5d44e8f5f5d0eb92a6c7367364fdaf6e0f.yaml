            ## Manual checks and unresolved status


            - Selection a=(2,5,8): 3 unordered pairs, 6 ordered pairs, 9 repeated ordered pairs, 6 replacement combinations.
            a=(4,4,9): positional combination outputs (4,4), (4,9), (4,9); unique permutations 449, 494, 944.

            - Bitmask 13=8+4+1 selects 0,2,3. U=15 limits complement to four positions.

            - Signed interval examples: 8+(-3)=5; 2+5=7; nonnegative remainder cannot lower 8 to 5. Remaining {4,8} has sums
            {0,4,8,12}, so interval inclusion is insufficient.

            - Meet-in-middle lists for [6,-2] are {-2,0,4,6}, for [9,3] {0,3,9,12}; -2+9=7. Empty sides retain zero. Duplicates
            preserve multiplicity in the shown code.

            - Assignment six permutations: costs 8,11,forbidden,forbidden,7,forbidden in listed order. Row minima 2,1,2; (0,2)
            partial cost 9 plus suffix 2 is 11; branch beginning 2 has optimistic 5 and contains optimum 7. Empty matrix returns
            (0,()); no-allowed row returns None; collision-only rows exhaust without a solution; all-zero first solution allows
            safe equality pruning.

            - Grid initial 100/010: neighbor counts 0,2,0 / 2,0,1; next 110/110; next unchanged. Counterexample 101/001 synchronously
            becomes 111/001, while row-major in-place update also switches lower middle from newly changed upper middle plus
            old right neighbor.

            - No mismatch, inaccessible supporting passage, unresolved numerical discrepancy, or bibliographic identity conflict
            remains. Live Python docs identify 3.14.7 and SymPy 1.14.0; article relies on older stable functionality, not
            a release-specific new API. PyMOTW''s older examples agree with current official contracts.

            - Source independence is grouped by author/project, not URL. PSF sources are one provenance; Hellmann pages one;
            Miller/Ranum pages one; Downey books one. Every mapped claim uses at least two independent provenance groups at
            its relevant premise/application level.


