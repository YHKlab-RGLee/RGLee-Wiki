          reason: 핵심 개념과 약어를 읽기 순서에 맞게 정의한다.
        C2:
          rating: 2
          evidence:
          - n 정규화, Hartree의 1/2, F_x의 무차원성, tau 차원, omega 역길이와 exact/approximate 의미를 식 주변에서 설명한다.
          locations:
          - §1–§6 수식 앞뒤
          reason: 수식의 역할과 규약이 독해를 돕는다.
        C3:
          rating: 2
          evidence:
          - GGA 입력 손실→tau 환경 분별, SCAN regularization→제약 손실/회복, hybrid 범위와 correlation 한계를 연결한다.
          locations:
          - §3–§5, §6
          reason: 성능과 이론적 보장 및 수치 안정성을 구별한다.
        C4:
          rating: 2
          evidence:
          - PBE/PBEsol 수치 표, SCAN 계열 표, hybrid 거리 표와 58개 설명 요소가 비교·유도에 쓰인다. 최종 benchmark 글자25954/8373.07, 요소58/33.87 통과.
          locations:
          - §1–§6 표·수식
          reason: 정량 coverage도 독립 benchmark로 통과했다; 장식 요소를 근거로 가산하지 않았다.
