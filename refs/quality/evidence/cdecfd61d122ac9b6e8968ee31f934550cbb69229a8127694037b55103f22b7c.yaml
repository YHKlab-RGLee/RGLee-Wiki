    B:
      percent: 100.0
      criteria:
        B1:
          rating: 2
          evidence:
          - 본인이 직접 읽은 Capelle/Kaplan/PBE/PBEsol/Isaacs와 새 원문 3종 및 원문 abstract를 대조했다. 다른 범위는 독립 reference report의 source-location
            matrix와 명시된 prior Zhang passage evidence를 재사용했다. 상세 구분은 direct-source-checks.md에 기록했다.
          - 최종 references/recheck.md 및 final-result.yaml의 dd1d8d 버전과 R1–R4 closure를 직접 대조했다. chapter [25] full text는 미열람이며
            두 근거 계산에서 제외한다; 해당 주장은 [9,11] 및 [19,20]으로 지지된다.
          - '본인 직접 확인 — PBE 원 논문 https://www.chem.uci.edu/~kieron/dft/pubs/PBE97.pdf, PRL 77 pp3865–3868: p3865 PW91 단순화·potential
            평활성, p3866 Eq4의 beta, p3867 Eqs11–14의 spin scaling·linear response·Lieb–Oxford sufficient bound·rational F_x,
            p3868 결론. PBEsol https://arxiv.org/pdf/0707.2088 pp1–2 Eqs1–4 및 beta=0.046 선택 문단과 대조했다.'
          - '본인 직접 확인 — Capelle https://arxiv.org/html/cond-mat/0211443 §§4.1.2–4.1.3 Eqs58–67: coupling-average hole·정규화·coordinate
            scaling·one-electron cancellation·Lieb–Oxford bound·KS gap. Kaplan/Levy/Perdew https://arxiv.org/html/2207.03855
            §III Eqs25–40 및61–65: 동일 규약의 hole·spin/coordinate scaling·integrated negativity·high/low-density 조건.'
          - '본인 직접 확인 — Gori-Giorgi/Gál/Baerends https://arxiv.org/pdf/1109.2204v2 §§I–II pp1–2: HOMO nodal 방향의 별도 분석과 불규칙한
            potential 가능성. 독립 참고문헌 담당 직접 확인 — 같은 원문 §IV p6 Eq18 주변의 (N−1)/r와 −Z/r, §§V–VI 방향별 한계. 수정 §6(8)은 통상적인 원거리 방향으로
            한정하며 미확인 energy-per-particle 점근 계수는 삭제했다.'
          - '본인 직접 확인 — Kurzweil/Head-Gordon https://arxiv.org/pdf/0905.1260 §II A pp3–4 Eqs4–9: 병진·회전 대칭성, spin-resolved
            zero-force/torque, exchange/correlation virial. Levy–Perdew https://journals.aps.org/pra/abstract/10.1103/PhysRevA.32.2010
            원문 abstract의 명시적 exchange virial 식 및 kinetic-correlation 관계와 대조했다. 1985 논문 full text를 읽었다고 주장하지 않는다.'
          - '본인 직접 확인 — Bajaj/Janet/Kulik https://arxiv.org/pdf/1710.02378 pp1–4 Introduction/Fig1: isoenergetic·half-filled
            scope, fractional-spin constancy, flat-plane 조건 및 독립 수치 시험. 독립 참고문헌 담당 직접 확인 — Cohen et al. https://arxiv.org/pdf/0805.1724
            Eqs1–3의 degenerate ensemble 및 Mori-Sánchez et al. https://arxiv.org/pdf/0809.5108 pp1–2의 확장. 수정 본문의 수소·축퇴 상태 제한과
            total-energy 표기를 유지했다.'
          - '독립 참고문헌 담당 직접 확인 — Kronik/Kümmel https://www.weizmann.ac.il/MCMS/kronik/publications 에 실린 원문 author abstract
            (DOI 10.1039/D0CP02564J): 통상적인 Coulomb potential 점근형과 self-interaction·piecewise linearity의 비동치. Furness et al.
            https://arxiv.org/pdf/2110.00647 §II Eqs19–21: high/low-density scaling; 수정 §6(9)의 [9,18,24]에 즉시 대응한다.'
          - 본인 직접 확인 — Isaacs/Wolverton https://arxiv.org/pdf/1804.06914 §III/Table I·Fig5의 ME/MAE/RMSE 차이를 확인한 뒤 본문의 50%·약1000계
            수치 주장을 삭제한 사실을 대조했다. 정성적 SCAN 개선은 독립 benchmark와 원래 SCAN https://arxiv.org/pdf/1504.03028 pp3–8로 뒷받침된다. Nature
            DOI 10.1038/nchem.2535의 publisher abstract·Fig1/2 captions는 본인이 읽었고, 해당 author manuscript https://arxiv.org/pdf/1511.01089
            pp2–4는 참고문헌 담당이 직접 읽었다.
          - 변경되지 않은 Zhang 근거 재사용 — DOI 10.1088/1367-2630/aac7f0, https://orbilu.uni.lu/bitstream/10993/38240/1/125-solids-DFT-NJP-2018.pdf
            §§2.2,3.2,3.4–3.5, Tables4–5 및 conclusion (구조 비교 PDF pp10–13). 이전 독립 감사가 원문을 직접 확인한 위치를 재사용했으며 이번 본인의 직접 열람으로
            표시하지 않는다. 64-solid 계산의 SCAN-on-PBE-orbitals 한계까지 포함한 정성적 structure/cohesion/dispersion 범위만 승계한다.
          locations:
          - §1–§6; references/report.md 및 최종 recheck
          reason: 핵심 변경 주장과 해당 원문 passage를 확인했으며 타인의 확인을 본인의 직접 열람으로 표시하지 않는다.
        B2:
          rating: 2
          evidence:
          - 수치 benchmark 주장을 삭제했다. Virial은 Levy–Perdew 원문 식과 Kurzweil 독립 적용, fractional spin은 Cohen 계열 이론과 Bajaj 독립 계산, potential
            방향성은 Kronik/Kümmel와 Gori-Giorgi 원문으로 대조했다.
          - PBE 설계의 교차 근거는 원래 PRL p3867 Eqs12–14 (https://www.chem.uci.edu/~kieron/dft/pubs/PBE97.pdf)와 Kaplan review §III
            B/D (https://arxiv.org/pdf/2207.03855), PBEsol pp1–2 (https://arxiv.org/pdf/0707.2088)이다. 동일 원 논문의 DOI·author
            PDF·mirror는 하나로 센다.
          - Force/torque/virial은 Levy–Perdew 원문 abstract (https://journals.aps.org/pra/abstract/10.1103/PhysRevA.32.2010)와
            별도 저자의 원리 적용·수치 시험 Kurzweil/Head-Gordon §IIA Eqs4–9 (https://arxiv.org/pdf/0905.1260)를 결합한다. Fractional spin은
            Cohen 이론 Eqs1–3 (https://arxiv.org/pdf/0805.1724)과 Bajaj의 독립 계산 pp1–4/Fig1 (https://arxiv.org/pdf/1710.02378)으로
            뒷받침하며 동일 Cohen/Mori-Sánchez/Yang 계열 논문 두 편만으로 독립성을 주장하지 않는다.
          - 통상 방향 potential 점근형은 Kronik/Kümmel 원문 abstract DOI 10.1039/D0CP02564J와 Gori-Giorgi et al. §§I–II,IV–VI (https://arxiv.org/pdf/1109.2204v2)로
            교차검증했다. Density scaling은 Kaplan §III C Eqs62–65 (https://arxiv.org/pdf/2207.03855)와 Furness §II Eqs19–21 (https://arxiv.org/pdf/2110.00647)의
            별도 구성·적용으로 대조한다.
          - Separability는 Kaplan §III D Eq70 (https://arxiv.org/pdf/2207.03855)와 SCAN 원문 p3의 size-extensivity 설명·p4 Eq1 (https://arxiv.org/pdf/1504.03028)에
            대응한다. 전하 분배는 Mori-Sánchez Eqs1–10 (https://arxiv.org/pdf/0708.3688)와 Kraisler/Kronik Eq1 및 ensemble discussion
            (https://arxiv.org/pdf/1211.5950)으로 구분한다. 접근하지 못한 Perdew chapter [25] full text는 독립 근거 수에 포함하지 않는다.
          - 정성적 구조/응집 비교는 Isaacs/Wolverton의 별도 재료 계산과 Zhang의 독립 64-solid 데이터셋을 구별해 센다. 재사용 Zhang 위치는 §§2.2/3.2/3.4–3.5, Tables4–5,
            DOI 10.1088/1367-2630/aac7f0이며 형성에너지나 자기 성능을 해당 출처로 확장하지 않는다.
          locations:
          - §4(3), §6(8,11–12)
          reason: 같은 그룹의 파생 논문이나 미러를 별개 근거로 세지 않고 독립 설명·적용을 대응한다.
        B3:
          rating: 2
          evidence:
          - Capelle Eq.58–67와 Kaplan Eq.26–40,61–65를 본문과 대조했다. hole 정규화, scaling 인자, Hartree 기준 및 gap 부호가 맞는다.
          locations:
          - §1, §4(1–2), §6(2–7,9)
          reason: tau의 1/2와 spin 합, per-particle/per-volume 구분도 명시한다.
        B4:
          rating: 2
          evidence:
          - §6(8) nodal 방향 제외, §6(9) 비축퇴 high-density 조건, §4의 물성별 한계를 명시한다. 원문 접근 수준은 full PDF/abstract/caption/reused evidence로
            나누어 기록했다.
          locations:
          - §4–§6; direct-source-checks.md
          reason: 오차 통계량의 애매한 수치를 삭제하고 확인하지 못한 energy-density 세부를 검증 완료로 바꾸지 않았다.
    C:
      percent: 100.0
      criteria:
        C1:
          rating: 2
          evidence:
          - DFT/PBE는 도입부, rSCAN/r²SCAN/HSE는 첫 표, LC는 §5, HOMO는 §6(8)에서 먼저 확장한다. 삭제된 epsilon_xc^hole 기호는 표에서도 제거했다.
