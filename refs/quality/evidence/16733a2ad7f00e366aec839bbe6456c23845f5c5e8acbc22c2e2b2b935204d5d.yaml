  areas:
    A:
      percent: 100.0
      criteria:
        A1:
          rating: 2
          evidence:
          - 순열 대칭성과 공간 대칭성을 구분한 뒤 E(3) 작용·equivariance·상대좌표를 정의한다.
          locations:
          - 도입부·1절
          reason: 주기계에서는 격자까지 변환한다는 조건을 상대좌표 정의 직후에 보강했다.
        A2:
          rating: 2
          evidence:
          - E(3) → O(3) irrep → 방향 기저와 tensor product → convolution → nonlinearity·물리 출력 → 한계 순서이다.
          locations:
          - H2·H3 전체
          reason: 전체 본문과 heading을 대조했으며 큰 절 구성을 유지한다.
        A3:
          rating: 2
          evidence:
          - 표현 차원·multiplicity, 고정 CG 계수, 학습 radial weight를 구분한다. 예제는 비주기 유한계임을 명시한다.
          locations:
          - 2–4절; 6절
          reason: 주기계 변환과 고정 격자 안의 원자 변형, 전체 환경 변환과 원자만의 변환을 분리했다.
        A4:
          rating: 2
          evidence:
          - 코드의 harmonic·weight·message를 직전 식에 대응시키고 요약은 표현·tensor product·convolution·출력·한계를 회수한다.
          locations:
          - 4절 코드 뒤; 7절
          reason: 코드 방향이 본문과 반대였던 연결 오류를 수정했다.
    B:
      percent: 100.0
      criteria:
        B1:
          rating: 2
          evidence:
          - e3nn Convolution의 edge_vec 및 scatter, Periodic boundary conditions의 shift×lattice 식, Thomas §3.2–3.3 및 §4.1.1–4.1.3
            Eq.(2),(3)을 직접 읽었다.
          locations:
          - 1절·4절·6절; 참고문헌 2,3,5
          reason: 변경 설명은 직접 확인한 변환식과 본문 parity 식에서 도출했다. 변경하지 않은 과학 내용은 2026-08-13 full pass(content_hash ffbdc04ab967939e17de3a873cfc29eba9015e3e70bccd817c605a86ede77925)의
            적용 범위 내에서 승계하며 미기록 passage를 소급 생성하지 않는다.
        B2:
          rating: 2
          evidence:
          - 라이브러리 구현 문서와 Thomas 등의 Tensor field networks 연구 유도는 서로 다른 자료이며 미러를 중복 집계하지 않았다. 구현의 방향 규약과 수학적 equivariance를 대조했다.
          locations:
          - 참고문헌 2,3,5와 변경 문단
          reason: 두 출처의 개발 참여자 일부가 겹치는 한계가 있다. 본문 방향 선택·격자 동반 변환·전체 입력 조건은 새 경험적 주장 대신 명시된 정의의 직접 대수적 귀결이며, 로컬 실행으로 구현도 별도
            검증했다.
        B3:
          rating: 2
          evidence:
          - receiver i에서 sender j로 향하는 r_j−r_i로 통일했다. 공식 예제는 반대 방향이며 홀수 l의 부호가 바뀜을 기존 parity 식에서 설명했다.
          locations:
          - 1절 상대벡터; 4절 edge_vectors
          reason: 격자 shift까지 R로 변환하면 상대벡터도 Rr로 변환된다. row tensor 코드의 회전은 R.T이며 열벡터 본문 규약과 일치한다.
        B4:
          rating: 2
          evidence:
          - 비주기 예제와 주기 입력 확장을 구분하고 외부 환경 고정과 전체 입력의 반전을 구분한다.
          locations:
          - 4절 예제; 6절 한계
          reason: 기하적 chirality 자체가 별도 외부 입력을 요구한다는 오해를 제거했다. 새 성능·정확도 주장은 추가하지 않았다.
    C:
      percent: 100.0
      criteria:
        C1:
          rating: 2
          evidence:
          - 군 작용, l·m·parity, multiplicity, spherical harmonics, CG projection 순서로 정의한다.
          locations:
          - 1–3절
          reason: convolution에 사용되는 표현과 연산이 앞에서 소개된다.
        C2:
          rating: 2
          evidence:
          - triangle rule·parity rule 뒤 intertwiner identity로 rotation 변환을 유도하고 radial weight와 이웃 합의 역할을 설명한다.
          locations:
          - 3절 intertwiner identity; 4절 convolution
          reason: 정규화 z와 코드 mean_degree를 대응시키며 상대방향 정의를 코드와 일치시켰다.
        C3:
          rating: 2
          evidence:
          - 성분별 ReLU의 문제와 scalar gate를 연결하고 invariant energy의 미분에서 force를 얻는다. cutoff·lmax·parity 적용 한계를 구분한다.
          locations:
          - 4절 검사; 5절; 6절
          reason: 대칭성 검사가 정확한 물리 예측의 보장은 아님을 유지하고 병진 검사도 명시했다.
        C4:
          rating: 2
          evidence:
          - irrep 표와 vector tensor-product 표는 변환 법칙을 비교하고 convolution 그림은 방향·거리 경로를 설명한다. 코드 두 블록은 직접 실행했다.
          locations:
          - 2–3절 표; 4절 코드와 그림
          reason: 장식 요소를 추가하지 않았으며 기존 식·그림·코드의 역할을 보존했다.
