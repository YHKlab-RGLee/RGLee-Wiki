    dependency_chain: block 분할에서 정확한 제거와 역대입을 얻고 에너지 의존성·정규화·근사를 해석한 뒤 Green function 및 비직교 확장과 수치 검산으로 이어진다.
    reader_blocker: 작은 행렬의 고유값 가지가 왜 세 근을 주는지는 2(2)의 비선형 조건과 6절 pole별 이분법이 해소한다.
    strongest_revise_case: 원래의 locator 오류와 힘의 에너지 가중 세부주장 독립근거 부족을 수정 delta 및 원문과 재대조했다. 수정본에는 해당 blocker가 없어 full assessment
      pass이며 등록 후 publication gate는 별도이다.
  summary: 전체 본문·수식·6개 독립 원문·교육용 코드의 대응을 확인했다. 수정본의 locator와 SCF 범위 한정으로 두 지적이 해소되었으며 full 평가를 통과한다. publication gate는 main이
    등록 후 수행한다.
