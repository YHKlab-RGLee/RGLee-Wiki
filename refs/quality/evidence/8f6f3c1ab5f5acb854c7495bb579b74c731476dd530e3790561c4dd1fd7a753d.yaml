          evidence:
          - 도입부에서 coordinate projection과 제거를 구별하고 Hc=epsilon Sc 선행 두 문서로 연결한다. S=I, 유한 Hermitian 계에서 시작하여 S>0와 복소 z로 확장하는
            범위를 명시한다.
          locations:
          - 도입부
          - 1(1)
          reason: 필요한 좌표·차원·가정이 제거식 이전에 놓인다.
        A2:
          rating: 2
          evidence:
          - H2/H3만 별도로 읽어 active 분할→Schur complement→복원/근사→Green function→비직교→검산 순서를 확인했다.
          locations:
          - H1–H3 전체
          reason: 정의·지배식·적용·한계의 의존 순서가 명확하다.
        A3:
          rating: 2
          evidence:
          - EI-H의 정확한 Schur complement와 E0 고정 근사를 분리한다. 유한계 Hermitian 제거, retarded 반무한 lead, 비직교 matrix pencil을 구별한다.
          locations:
          - '2'
          - 3(2)
          - 4(2)
          - '5'
          reason: 근사와 정확식, 기저변환과 차원감소를 혼동하지 않는다.
        A4:
          rating: 2
          evidence:
          - 3절은 2절 역대입을 T(E)와 norm으로 회수하고 6절은 일반식을 같은 모형에 적용한다. 요약 여섯 항목은 본문의 결과만 회수한다.
          locations:
          - 3 도입
          - '6'
          - '7'
          reason: 전환에서 필요한 확장 이유를 제시한다.
    B:
      percent: 100.0
      criteria:
        B1:
          rating: 2
          evidence:
          - '직접검사 G1 — 분할·coordinate projection·정확 제거·역대입·pole·nonlinear 근: Marzari et al. https://arxiv.org/pdf/1112.5411
            PDF p.20 §III.B.2 Eqs.(68)–(71); Dusson et al. https://arxiv.org/pdf/2105.02058 PDF pp.4–5 Theorem1.2, Corollary1.3,
            Eqs.(1.10)–(1.16). 두 원문은 각각 전자구조 리뷰와 Feshbach-Schur 수학 연구이며 동일 논문 미러가 아니다. 본문 1–2절의 부호는 -(HBB-E)^-1=(E-HBB)^-1로
            변환해 확인했다.'
          - '직접검사 G2 — norm·관측량·정적근사·오차상한: https://arxiv.org/pdf/1112.5411 p.20 Eqs.(69)–(71) 및 E0 고정 설명; https://arxiv.org/pdf/2105.02058
            pp.4–5 Eq.(1.11), (1.15)–(1.16), pp.8–9 Proposition2.2. 본문 3절 T†T, Sigma 미분, 관측량 분수, resolvent identity 및 v²w/[Delta(Delta-w)]는
            출처의 복원/제거식에서 본문이 명시적으로 유도한 결과로 대수 재검산했다. 해당 bound가 원논문에 그대로 실렸다고 기록하지 않는다.'
          - '직접검사 G3 — Green function·입력 소거·유한계/lead 구분: https://arxiv.org/pdf/0908.4142 PDF pp.2–4 §§II.A–C Eqs.(6)–(8),
            retarded E+i0; https://arxiv.org/pdf/cond-mat/0110650 PDF pp.2–4 §§II–III.A Eqs.(1),(7),(11). 유한계 Hermiticity는
            G1의 두 출처와 대비했다. 본문 4(1) 입력 보정은 Kc=f의 두 번째 block을 대입한 직접 유도이며 대수 검산했다. 임의 finite eta를 물리적 lead 수명과 동일시하지 않는 한정이
            정확하다.'
          - '직접검사 G4 — 비직교 zS-H·같은 z·norm: https://arxiv.org/pdf/0908.4142 p.3 Eqs.(2),(6)–(8)는 양 coupling에 같은 Z를 쓴다; https://arxiv.org/pdf/cond-mat/0110650
            p.4 §III.A Eqs.(9)–(13)는 G=(zS-H)^-1과 -zS 보정을 정의한다. 본문 5(1)의 tau adjoint는 두 기본식과 Hermitian H,S로부터 직접 확인; norm의
            block 전개도 동일 AO inner product의 대수 결과이다. Ozaki pp.4–5 밀도 및 경계 overlap 기여, Brandbyge pp.4,14의 밀도/Mulliken 구별과 일치한다.'
          - '직접검사 G5 — Löwdin 직교화: Naidu https://arxiv.org/pdf/1105.3571 PDF p.2 Eqs.(1)–(5), p.3 Eqs.(6)–(7); Torun https://arxiv.org/pdf/2209.03746
            PDF p.2 §§II.A–B Eqs.(1),(3)–(5). 서로 다른 저자가 독립적으로 metric inverse-square-root 변환을 설명한다. 본문 5(2)의 Htilde와 차원/고유값
            보존은 invertible basis transformation의 직접 유도이며, 열혼합 뒤 partition 의미가 달라질 수 있다는 결론도 같은 변환에서 확인했다. 절단은 전차원 가역변환의 가정을
            깨는 경우로 한정한다.'
          - 직접검사 G6 — 교육용 수치와 비용은 G1/G2 식을 실제 NumPy 실행해 검산했고 세 nonlinear 근·복원 norm·residual·overlap이 표시값과 일치했다. 비용은 https://arxiv.org/pdf/2105.02058
            PDF p.5 Corollary1.3 뒤 inverse/fixed-point 설명 및 https://arxiv.org/pdf/1112.5411 p.20 정적근사와 대응한다. 최종 §6의 밀도/SCF
            및 별도 관측량 검증 한계는 https://arxiv.org/pdf/0908.4142 pp.3–5 §§II.A,C,D Eqs.(6),(22)–(27)와 https://arxiv.org/pdf/cond-mat/0110650
            pp.3–4 §§II–III Eqs.(8),(15), p.7 §IV.B에서 확인한다. 힘을 별도로 검증해야 한다는 한정은 Ozaki p.5 힘/밀도 설명 및 Brandbyge p.13 §VI.B.4의
            density/Hamiltonian 사용과 양립한다. 에너지 가중 정보에 대한 단일출처 세부주장은 수정본에서 제거되었다. 코드 불변으로 최초 버전 실제 실행근거를 재사용했다.
          locations:
          - 1–6의 인접 인용 [1–6]
          - 8 참고문헌
          reason: 전체 주장군의 원문 직접 확인 및 명시적 유도/수치검산을 구별했다. 수정본의 SCF 문장과 [4] locator도 원문으로 재대조했다.
