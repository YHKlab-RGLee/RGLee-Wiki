        B3:
          rating: 2
          evidence:
          - k=1에서 Vstart와 N=1이 일치한다. 시간은 중복 없는 구간 합, RBER는 조건부 오류 bit 수의 기대값이다. VBL은 source 기준 전압이다.
          locations:
          - 2절 pulse·시간 식; 3절 RBER 식; 5절 전압
          reason: 인덱스 이동은 물리적 전압 열을 보존하며 Hamming distance는 LDPC code distance가 아닌 상태 bit pattern의 거리이다.
        B4:
          rating: 2
          evidence:
          - EXPRESS의 most-cells 종료를 모든 제품의 all-pass 종료로 바꾸지 않았다. RBER 유도는 본문 자체 기대값 유도이며 출처 원식으로 주장하지 않는다.
          locations:
          - 2절 all-pass 한정; 3절 hard read 조건
          reason: 실측 결과와 설명용 mapping 예, 정의에서 도출한 식을 구분한다.
