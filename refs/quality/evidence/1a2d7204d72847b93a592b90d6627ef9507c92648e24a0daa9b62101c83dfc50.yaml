          - '[3] Koepernik–Janson–Sun–van den Brink의 독립 projection 연구가 projection/Löwdin/초격자 Fourier/Hamiltonian/연산자/보간을 재구성한다.
            [4] Damle–Levitt–Lin의 독립 변분 연구가 직사각 gauge, frozen 제약과 두 단계 최적화 한계를 분석한다. 프리프린트와 출판본을 별개 출처로 세지 않았다.'
          - '두 출처 대응: 1–2절 [1]+[3] 및 [2]; 3절 [1]+[2]/[4]; 4절 [1]+[2]/[4]; 5절과 6절 보간/연산자 [1]+[3]; topology 한계 [2] §3.2–3.3+[4]
            §2. 구현 가중치 문장은 최종판에서 제거되었다.'
          locations:
