          reason: 핵심 개념을 정의하고 선행 문서를 통해 일반 투영 이론으로 연결한다.
        C2:
          rating: 2
          evidence:
          - A,S,Q,V,U,T의 역할·크기, Gram 역제곱근, 주기 부분 overlap, trace, Fourier 부호, 에너지 및 길이제곱 단위를 식 옆에서 설명한다. 6×3 예제가 차원 제한을 구체화한다.
          locations:
          - 1–5절
          - 329행
          reason: 식이 답하는 질문과 적용 조건이 명확하며 기호를 독자가 복원해야 하는 공백이 없다.
        C3:
          rating: 2
          evidence:
          - 작은 Gram 고유값의 증폭, 공간 매끄러움과 국소화, frozen 보존과 미보존 band, 입력점 공간 오차와 새 점 보간 오차를 원인·결과로 연결한다. 국소화 자체와 차원 축소도 분리한다.
          locations:
          - 13행
          - 2(2)
          - 3절
          - 5–6절
          reason: 어떤 정보가 보존·제외되는지와 실패 시 확인할 조건을 구체적으로 제시한다.
        C4:
          rating: 2
          evidence:
          - 31개 display 식은 변환·직교성·spread·Hamiltonian을 전개하며 7개 표는 단계, 차원, 실패, window, 최적화, 기호 대응, 검증 대상을 비교한다. 독립 benchmark는
            9636자/8334.13자, 요소38/28.80으로 통과했다.
          locations:
