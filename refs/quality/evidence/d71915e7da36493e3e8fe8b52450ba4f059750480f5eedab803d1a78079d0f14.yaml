  areas:
    A:
      percent: 100.0
      criteria:
        A1:
          rating: 2
          evidence:
          - 도입이 Bloch 입력과 Wannier/Hamiltonian 출력을 정의하고 단계 표를 제시한다. 새 문단은 세 기초 문서의 역할과 국소화·차원 축소의 차이를 먼저 밝힌다.
          locations:
          - 도입 7–23행
          - 1(1) 29–51행
          reason: 목적·범위와 선행 지식, 정규화가 상세 계산 전에 놓인다.
        A2:
          rating: 2
          evidence:
          - H1–H3를 별도로 읽어 입력 band → projection/Löwdin → disentanglement → 최대 국소화 → Hamiltonian/보간 → 검증의 순서를 확인했다.
          locations:
          - 전체 H2–H3 목록
          reason: 명사구 제목이 공간 선택과 기저 회전의 의존 관계를 보여 주며 본문 전개와 일치한다.
        A3:
          rating: 2
          evidence:
          - 정사각 unitary와 직사각 선택, frozen 입력점 보존과 새 점 보간, 연속 spread와 격자 근사를 구별한다. 새 대응표는 입력 Bloch 계수 공간의 identity metric에 한정한다.
          locations:
          - 13행
          - 2(2)
          - 3(1)
          - 4(2)–4(3)
          - 5(1) 318–327행
          reason: 모형의 차원·기저·보간 근사를 혼동하지 않으며 각 주요 절이 지배 관계를 먼저 제시한다.
        A4:
          rating: 2
          evidence:
          - 2절 끝의 Q, 3절 끝의 고정 공간, 4절의 T가 다음 절의 입력으로 회수된다. 요약은 본문에서 확립한 다섯 단계만 재진술한다.
          locations:
          - 135행
          - 200행
          - 303–316행
          - 7절
          reason: 전환이 앞선 결과를 활용하며 새로운 미지원 결론을 추가하지 않는다.
    B:
      percent: 100.0
      criteria:
        B1:
          rating: 2
          evidence:
          - '직접 확인: [1] II.A Eqs3–8 및 II.I, [2] Eqs16–18과 §4.3은 국소화의 가역 기저변환과 더 작은 부분공간 선택을 구별한다. 도입 13행과 대응한다.'
          - '직접 확인: [1] VI.A Eqs98–102 및 [4] Eqs2.7–2.15, Proposition3.1은 직교 gauge와 projector를 제시한다. 318–327행의 Galerkin 대응은
            이 변환과 선행 Projection methods §1, §5의 잔차 조건을 대입한 명시적 해석이다.'
          - '직접 확인: [5] §II의 Bloch 표본·직교화와 Eqs4–5, [6] §II.A의 원자 pz tight-binding과 §II.B Eqs8–13은 Wannierization 없이 mode basis를
            구성한다. 390행의 가능성 주장에 대응한다.'
          - 변경되지 않은 1–6절의 상세 출처 passage는 refs/quality/evidence/1a2d7204d72847b93a592b90d6627ef9507c92648e24a0daa9b62101c83dfc50.yaml의
            B1–B4 근거를 재사용한다. 초기 판단 기록 후 읽었으며 snapshot SHA와 diff로 적용 범위를 확인했다. 이를 이번 직접 확인으로 간주하지 않는다.
          - 초기 발견 사항을 기록한 뒤 references/result.yaml과 evidence.md를 대조했다. 동일 SHA의 C1–C3 원문 위치·규약 검산이 이번 독립 직접 확인과 일치하며 새 충돌은
            없다. 참고문헌 담당의 확인을 본인의 직접 확인으로 기록하지 않았다.
          locations:
          - 도입 13행
          - 5(1) 318–327행
          - 6(2) 390행
          - 기존 1–6절
          reason: 변경 주장에는 인접 인용과 직접 passage 확인이 있으며 동일한 기존 문장에는 provenance가 있는 유효 근거가 이어진다.
        B2:
          rating: 2
          evidence:
          - '[1] Marzari 연구진의 이론과 [2] Kuneš의 별도 수학적 설명, [4] Damle–Levitt–Lin의 독립 변분 정식화가 변경된 공간/기저 주장을 지지한다. 단순 원 논문 인용 목록이나
            미러를 중복 계산하지 않았다.'
          - '[5] Huang 연구진의 원자 nanowire mode-space 구현과 [6] Grassi 연구진의 graphene pz 구현은 별도 계통의 계산 구성으로 390행을 지지한다.'
          - 기존 근거에서 1–2절 [1]+[3], 3–4절 [1]+[2]/[4], 5–6절 [1]+[3] 대응을 확인하고 변경 없는 부분에만 재사용했다.
          locations:
          - 본문 인용 묶음
          - 참고문헌 1–6
          reason: 새 주장은 독립된 두 원문의 같은 의미로 확인되며 이전 근거의 적용 범위도 유지된다.
        B3:
          rating: 2
          evidence:
          - 새 표에서 기초 문서의 V,W를 모두 이 문서 T에 대응시키며, 본문의 선택 V와 별개임을 명시한다. T=VU에서 TT†=VUU†V†=VV†를 독립 검산했다.
          - '[4]의 전체 직사각 U는 본문 T에 대응하고 내부 unitary는 본문 U이다. [1] VI.A의 interpolation gauge U와 본문 초기 gauge의 방향 차이를 구별하여 식의 congruence를
            확인했다.'
          - 기존 정규화·Fourier 부호·spread 길이제곱 규약은 본문 전독과 이전 근거의 정규화 대조로 확인했다. 변경은 이를 바꾸지 않는다.
          locations:
          - 1(1)
          - 3–5절
          - 318–327행
          reason: 계수/함수 공간, 행렬 크기, gauge 기호와 물리 단위 사이에 모순이 없다.
        B4:
          rating: 2
          evidence:
          - 본문은 국소 최솟값, topology/대칭 제약, hopping 절단과 격자 오차, band 이외 연산자 검증을 명시한다. 기존 직접 근거의 동일 범위를 재사용했다.
          - '[5,6]의 PDF와 arXiv 서지 페이지에서 제목·저자·Journal of Applied Physics 권/논문번호·연도·DOI를 직접 대조했다. 기존 1–4 서지 검증은 버전이 같은 이전 근거에서
            재사용했다.'
          locations:
          - 4(3)
          - 5(2)
          - 6(2)
          - 8절
          reason: mode-space 관계는 구성 가능성에 한정하며 모든 TB 모형의 정확성이나 자동 성공으로 확대하지 않는다.
    C:
      percent: 100.0
