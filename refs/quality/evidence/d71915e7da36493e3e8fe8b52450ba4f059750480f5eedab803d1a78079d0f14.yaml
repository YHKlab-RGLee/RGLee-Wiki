  critical_questions:
    dependency_chain: 정규화와 차원을 정의한 뒤 초기 투영·직교화, 부분공간 선택, unitary 국소화, Hamiltonian 변환·보간과 단계별 검증으로 이어진다.
    reader_blocker: 여러 V 기호의 역할이 처음에는 혼동될 수 있으나 새 대응표와 바로 뒤의 계수 공간 설명이 이를 명시적으로 풀어 준다.
    strongest_revise_case: 국소화를 차원 축소로 읽거나 두 응용을 필수 연쇄로 오해할 가능성이 있었지만 현 문장은 정확한 변환과 부분공간 제한을 나누고 독립적인 mode-space 구성을 두 원문으로
      지지한다. 미해결 강제 수정 조건은 발견하지 않았다.
  summary: 상세 물리 설명을 보존하면서 기초 투영 개념과의 대응 및 mode-space 관계를 정확히 추가했다. 전체 rubric과 coverage, scoped 직접 출처 대조 및 유효 근거 재사용, 현재 strict-render
    근거에서 full assessment pass이며 최종 등록·publication gate는 메인에 남는다.
