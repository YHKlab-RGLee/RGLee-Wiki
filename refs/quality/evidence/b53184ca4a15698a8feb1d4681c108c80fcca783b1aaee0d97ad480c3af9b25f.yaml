            미분 정의를 명시했다.
          locations:
          - 전류·전도도
          reason: 본문의 의존 관계와 적용 조건을 대조했다.
        B4:
          rating: 2
          evidence:
          - 보간식은 균일 저전계 모형에 한정한다. Coherent interference에는 양자 모형을 요구하며 BTE 단독 해법으로 제시하지 않는다. 기존 참고문헌의 식별자를 보존했다.
          locations:
          - 4·7절
          reason: 본문의 의존 관계와 적용 조건을 대조했다.
