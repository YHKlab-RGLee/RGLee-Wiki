          reason: Bloch 구성·투영·가짜 해·NEGF·비용·확장에 실제 passage가 대응하며 가상 예와 자체 정의 지표도 구분한다.
        B2:
          rating: 2
          evidence:
          - '주기 모형·Bloch 기저·투영(§§1–3): Mil’nikov SISPAD 2011 Eqs(1)–(4)의 원래 유도와 Huang §II Eqs(4)–(6), Shin §IV Eqs(2)–(12)의
            별도 구현을 대조했다. SVD는 Huang §IV(A)에 명시되며 Mil’nikov/Shin의 common-span orthonormalization과 같은 선형대수 구성이다.'
          - '가짜 해·기저 보완·검증(§3): Mil’nikov p.316 §III의 orthogonal complement, Huang §§II–III의 spurious band 이동 및 비표본 파수 검사,
            Shin §III의 독립 구현을 교차 확인했다. 공통 방법 계보는 있으나 논문 사본을 독립 근거로 세지 않았다.'
          - '열린 장치와 transmission(§4): 별도 graphene 구현인 Grassi §II Eqs(1),(9)–(13), Lewenkopf/Mucciolo Eqs(15)–(18)의 수송 유도,
            Ozaki Eqs(6)–(8),(52)의 비직교 수송 유도가 같은 retarded 부호와 trace 범위를 지지한다.'
          - '비용(§5): Huang introduction의 block 차원에 대한 cubic cost/quadratic storage와 Grassi Eq.(13) 뒤의 RGF scaling을 대조했다. M→m
            치환은 동일 cell 분할과 조밀 block이라는 본문 조건에서 수행한다.'
          - '위치별 기저·CMS/UMS(§6): Shin Eq.(5), Grassi §II(B) 및 §III disorder 비교, 독립 effective-mass 연구인 Luisier §I의 결합 조건을 대조했다.
            Luisier를 atomistic Bloch 기저 구성 근거로 확대하지 않았다.'
          - '산란(§6): Grassi §II의 phonon 변환과 Lemus §§2.3–2.4의 form factor를 독립 쌍으로 사용했다. Huang과 Lemus의 관련 시뮬레이션 계보만으로 독립 쌍을
            만들지 않았다. 비직교(§6)는 Shin Eqs(6)–(8)와 Ozaki Eqs(3)–(10)을 대조했다.'
          - 각 DOI와 arXiv/저자-hosted 사본은 한 출처로만 계산한다. 문헌의 에너지 표본과 본문의 k 표본 차이, 실수 transpose와 복소 dagger 차이를 정합화했다. 자체 수학 예는 새
            물리 경험칙으로 계산하지 않았다.
          locations:
          - §§1–6 주장별 바로 뒤 인용 묶음
          - 참고문헌 [1]–[8]의 위 명시 section/equation
          reason: 독립 연구의 같은 범위와 규약이 지지한다. SVD는 명시된 구현과 orthonormal span의 동등성을 대조했고 대수적 예를 새 물리 결과로 세지 않았다.
