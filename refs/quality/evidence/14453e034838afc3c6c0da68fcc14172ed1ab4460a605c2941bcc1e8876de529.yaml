          - §2의 4×6→4×2 가상 차원 예, §3의 Q 및 r_nk 범위, §4의 U†(vI)U=vI 및 Delta_T는 명시된 정의에서 직접 대수 검산했다. 논문 수치 재현이나 문헌 공통 허용값으로 취급하지
            않았다.
          locations:
