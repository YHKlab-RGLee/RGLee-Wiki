        B2:
          rating: 2
          evidence:
          - 연산 규약은 PyTorch 공식 명세와 D2L의 별도 수학·실행 구현을 대조했다.
          - VGG와 Inception 구성은 원 논문과 Torchvision 또는 D2L의 독립 실행 구현을 대조했다. D2L의 여러 장은 하나의 provenance로 계산했다.
          - 이론적/유효 수용영역은 Araujo 등의 유도와 Luo 등의 gradient 분석을, 자원과 측정 조건은 CS231n의 독립 계수와 Canziani 등의 장치 측정을 대조했다.
          - 같은 논문의 HTML·PDF·미러는 추가 독립 근거로 계산하지 않았다.
          - 6절 준비 실행과 동기화는 공식 benchmark 문서 [19]와 독립 교재의 실제 비동기 측정 예제 [20]가 같은 범위를 지지한다.
