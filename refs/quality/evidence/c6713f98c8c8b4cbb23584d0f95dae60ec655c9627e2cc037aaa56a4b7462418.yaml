        B3:
          rating: 2
          evidence:
          - D2L total padding은 본문의 한쪽 padding 2p와 일치하도록 정리한다.
          - group 연결은 총 출력 채널을 다시 절반으로 세지 않는다.
          - MAC는 내적만, FLOP는 약 2 MAC, 가중치와 bias는 별개로 정의하며 표의 단위를 million/billion으로 밝힌다.
          - RF는 입력부터 누적한 r,j로 통일하고 Distill의 역방향 재귀와 동일한 누적식을 사용한다.
