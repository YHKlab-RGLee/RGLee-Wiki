      - 새 [3][4]의 mode-space 원문과 [8] Damle 원문의 저자·제목 및 URL, 기존 [1][2][5]–[7][9][10] 매핑을 직접 확인했다. Frozen [1][7][8]은 passage
        내용과 독립성 모두 대응한다.
