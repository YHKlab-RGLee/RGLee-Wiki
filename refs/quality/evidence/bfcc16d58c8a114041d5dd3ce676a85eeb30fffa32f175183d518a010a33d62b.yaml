  areas:
    A:
      percent: 100.0
      criteria:
        A1:
          rating: 2
          evidence:
          - 도입은 Wannierization의 목표와 주기적 단일입자 Hamiltonian이라는 범위를 먼저 정의하고, J와 입력 Bloch 상태를 구성 표 앞에서 소개한다.
          - 선행 DFT 문서로 연결하고, projection과 Löwdin 직교화가 초기 frame이고 disentanglement는 조건부 단계임을 밝힌다.
          locations:
          - 도입 7–23행
          reason: 핵심 문제, 적용 범위와 선행 기호가 세부 수식보다 먼저 제시된다.
        A2:
          rating: 2
          evidence:
          - H2 순서는 Bloch–Wannier 변환, projection/직교화, 고정 공간의 국소화, entangled 부분공간, Hamiltonian/interpolation, 검증/한계, 요약이다.
          - 23행은 설명 순서상 3절이 앞서지만 실제 entangled 계산은 4절의 V 선택 뒤 3절의 U 최적화임을 명시한다.
          locations:
          - H2·H3 전체
          - 도입 13–23행
          reason: 목차만으로 정의에서 구성과 검증까지의 의존 순서를 읽을 수 있으며, 교육적 순서와 실행 순서의 차이를 본문이 해소한다.
        A3:
          rating: 2
          evidence:
          - §1은 고립된 J-band의 정사각 U를 먼저 정의하고, §2는 full-column-rank A의 Q, §3은 고정 공간의 Ω̃, §4는 직사각 V의 Ω_I 선택을 분리한다.
          - §5는 T=U 또는 VU에 따른 정사각/직사각 H 변환과 입력점의 부분공간 오차, 새 점의 Fourier 보간 오차를 구분한다.
          locations:
          - §1(2)
          - §2(2)
          - §3(1)
          - §4(1)
          - §5(1)
          reason: 일반 기저 변환, 조건부 부분공간 근사와 이산 보간을 서로 다른 모형 계층으로 다룬다.
        A4:
          rating: 2
          evidence:
          - 도입 표 뒤 전환은 3·4절의 순서 차이와 초기 frame의 한계를 회수한다.
          - §6 점검표는 rank, spread, 입력점과 새 점 검사를 앞 절의 식과 연결하고, §7은 이 구별만 요약한다.
          locations:
          - 23행
          - §6(1)
          - §7
          reason: 전환과 요약이 기존 관계를 재사용하며 별도의 미검증 수치나 결론을 추가하지 않는다.
    B:
      percent: 100.0
      criteria:
        B1:
          rating: 2
          evidence:
          - '직접 확인: Marzari et al. RMP PDF §II.B Eq.16–17, §II.I pp.10–12, §VI.A Eq.98–102; Kuneš PDF §§4.1–4.3; Souza et
            al. PDF §III.G; Higham PDF Theorem 2.2/Corollary 2.3; Wannier90 tutorial 3 및 files 문서. 구성과 주요 식은 해당 passage와 부합한다.'
          - 60행의 NEGF mode-space 비교는 Wannier 측 [1][2]와 mode-space 측 [3] Huang arXiv:1710.08064v2 §II Eq.4–5, [4] Mil’nikov
            SISPAD 2011 §II Eq.1–4가 각각 직접 뒷받침한다.
          - 333행의 frozen 조건은 [7] Souza §III.G와 독립 저자의 [8] Damle–Levitt–Lin §2 Eq.2.12–2.15에서 직접 확인된다. 후자는 frozen projector
            포함과 |N_f(k)|≤N_w≤N_o를 함께 명시한다.
          locations:
          - 도입 13–23행
          - §1(2) 60행
          - §4(2) 333행
          - 참고문헌 1–10
          reason: 변경 주장과 기존 핵심식의 직접 passage 대응을 확인했다. 독립 provenance의 별도 문제는 B2에 반영한다.
        B2:
          rating: 2
          evidence:
          - Projection과 국소화 단계는 Marzari RMP §II.B–C와 별도 저자 Kuneš §§4.1–4.2가 함께 설명한다. Higham의 polar-decomposition 정리는 Löwdin
            최소 거리 해석을 별도 수학 근거로 뒷받침한다.
          - 구성 표 17행은 이제 frozen 제약의 과학적 주장 대신 기존 §4로 가는 포인터이며, 21행은 선택 공간의 V† M V 중첩을 명시한다. Marzari RMP §II.I와 Kuneš §4.3의
            공간/게이지 분리 및 선형대수와 맞는다.
          - 60행 mode-space 비교는 다른 저자들의 원 연구 Huang [3] §II와 Mil’nikov [4] §II가 직접 뒷받침한다.
          - §4(2)의 frozen 포함 및 J_f≤J≤J_k는 [7] Souza §III.G의 M_k≤N≤N_k와 [8] Damle–Levitt–Lin author PDF §2 Eq.2.12–2.15의 |N_f(k)|≤N_w≤N_o,
            P_wP_f=P_f로 각각 직접 확인된다. 후자는 다른 저자들의 별도 변분 정식화이며, 가변 outer-band 수 허용도 각주로 명시한다.
          locations:
          - 도입 17·21행
          - §1(2) 60행
          - §4(2) 333–348행
          reason: 새 map과 mode-space뿐 아니라 기존 frozen 절의 중심 제약도 직접 인용된 독립 연구 계열 두 개와 부합한다.
        B3:
          rating: 2
          evidence:
          - §1(1)은 초격자에서 ψ, 단위격자에서 u를 정규화하고 양방향 Fourier에 1/√N_k를 택한다. Marzari RMP §II.A.3 Eq.14–15의 같은 규약과 대조했다.
          - §3(2)의 중심 부호와 Ω_I 유한차분은 Marzari Eq.27–30 및 Kuneš Eq.38–40과 맞는다. §5의 H(R) 음의 지수와 역변환 양의 지수는 RMP Eq.98·101과 맞는다.
          locations:
          - §1(1)
          - §3(2)
          - §5(1)
          reason: 부호, 정규화, 행렬 차원과 길이 제곱 단위가 읽은 원문 및 문서 내부에서 일치한다.
        B4:
          rating: 2
          evidence:
          - §2는 full rank와 작은 singular value의 실패를, §3은 local minimum과 finite-grid 한계를, §4–§5는 frozen 밖의 비정확성과 새 점 보간 오차를 명시한다.
          - 참고문헌 1–10의 제목 및 URL은 해당 원문/PDF 또는 공식 문서 첫머리와 대조했다. 새 [3] Huang, [4] Mil’nikov, [8] Damle–Levitt–Lin의 저자·제목은 직접
            연 원문과 일치하며, [8]의 저널·권·쪽·DOI는 SIAM 출판 페이지에서도 대조했다.
          locations:
          - §2(3)
          - §3(3)
          - §4(2)
          - §5(1)
          - §8
          reason: 범위와 실패 조건을 숨기지 않고 서지 정체성이 맞는다. Frozen 조건에 쓰인 Damle 원문은 가변 outer-band 수의 각주까지 문서의 J_k 규약과 대조했다.
    C:
      percent: 100.0
      criteria:
        C1:
          rating: 2
          evidence:
          - 첫 문단에서 Wannier function과 Wannierization을 정의하고 BZ, MLWFs, SVD를 첫 본문 사용에서 푼다.
          - 도입의 5단계 표와 §2(2)의 조건부 J=J_k=2 예가 A/S/Q에서 M/U/E/H까지 차원과 보존량을 추적하게 한다.
          locations:
          - 도입 7–23행
          - §2(2) 157행
          reason: 새 독자는 단계별 입력·출력과 두-band 사례를 따라갈 수 있다. 표의 수식 밀도는 높지만 바로 뒤 절들이 정의를 확장한다.
        C2:
          rating: 2
          evidence:
          - A는 J_k×J, S는 Gram, Q는 full-rank에서 열 정규직교라고 정의하며 두-band 예에서 2×2로 검산한다.
          - Ω의 길이 제곱 차원, b의 역길이와 w_b의 길이 제곱, T†ET의 정사각/직사각 뜻과 H(R)의 hopping 의미를 식 가까이 설명한다.
          locations:
          - §2(1)–(2)
          - §3(1)–(2)
          - §5(1)
          reason: 핵심 식의 기호, 조건과 계산 질문이 충분히 정의되어 있다. 새 21행은 entangled 경우 후보 M을 V로 제한해 J×J 중첩으로 만든 뒤 U를 적용하는 행렬 순서를 명시한다.
        C3:
          rating: 2
          evidence:
          - §2는 trial orbital의 투영 손실, rank 실패, Löwdin 최소 변형과 spread 최소화의 차이를 연결한다.
          - §4–§6은 V 선택의 부분공간 오차, U gauge 최적화, Fourier 보간 오차, 추가 연산자 입력 및 위상 장애를 분리해 실패 조건을 설명한다.
          locations:
          - §2(1)–(3)
          - §4(1)–(2)
          - §5(1)
          - §6
          reason: 원인과 지배 관계에서 결과·검증으로 이어지고, 보존 정보와 손실 정보를 구분한다.
        C4:
          rating: 2
          evidence:
          - 도입 표는 단계별 입력·출력·판단을, §2의 예는 행렬 차원을, §2·§4·§6의 표는 rank 실패, window 정확성, 단계별 검증을 각각 담당한다.
          - Material CSS의 .md-typeset table:not([class]) 규칙은 max-width:100%, overflow:auto, touch-action:auto로 설정되어 긴 표를 가로
            스크롤할 수 있게 한다.
          locations:
          - 도입 13–21행
          - §2(2)–(3)
          - §4(2)
          - §6(1)
          - experiment/wannier_build_flow/site/assets/stylesheets/main.*.min.css
          reason: 설명 요소가 비교와 절차 판단에 쓰인다. 실제 390px 브라우저 스크린샷 검사는 Firefox headless 충돌로 수행되지 않았으므로 모바일 시각 검증은 완료되지 않았다.
