      - ./quality.sh report docs/computational-materials-science/electronic-structure/wannierization.md
      reason: 내부 link/nav·registry hash와 현재 버전 렌더 증거가 맞는다. Pending full 외 자동 검사 실패는 보고되지 않았다. 등록 뒤 최종 gate는 아직 수행되지 않아 게시
        승인으로 해석하지 않는다.
  critical_zero_failures: []
  forced_revise: []
  critical_questions:
    dependency_chain: 선택할 band 공간과 정규화를 정의한 뒤 projection/직교화로 초기 frame을 만들고, 필요하면 V로 부분공간을 선택한 뒤 U로 gauge를 최적화하며, Hamiltonian을
      Fourier 보간하고 입력점·새 점을 따로 검증한다.
    reader_blocker: 도입의 기호 밀도는 높으나 표 다음에 M의 선택 공간 변환을 설명하고 각 절이 필요한 정의를 제공해 치명적인 읽기 장애는 남지 않았다.
    strongest_revise_case: 가장 강했던 §4 frozen 근거의 독립성 문제는 [8] Damle의 직접 해당 식을 인용함으로써 해결됐다. 남은 F1–F5 조건이 없어 현 버전은 pass이다.
  summary: 5단계 구성 표, 조건부 두-band 예, V† M V 설명이 생성 순서와 행렬 차원을 구체화하며 기존 고급 내용도 정합적이다. 새 mode-space 및 frozen-window 인용을 직접 독립
    원문과 확인했고, 현 버전의 전 항목이 pass이다.
