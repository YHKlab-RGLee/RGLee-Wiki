          reason: 원인과 지배 관계를 계산 결과로 연결하고 보존·실패 조건을 제시한다.
        C4:
          rating: 2
          evidence:
          - 40개 설명 요소가 크기·개념·비용·오차 비교 또는 계산을 수행한다.
          - Python 코드가 이전 직접 실행한 코드와 동일함을 확인하여 모든 assert와 예상 출력 일치 증거를 재사용한다.
          - 현재 benchmark는 글자 10614/8995.05, 설명요소 40/28.90으로 통과했다.
          locations:
          - 1–6절 표와 식
          - 5(4)
          - quality/code-check.txt
