          - 4절
          reason: 핵심 식의 질문·기호·가정과 해석이 드러나며 시간 끝점 표기도 구별되었다.
        C3:
          rating: 2
          evidence:
          - 작은 잔차/행렬 오차와 큰 상태 오차가 공존하는 예제를 구성한다.
          - 고유값이 음수인 원래 행렬에서 양의 축소 계수가 나오는 반례를 직접 검산했다.
          locations:
