      criteria:
        A1:
          rating: 2
          evidence:
          - 도입에서 FOM/ROM과 목표 출력·비용을 먼저 정의하며 유한차원 선형 모형 및 제외 범위를 제시한다.
          - 1(1)의 상태·입력·출력 크기표와 1(2)의 해집합이 후속 논의의 전제가 된다.
          locations:
