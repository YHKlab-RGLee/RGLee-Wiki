          - 1(1)–1(2)
          reason: 목적과 사용 영역을 정한 뒤 공통 기호를 소개하므로 후속 알고리즘 문서의 선행 내용으로 적절하다.
        A2:
          rating: 2
          evidence:
          - H1–H3만 별도 읽었다. 기준 모형→기저변환·부분공간·저랭크→오차→비용→예제→검증·구조 순서이다.
          locations:
          - 전체 H2·H3 목록
          reason: 같은 수준의 개념과 적용 절을 구분하며 의존 관계가 제목만으로 드러난다.
        A3:
          rating: 2
          evidence:
          - 정확한 가역변환, 부분공간 표현 근사, 축소 방정식을 구별한다.
          - 3(4)는 연속·FOM·ROM·수치 계산을 분리하고 6(2)는 정적 양의 정부호와 동적 안정성 조건을 구분한다.
          locations:
          - 2절
          - 3(4)
          - 6(2)
          reason: 일반 모형·가정·근사·합성 예제 사이에 잘못된 계층 혼동을 발견하지 않았다.
        A4:
          rating: 2
          evidence:
          - 표현 오차만으로 새 조건의 ROM 정확성을 판단하지 못한다는 전환이 잔차·비용·검증으로 이어진다.
          - 요약의 다섯 항목은 기존 본문의 결과만 회수한다.
          locations:
          - 3(1) 말미
          - 4(2) 말미
          - 7절
          reason: 각 절이 앞의 정의를 실제 평가 기준으로 발전시키며 요약에 새 주장이 없다.
    B:
      percent: 100.0
      criteria:
        B1:
          rating: 2
          evidence:
          - source-checks.yaml의 네 원문 직접 확인 위치와 본문 대응을 재사용한다.
          - 6(1)은 이제 이 문서의 경험적 표본 검증 절차로 한정되어 Haasdonk Remark 2.40의 권고 및 인증 상한과 일치한다.
          - 60개 인용 묶음의 출처 정체성 보존을 기계적으로 확인했다.
          locations:
          - 6(1) 첫 문단
          - Haasdonk preprint Remark 2.40 및 Proposition 2.19
          reason: 직접 확인한 출처의 범위와 본문의 주장·명시적 대수 유도가 일치하며 남은 근거 범위 과장을 발견하지 않았다.
        B2:
          rating: 2
          evidence:
          - Benner/Haasdonk와 Axler/Trefethen–Bau의 독립 저작 조합을 주장군별로 직접 대조했다.
          - 6(1)의 경험적 검증 절차는 문서가 택한 절차로 명시되며 일반적인 수학적 필요조건을 주장하지 않는다.
          locations:
          - 본문 전체 인용 묶음
          - 6(1)
          - 8절
          reason: 복수의 독립 저작이 관련 원리를 지지하고 예제는 해당 원리에서 직접 계산한 예시로 구분된다.
        B3:
          rating: 2
          evidence:
          - 실수 전치와 복소수 adjoint를 dagger로 통일하고 Euclidean 유도노름을 정의한다.
          - S는 기저 overlap, E는 질량 행렬, K는 정적 연산자로 구별한다.
          - 원문의 영 초기조건·안정성 가정을 일반 동치식에 강제하지 않으며 안정성 충분조건은 별도 증명한다.
          locations:
          - 1(1)
          - 2(2)
          - 3(3)
          - 6(2)
          reason: 출처 간 과학적 규약 변환은 적절하며 시간 끝점 t_f와 기저변환 행렬 T도 구별되어 있다.
        B4:
          rating: 2
          evidence:
          - 질량 행렬 가역성, 상대오차 영 분모, 비선형 평가비용과 구조 보존의 한계를 명시한다.
          - Benner·Axler·Trefethen–Bau 식별은 원문/공식 페이지에서 확인했다.
          - Haasdonk 저자의 Stuttgart 대학 소속 페이지 2017년 출판 목록을 직접 열어 제목·65–136쪽·SIAM·2017년·DOI를 확인했다.
          locations:
          - 1(1)
          - 3(2)
          - 4(2)
          - 6절
          - 8절
          reason: 적용 범위와 한계가 공개되어 있고 네 출처의 식별을 확인했다. Haasdonk DOI 브라우저 오류는 원문 및 저자 기관 서지로 보완했다.
    C:
      percent: 100.0
      criteria:
        C1:
          rating: 2
          evidence:
          - FOM/ROM을 도입에서 확장하고 상태·입력·출력·부분공간·잔차를 식 전에 설명한다.
