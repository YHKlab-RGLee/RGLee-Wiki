  critical_questions:
    dependency_chain: 상태·입출력과 해집합을 정의한 뒤 정확한 좌표변환과 부분공간 근사를 구분하고 오차·비용·예제·검증 및 구조 보존으로 이어진다.
    reader_blocker: 선형대수의 열공간·rank·켤레전치에 익숙하지 않은 독자는 2절에서 잠시 멈출 수 있으나 본문 정의와 식의 크기표가 이를 보완한다.
    strongest_revise_case: 가장 강한 수정 근거였던 시험 표본의 보편적 필수조건은 경험적 검증 절차로 한정되어 해결되었다. 기호·인용 순서와 서지 확인도 완료되어 현재 평가에서 남은 revise 근거는
      없다.
  summary: 기저변환·부분공간·저랭크·ROM을 명확히 구분하고 오차·비용·구조 조건을 재현 예제로 설명한다. 지적한 세 항목과 서지 확인이 해결되어 독립 full 평가를 통과한다. 최종 게시 검사는 메인의 등록
    후 수행 사항이다.
