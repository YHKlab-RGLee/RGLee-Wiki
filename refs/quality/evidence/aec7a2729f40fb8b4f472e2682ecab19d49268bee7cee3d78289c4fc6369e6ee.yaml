          - 5절 (1)
          - 6절 (1)
          reason: 기호와 정규화 및 단위의 해석이 원문과 양립한다.
        B4:
          rating: 2
          evidence:
          - Kuneš §3.1 및 Eqs.13–18과 인쇄 쪽수 4.7–4.8을 원문과 대조하였으며 수정본에 일치한다.
          - QE overlap의 기원 차이와 고정 Hamiltonian의 적용 한계를 명시한다.
          locations:
