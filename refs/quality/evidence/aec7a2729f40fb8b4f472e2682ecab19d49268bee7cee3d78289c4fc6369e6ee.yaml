    B:
      percent: 100.0
      criteria:
        B1:
          rating: 2
          evidence:
          - '확인 provenance: 전체 본문과 목차를 읽고 초기 판단을 기록한 뒤 원문을 직접 확인하였다. 아래 직접은 이 평가자의 passage 확인이며 감사 대조는 별도 wiki_references
            담당자의 원문 확인을 초기 판단 이후 대조한 것이다. 두 locator 수정만 역변환하면 이전 SHA256이 복구되어 나머지 본문 근거를 최종본에 재사용하였다.'
          - '§1 AO·H·S와 고정-H 범위: Soler et al., DOI 10.1088/0953-8984/14/11/302, Introduction 직접; §§IV–V 및 X–XI는 감사 대조. Giannozzi
            et al., DOI 10.1088/0953-8984/21/39/395502, Appendix A.2 직접 및 A.1 감사 대조. 서로 다른 전자구조 구현의 AO/SCF 및 일반화 대수를 확인하며
            QE overlap의 물리적 기원이 다름을 유지한다.'
          - '§§1·6 조건 영역과 관측량·시험점: Benner–Gugercin–Willcox, DOI 10.1137/130932715, §§2.1–2.3; Haasdonk, DOI 10.1137/1.9781611974829.ch2,
            Introduction 및 Definition 2.9 직접, Proposition 2.19 감사 대조. 독립적인 축소모형 문헌의 상태·출력 및 조건 범위를 대조한다. 유한 시험집합 최대값의 부등식은
            본문 집합 포함 관계의 직접 유도이다.'
          - '§2 가역 좌표변환과 부분공간·§4 표현오차: Saad, Numerical Methods for Large Eigenvalue Problems (2011), §3.1 Theorem 3.1과 증명
            및 §4.3.1 직접; Axler, Linear Algebra Done Right 4th ed., §6C Theorem 6.61과 증명 직접. 최적 projection과 Pythagoras가 본문의
            S-내적 변환 및 오차 분해를 지지한다.'
          - '§§2·4 generalized projection과 정규화: Giannozzi Appendix A.2 Eqs.A.11–A.13 직접; Saad §§9.2.5–9.2.6 Eqs.9.20–9.22는
            감사 대조하고 절 제목 직접 확인; Axler Theorem 7.38 직접. 조립 H_r에는 추가 S가 없고 S_r의 양의 정부호 및 S-weighted projector는 표시한 행렬곱으로 별도
            검산하였다.'
          - '§3 세 orbital 수치: Saad §4.3.1 및 Proposition 4.3 직접, Axler §6C 직접 확인한 대수 원리에 기반한 명시적 입력 예제이다. 메인 실행 로그와 독립 참고문헌
            담당자의 NumPy 1.22.0 재실행이 고유값·벡터 부호·잔차·확률·mu=0.5 값을 여덟 자리까지 재현한다. 물질 측정값이나 문헌 수치가 아니며 작성자의 과거 NumPy 1.21.5 실행 환경을
            소급 검증한 것은 아니다.'
          - '§4 위상·축퇴 및 projector 비교: Saad §3.1 Eq.3.8과 §3.2.2, Axler §§7B–7C Theorems 7.29/7.31을 감사 대조하였다. 직접 확인한 projector와
            spectral residual 논리와 양립하며 개별 상태와 부분공간 비교를 구분한다.'
          - '§5 POD 기저와 방정식 구성: Benner–Gugercin–Willcox §3.3.1 Eqs.3.17–3.18 및 Haasdonk §3.5 Proposition 3.18은 감사 대조. Haasdonk
            Introduction 및 Definition 2.9 직접 확인으로 snapshot 공간 선택 뒤 별도 Galerkin 방정식이 필요함을 확인한다.'
          - '§§2·5 Wannier 회전과 공간 선택: Marzari et al., DOI 10.1103/RevModPhys.84.1419, §II.A.2 Eqs.8–10 직접; Kuneš, Wannier
            Functions and Construction of Model Hamiltonians (2011), §3.1 Eqs.13–18, printed pp.4.7–4.8 및 §4.3 직접. 고정 J-band
            unitary 회전의 projector 보존과 disentanglement를 구별한다. Kuneš locator 수정은 원문 TOC와 절 제목으로 재확인하였다.'
          - '§5 downfolding: Solovyev–Pchelkina–Anisimov, DOI 10.1103/PhysRevB.75.045110, §II.B Eqs.7–12 및 §II.C 직접; Saad
            §8.5.2 Eq.8.51 감사 대조. 두 독립 유도는 energy-dependent Schur 제거를 지지한다. 본문의 +(E-HBB)^-1과 원문의 -(HBB-E)^-1은 동일하며 E≠4 eV
            및 보정 단위를 직접 검산하였다.'
          - '§§5·6 mode-space와 출력 검증: Huang et al., DOI 10.1063/1.5010238, §II Eqs.4–6 및 Fig.5 앞 검증 절차 직접; Grassi et al.,
            DOI 10.1063/1.4800900, §III.A와 Fig.3 비교 직접 및 §II.B Eqs.8–13 감사 대조. 서로 다른 장치 연구가 block projection 및 band/수송 결과
            대조를 지지하며 논문의 성능 수치는 옮기지 않았다.'
          - '§5 Davidson·Lanczos와 재사용 ROM: Giannozzi Appendix A.2 Eqs.A.11–A.13 직접; Ruhe, Lanczos Method, https://netlib.org/utk/people/JackDongarra/etemplates/node103.html,
            Eqs.20–27 직접; Saad §6.3 감사 대조. Benner §§2.1–2.3 및 Haasdonk Introduction의 재사용 목적과 함께 비교하여 큰 행렬 작용을 쓰는 반복 작업공간과
            검증된 ROM을 구분한다.'
          - '§6 residual·gap·물리 norm: Saad §3.2.2 Corollary 3.3 및 Theorem 3.9 직접; Axler Theorem 7.38 직접와 Theorems 7.29/7.31
            감사 대조. 본문의 Hermitian 고유기저 전개에서 spectral-distance 및 angle bound를 검산하고 S^(-1/2)rho 변환과 단위를 확인하였다. 특정 band 식별 보증으로
            확대하지 않는다.'
          - '§6 비용·affine 분리·SCF 한계: Benner §2.3 Eqs.2.7–2.8 직접; Haasdonk pp.21–23 offline/online 및 break-even은 감사 대조. 조립
            O(M²r+Mr²), 복원 O(Mr), 저장량은 행렬 차원으로 직접 계산한다. Soler §§X–XI의 힘·기저 미분과 Giannozzi A.1의 밀도/에너지 갱신은 감사 대조하여 fixed-H 결과가
            SCF·힘 정확도를 보장하지 않는 범위를 확인하였다.'
          - '§7 선형계·동역학·안정성: Haasdonk Propositions 2.14–2.15 직접 및 Benner §§2.1–2.2 감사 대조; Benner §5.4 stability passage와 Axler
            Theorem 7.38 직접. residual forcing, Petrov–Galerkin 출력과 가역 조건을 확인한다. 양의 정부호 congruence, diag(1,0.001) 예제 및 비정규
            A=[[-1,4],[0,-1]]의 exp(At)와 v†Av=1은 명시적 입력에서 별도 대수 검산하였다.'
          - 현재 04ba9d90 버전은 직전 be38e9c 버전의 §5 표에서 Downfolding을 같은 이름의 상대 링크로 바꾼 한 곳뿐임을 bytes 비교로 확인하였다. 대상 downfolding.md
            도입부와 §§1–2의 active-space 제거 및 에너지 의존 H_eff 정의를 직접 읽어 표와 직후 예제의 의미 일치를 확인하였다. 새 과학 주장이나 선행 의존성을 추가하지 않으므로 위의 전체
            원문·수치 근거를 그대로 재사용한다. 독립 참고문헌 담당자의 동일 delta 재검토도 현재 hash에서 pass이다.
          locations:
          - §§1–7 본문 인용과 식 및 표
          - 참고문헌 1–12; B1 evidence의 주장별 원문 위치
          reason: 중심 주장에 인접 인용이 있고 직접 확인한 원문 및 명시적 대수 유도가 같은 범위를 지지한다.
        B2:
          rating: 2
          evidence:
          - '주장별 독립 쌍: AO/SCF는 Soler(2002)와 Giannozzi(2009); projection·정규화·오차의 선형대수는 Saad(2011)와 Axler(2024); ROM·POD·출력·비용은
            Benner/Gugercin/Willcox(2015)와 Haasdonk(2017)이다. 직접 확인 범위와 감사 재사용 범위는 B1 각 항목에 구별하였다.'
          - '응용별 독립 쌍: 고정 band의 Wannier gauge는 Marzari et al.(2012)와 Kuneš(2011); 에너지 의존 제거는 Saad §8.5.2와 Solovyev et al.(2007);
            mode-space 출력은 별개 장치 연구인 Huang et al.(2018)와 Grassi et al.(2013)이다.'
          - Eigensolver는 Giannozzi Appendix A.2와 Saad의 독립 수치해석 서술, Lanczos는 추가로 Ruhe(2000)의 저자별 chapter를 확인하였다. ROM과의 구분은
            이 알고리즘 원문들과 독립 ROM 문헌의 목적·비용을 대조한 제한된 종합이다.
          - 각 논문의 DOI 출판본과 arXiv 또는 저자 사본은 같은 하나의 provenance로만 센다. 원문 제목·저자·저널·연도·식별자는 독립 참고문헌 담당자의 전체 metadata 감사와 대조하였다.
            예제의 숫자와 행렬곱 유도는 문헌 측정값으로 취급하지 않고 공개 입력의 계산으로 검증한다.
          locations:
          - B1의 주장별 대응
          - 참고문헌 1–12
          reason: 미러나 출판본 중복을 독립 근거로 세지 않으며 각 주장군의 별도 출처를 확인한다.
        B3:
          rating: 2
          evidence:
          - 조립 H와 S 역행렬이 작용하는 계수 연산자를 구분한다.
