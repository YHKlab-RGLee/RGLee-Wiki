          - 단일 준위의 유한 밴드 부재를 사슬로 보완하고 같은 결함의 Green 함수 계산으로 연결한다. 요약은 기존 결론만 회수한다.
          locations:
          - §5 첫 문단; §6(1); §7
          reason: 전환이 비교 목적을 설명한다.
    B:
      percent: 100.0
      criteria:
        B1:
          rating: 2
          evidence:
          - HEAD SHA e84f4154가 기존 evidence의 source SHA와 일치한다. 전체 diff에서 수식·인용·조건이 보존된 표현 수정임을 확인하여 기존 passage 대응을 재사용한다. Waintal
            §2.3 식10–15는 이번에도 직접 읽었다.
          - 초기 판단 후 같은 SHA의 wiki_references/result.json을 대조했다. 해당 담당자가 직접 읽은 Waintal §7–8, Ryndyk 식221–226, Lambert 식1–4·7–8·13과
            표현 수정의 대응에 미해결 항목이 없다. 이를 이 평가자의 직접 원문 확인으로 기록하지 않는다.
          locations:
          - §1–6; prior evidence B1
          reason: 새로운 비자명한 주장이 없고 기존 근거의 적용 범위가 유지된다.
        B2:
          rating: 2
          evidence:
          - '기존 독립 provenance 대응을 재사용한다: reservoir/Landauer Waintal·Ryndyk·Lambert, flux Waintal·Khomyakov, scattering eigenvalue
            Waintal·Beenakker, 공명 Ryndyk·Lambert, 비직교 기저 Waintal·Brandbyge.'
          - 이번 scoped reference 결과도 독립 저자군 Waintal·Ryndyk·Lambert에 대해 DOS 가중치, 전류율, bias window, FWHM의 의미 보존을 확인한다.
          locations:
          - 참고문헌1–6; prior evidence B2
          reason: 미러를 독립 출처로 세지 않으며 표현 수정이 해당 물리적 의미를 바꾸지 않는다.
        B3:
          rating: 2
          evidence:
          - 전자 순주입률의 양의 전하 크기 규약, spin 포함 trace, Gamma/2 허수 self-energy와 eV 변환을 대조했다. 기존 half-width와 electrochemical potential
            정합 근거를 재사용한다.
          locations:
          - §1(2); §3; §4; §6
          reason: 수율을 단위 시간당 전자 수로 고친 표현은 차원을 명확히 하며 규약을 변경하지 않는다.
        B4:
          rating: 2
          evidence:
          - wide-band, finite-bias 전하 재배치, 비직교 기저와 Kohn–Sham 한계가 남아 있다. 변경 없는 서지 검증은 기존 B4/D5에서 재사용했다. Waintal v3 날짜·저자·CC
            BY 표시는 원문 HTML에서 직접 확인했다.
          locations:
          - §4(1); §6(2); §8
          reason: 한계를 삭제하거나 근거의 적용 범위를 확장하지 않았다.
    C:
