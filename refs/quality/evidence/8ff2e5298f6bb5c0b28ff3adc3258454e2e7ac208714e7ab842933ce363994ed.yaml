          evidence:
          - 다채널 일반식, wide-band 단일 준위, 유한 밴드 사슬 및 DFT 근사를 구별한다.
          locations:
          - §2–6
          reason: 각 모형의 조건과 정확식·근사식의 위계가 보존된다.
