          reason: 기호와 단위뿐 아니라 수식의 물리적 역할이 드러난다.
        C3:
          rating: 2
          evidence:
          - 동일 DOS에서 접촉 비대칭으로 전류가 0.36배가 되는 원인과 정적 결함의 탄성 반사를 연결한다. 적분 정확도와 모형 한계를 구분한다.
          locations:
          - §4(3); §5; §6(2)
          reason: 근사에서 보존하거나 제외하는 물리가 구체적이다.
        C4:
