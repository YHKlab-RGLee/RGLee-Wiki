          evidence:
          - 16종 원문의 해당 passage를 직접 확인하고 수정본이 원문과 유도를 구분한다
          - '검토 방식: 모든 본문과 코드를 정적으로 읽고 원문 passage를 직접 열었다. 최초 SHA afcf5147의 불변 부분 원문 대조를 재사용하고 ffafe3b 변경 유도를 직접 재검토했다. 최종3b027b
            delta는 동일 순서1,100,1의 표기만 바뀌었다. 다른 검토자 결론은 초기 발견 후 대조했으며 자신의 직접 확인으로 대체하지 않았다. 코드·예제 실행은 하지 않았다.'
          - '주장 ledger01 | 도입·§1·§2: 중복 부분문제의 답 저장, base/uncomputed 구분, 의존 순서와 방문 상태 비용. 독립 원문 Erickson ch3 pp99–104 https://jeffe.cs.illinois.edu/teaching/algorithms/book/03-dynprog.pdf
            및 Dasgupta et al. ch6 §6.4 Memoization pp183–184 https://people.eecs.berkeley.edu/~vazirani/algorithms/chap6.pdf
            및 MIT2011 lecture21 p1 https://www.ocw.mit.edu/courses/6-006-introduction-to-algorithms-fall-2011/3484e876d81aba07911a1109f5b5e81e_MIT6_006F11_lec21.pdf.
            연산 수는 정수 기본 연산 기준이며 비트 비용 caveat는 Erickson p104에서 직접 확인.'
          - '주장 ledger02 | §2: 양의 단위의 최소 개수, memo/table O(kA), 불가능 표시. Laaksonen pp66–68 https://cses.fi/book/book.pdf 및 Miller/Ranum
            Dynamic Programming recursive/minimum/cache 설명 https://runestone.academy/ns/books/published/pythonds3/Recursion/DynamicProgramming.html
            직접 확인. None과 key membership은 원문의 readiness/infinity를 본문의 Python 계약으로 옮긴 구현이며 양의 단위로 재귀 종료를 증명했다.'
          - '주장 ledger03 | §3(1): right/down grid 마지막 이동 분할, 장애물 제외, path-count seed1. Laaksonen pp71–72 Paths in a grid 및
            Solomon MIT2020 session8 transcript pp20–23 https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/mit6_006s20_04_17_problem_session_8_transcript.pdf.
            전자는 positive rewards, 후자는 obstacle/0–1 rewards와 optimal-path count; 본문은 signed reward를 마지막 간선 분할로 유도하고 all-zero
            rewards로 all-path count를 얻는 특수화를 명시한다. 불가능 reward -infinity와 count0은 서로 다르다.'
          - '주장 ledger04 | §3(2): ordered count는 마지막 단위 제거의 bijection으로 disjoint/exhaustive 합; unordered count는 마지막 count-vector
            성분0/positive로 분할. Laaksonen p69의 ordered coins 및 Solomon transcript pp22–23의 additive last-move counts가 독립 counting
            원리 근거. Dasgupta §6.4 pp181–182와 cp-algorithms Complete Knapsack https://cp-algorithms.com/dynamic_programming/knapsack.html
            는 item-type state와 current-row dependence 근거. 최적화 출처가 combination count를 직접 제시한다고 주장하지 않으며 본문이 B(i,x)=B(i-1,x)+B(i,x-u_i)와
            ascending compressed-row invariant를 완전히 유도한다.'
          - '주장 ledger05 | §4·§7: 0–1 선택과 반복 선택의 상태 차이, 이전/현재 행 점화식, at-most capacity base0. Dasgupta §6.4, MIT2011 lecture21
            pp4–5, cp-algorithms 0–1 Knapsack invariant 및 Complete Knapsack 직접 확인. Prefix/suffix index를 본문 prefix로 변환. 0무게·음의
            보상은 본문의 확장으로 이전 item-row 귀납과 empty selection을 명시하여 소모량0도 한 번만 선택한다.'
          - '주장 ledger06 | §4(1): descending capacity는 이전 행을 보존하고 ascending은 같은 항목 재사용. Laaksonen p73 subset feasibility의
            압축과 cp-algorithms Knapsack Problem 0–1/Complete Knapsack의 명시 invariant 직접 확인. 양의 weight 압축 코드와 zero-weight full-table
            구현을 구별. O(nW)의 numeric-input 의존성은 Dasgupta p181 및 MIT2011 lecture21 p5에서 독립 확인.'
          - '주장 ledger07 | §4(3)·§7: 최적값과 복원 출력 구분, table traceback, tie skip. MIT2011 lecture21 p5 parent pointers 및 Wayne
            Dynamic Programming I slides35–38 https://www.cs.princeton.edu/~wayne/kleinberg-tardos/pdf/06DynamicProgrammingI.pdf
            에서 row comparison traceback 직접 확인. 용량만 기록하는 mutable parent의 같은 항목 중복 반례는 명시된 own construction으로 수작업 검산. Full-table의
            i 감소가 zero-weight 중복을 막는다.'
          - '주장 ledger08 | §5(1): LIS strict endpoint recurrence, max over endpoints, predecessor recovery 및 O(n²). Erickson
            ch3 §3.6와 Dasgupta ch6 §6.2 pp171–173, cp-algorithms LIS https://cp-algorithms.com/dynamic_programming/longest_increasing_subsequence.html
            직접 확인. 문서의 empty input0과 duplicate strict length1/nondecreasing3은 정의로 수작업 검산.'
          - '주장 ledger09 | §5(2): minimum endpoint representatives, not necessarily a subsequence, insertion-time predecessors와
            binary-search O(nlogn). cp-algorithms LIS minimum endpoint/restoration 및 Wayne LIS slides8–10 https://www.cs.princeton.edu/~wayne/kleinberg-tardos/pdf/LongestIncreasingSubsequence-2x2.pdf
            직접 확인. Python3.10 bisect API https://docs.python.org/3.10/library/bisect.html 의 left >=, right > boundary 및 insort
            linear insertion 확인. cp-algorithms prose의 > 표현은 lower_bound code/PSF boundary와 구별하여 본문 >=를 채택.'
          - '주장 ledger10 | §6(1): matrix-chain fixed order/parentheses, scalar product cost and two-child interval recurrence.
            Dasgupta §6.5 pp184–186 및 MIT2011 lecture21 p2 직접 확인. 본문 half-open M(i,j), base M(i,i+1)=0, cost p_i p_k p_j,
            increasing length 및 O(n³)/O(n²)로 정합화. dimensions8,2,5,3의 costs200/78을 수작업 계산.'
          - '주장 ledger11 | §6(2): subset+last vertex state, recurrence 및 n*2^n states/n transitions. Dasgupta ch6 TSP pp188–189와
            CMU15451 lecture11 §11.5 PDFpp4–5 https://www.cs.cmu.edu/afs/cs/academic/class/15451-f13/www/lectures/lect1001.pdf
            직접 확인. 전자는 복귀 간선을 더하며 후자는 shortest-path metric을 가정한다. 본문은 이를 명시하고 direct-edge Hamiltonian path와 negative/absent
            edge 확장을 집합 크기 귀납으로 증명하며 return edge를 제외한다.'
          - '주장 ledger12 | §8·§9: earliest-finish interval selection, exchange proof, weighted counterexample and O(nlogn).
            Erickson ch4 §4.2 https://jeffe.cs.illinois.edu/teaching/algorithms/book/04-greedy.pdf 및 Wayne Greedy Algorithms
            I slides10–15 https://www.cs.princeton.edu/~wayne/kleinberg-tardos/pdf/04GreedyAlgorithmsI.pdf 직접 확인. Erickson
            strict >를 Wayne >=와 구분하며 본문은 positive-duration half-open intervals의 boundary contact를 허용한다. Negative time/empty
            input/tie ordering은 코드 계약과 수작업 trace로 확인.'
          - '주장 ledger13 | §10: unrestricted minimum merge와 weighted leaf-depth identity, least-weight siblings exchange/contraction.
            Laaksonen pp63–64 Huffman coding 및 Erickson ch4 §4.4 pp167–168 직접 확인. 교환에서 비용 증가0 이하인 비음수 크기 모형을 사용하며 adjacent-only
            조건이 다름을 own counterexample(1,100,1)104/203으로 확인. Matrix interval formulation은 독립 Dasgupta/MIT 근거와 연결.'
          - '주장 ledger14 | §10: min-heap push/pop, linear heapify, merge complexity. PSF Python3.10 heapq API https://docs.python.org/3.10/library/heapq.html
            및 Miller/Ranum Binary Heap Implementation delete/heapify https://runestone.academy/ns/books/published/pythonds3/Trees/BinaryHeapImplementation.html
            직접 확인. API의 in-place heapify와 본문이 먼저 list copy를 만드는 것을 구분. 추적2+3=5,5+7=12,8+12=20,총37 수작업 확인.'
          - '독립성: Erickson의 두 장은 한 저자군, Dasgupta/Papadimitriou/Vazirani는 한 교재군, Wayne의 여러 slides는 한 저자군, Laaksonen은 별도 교재군,
            cp-algorithms 페이지들은 한 편집군, PSF bisect/heapq는 한 공식 문서군, Miller/Ranum은 별도 교재군이다. 같은 문서 mirror/layout을 중복 근거로 세지
            않았다. MIT2011와2020은 별도 강의지만 각 주요 주장에서는 MIT 밖 독립 교재 근거도 함께 사용했다.'
          locations:
