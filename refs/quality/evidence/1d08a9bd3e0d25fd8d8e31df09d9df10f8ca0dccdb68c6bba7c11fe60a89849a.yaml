        B2:
          rating: 2
          evidence:
          - Prefetch는 Micron 제조사 문서와 Wang 대학 논문, Rowhammer 배치는 Google 원 실험과 VU/ETH 연구를 대조했다.
          locations:
          - 8절·6절
          reason: 서로 다른 연구진의 자료를 사용하며 미러는 독립 출처로 세지 않았다.
        B3:
          rating: 2
          evidence:
          - Rdata=n fcore=2 fIO로 내부 병렬 폭과 외부 양 edge 전송을 일치시켰다. Array 식은 동일 성공 확률의 곱에서 유도한다.
          locations:
          - 8절 Rdata·5절 확률
          reason: 식의 계수·단위·확률의 표본공간을 구별했다.
        B4:
          rating: 2
          evidence:
          - 실제 DOI의 Liu ISCA 논문으로 서지를 정정하고 구조 split 실험 및 array 확률 유도의 근거로 붙었던 12를 제거했다. VRT를 capacitor dielectric leakage의
            직접 결과로 단정하던 표 항목도 줄였다.
          locations:
          - 참고문헌12 인용 범위·6절
          reason: 논문의 실측 retention 범위를 넘는 지원을 주장하지 않는다.
    C:
      percent: 100.0
