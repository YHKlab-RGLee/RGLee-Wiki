        C1:
          rating: 2
          evidence:
          - F를 먼저 정의하고 single/double-sided는 victim 수가 아닌 aggressor 배치로 설명한다. n, fcore, fIO를 식 전에 정의한다.
          locations:
          - 도입·6절·8절
          reason: 독자가 정의를 찾아 뒤로 이동할 필요를 줄였다.
        C2:
          rating: 2
          evidence:
          - Prefetch는 DQ당 bit 수이고 fcore는 내부 전송 반복률이다. 관측된 불량 비율은 단일 cell 반복 고장률이나 array 사건 확률과 다르다.
          locations:
          - 8절 prefetch·5절 Parray
          reason: 핵심 식의 입력과 답하는 질문이 분명하다.
        C3:
          rating: 2
          evidence:
