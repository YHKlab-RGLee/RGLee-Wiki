          reason: 면적 표기의 정의 지연을 해결했다.
        A2:
          rating: 2
          evidence:
          - 물리 병목→transistor→면적→공정→불량→disturbance→전력→interface→차세대→요약 순서이다.
          locations:
          - 본문 전체·1–10절
          reason: 동일한 구조를 transistor와 면적 관점에서 다시 보는 이유가 전환부에 명시되어 있다.
        A3:
          rating: 2
          evidence:
          - 관측 불량 비율과 독립·동일 확률 모형을 구별했다. Prefetch 내부 column transfer와 row-cycle을 구별하고 DDR 계수를 중복하지 않는다.
          locations:
          - 5절 확률·8절 prefetch
          reason: 모형과 관측량을 서로 다른 층으로 정리했다.
        A4:
          rating: 2
          evidence:
          - 구조 변화의 원인을 면적·배선 관점에서 회수하고 마지막 표와 요약이 앞선 제약을 결합한다.
          locations:
          - 2–3절 전환·10절
          reason: 큰 절 구성은 유지하며 국소 정의와 수식을 수정했다.
    B:
      percent: 100.0
      criteria:
