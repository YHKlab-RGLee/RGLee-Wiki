  areas:
    A:
      percent: 100.0
      criteria:
        A1:
          rating: 2
          evidence:
          - 저전계 bulk/2D band transport의 범위를 정하고 선행 BTE 문서를 연결한다. conductivity와 농도로 mobility를 정의한다.
          locations:
          - 도입·1절
          reason: 독자가 대상과 필요한 선행 지식을 먼저 확인할 수 있다.
        A2:
          rating: 2
          evidence:
          - 정의→전자구조·transport kernel→EPC→계산 절차→길이 척도→추가 산란 순서이다. 제목은 간결한 개념 명사구이다.
          locations:
          - H1–H3 전체
          reason: 목차만으로 개념 의존 관계와 적용·한계의 위치를 알 수 있다.
        A3:
          rating: 2
          evidence:
          - Drude 가정, 일반 F 응답, CRTA, SERTA와 반복 BTE를 분리하고 finite-device와 bulk mobility를 구분한다.
          locations:
          - 1–3·5절
          reason: 일반식과 근사 및 계산 대상의 계층을 혼동하지 않는다.
        A4:
          rating: 2
          evidence:
          - 경계 산란 설명은 다음 절 산란율 합으로 이어지고 여섯 요약은 앞선 모형과 한계를 회수한다.
          locations:
          - 5–7절
          reason: 절 전환이 기존 결과를 활용하며 요약에 새 과학 주장을 도입하지 않는다.
    B:
      percent: 100.0
      criteria:
        B1:
          rating: 2
          evidence:
          - 초기 독립 판단 후 8effe9b24f1d7616eb0a842bed1ccc12d4a5ee04b0f5eeed98c99312d04bc0c3 및 연결된 546192da6c404be4f7a580c969f2fd7be8875ab179912787b2ccc904e962b3a4
            기록을 대조했다. 전자의 source 64d9bea…는 직접 계산한 HEAD SHA와 일치한다. 원문 passage 기록은 Liu II.A Eqs.4–7/p15, Perturbo §2.1.2 Eqs.6–13·5.2,
            Gunst Eq.11, Poncé Eqs.38–40이다.
          locations:
          - 본문 인용·기존 evidence B1
          reason: 변경 없는 주장에 유효한 기존 직접 확인 근거를 재사용한다. 이번 평가자가 외부 원문을 새로 열람한 것으로 기록하지 않는다.
        B2:
          rating: 2
          evidence:
          - Liu/Perturbo의 F·tensor 및 Gunst/Poncé의 2D mobility 규약은 서로 다른 논문 provenance이다. 나머지 변경 없는 범위의 승계가 기존 기록에 명시되어 있다.
            수식·인용 순서·서지 전부 동일함을 프로그램으로 확인했다.
          locations:
          - 참고문헌 1–10·기존 evidence B2
          reason: 복수 URL을 독립 출처로 중복 계산하지 않고 과학 의미가 유지된 범위만 승계한다.
        B3:
          rating: 2
          evidence:
          - q=-e에 대한 +q 분포 응답은 q² conductivity가 된다. 2D sheet conductivity S와 면밀도 m^-2는 동일 mobility 단위를 준다. F·v/|v|는 길이이고 v=0
            제외 조건이 있다.
          locations:
          - 1·2·3·5절
          reason: 본문을 직접 검산하고 기존 출처 규약 대조를 재사용했다.
        B4:
          rating: 2
          evidence:
          - bare 전이율의 Pauli 인자와 SERTA 대각율을 구분한다. signed tensor 누적의 비단조성, phonon-only 및 quasiparticle 근사의 범위를 명시한다.
          - 동일 최종 hash의 wiki_references/report.md를 대조했다. 수렴/물리 조건 구분에 대한 [1],[4] 직접 확인은 참고문헌 담당의 작업이며 본 평가자의 직접 열람으로 기록하지
            않는다. [5] 접근 제한은 새 전면 감사 미수행 범위이고 기존 서지 변경은 없다.
          locations:
          - 3·5·6·8절
          reason: 한계를 숨기지 않으며 바뀌지 않은 서지 식별자의 기존 확인을 재사용한다.
    C:
      percent: 100.0
      criteria:
        C1:
          rating: 2
          evidence:
          - EPC를 도입 첫 사용에서 확장하고 CRTA·BTE·SERTA·RTA·SOC를 해당 사용에서 정의한다. F와 projected MFP의 역할을 설명한다.
          locations:
          - 도입·1–5절
          reason: 핵심 방법과 양의 정의가 읽기 순서에 부합한다.
        C2:
          rating: 2
          evidence:
          - gs, Vcell, Nk, Nq, q, F, Theta 의미와 정규화·단위·투영 방향을 명시한다.
          locations:
          - 1·2·3·5절 수식 전후
          reason: conductivity 식의 에너지 창과 충돌 해의 의미를 설명해 계산량 해석이 가능하다.
        C3:
          rating: 2
          evidence:
          - EPC와 에너지 보존→산란율→충돌 해→전도도·길이로 연결한다. scattering-in 손실, bulk/소자 구분과 Matthiessen 근사를 명시한다.
          locations:
          - 3–6절
          reason: 근사의 보존 정보와 빠진 정보 및 실패 조건이 드러난다.
        C4:
          rating: 2
          evidence:
          - 5개 표는 근사 수준·해법·수렴 조건·길이 영역·모형 선택을 비교하며 21개 식과 1개 text 흐름은 정의와 계산 순서를 전달한다.
          locations:
          - 2–6절 표·수식·계산 흐름
          reason: 요소가 서로 다른 설명 기능을 수행하며 장식적 개수 충족이 아니다.
