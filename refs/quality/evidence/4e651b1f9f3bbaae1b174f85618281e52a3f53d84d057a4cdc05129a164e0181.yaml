        A2:
          rating: 2
          evidence:
          - H1–H3를 별도로 읽고 본문과 대조했다. Quasiparticle→Hedin→one-shot→self-consistency→수렴→한계의 의존 순서가 유지된다.
          locations:
          - 전체 H1–H3
          reason: 간결한 명사구 제목이 정의·계산·해석의 전개를 드러낸다.
        A3:
          rating: 2
          evidence:
          - Hartree 기준 G_H와 KS 기준 G_0, 정확 vertex와 delta 근사, 선형화와 실제 pole의 Z를 구별한다.
          locations:
          - 1(2)
          - 2(1)
          - 3(2–3)
          reason: 일반식·대각 근사·선형화·해석의 계층을 혼동하지 않는다.
        A4:
          rating: 2
          evidence:
          - 4절 갱신량 비교를 6절 missing vertex 한계로 연결하고 7절에서 동일한 논점을 회수한다.
          locations:
          - 4·6·7절
          reason: 요약에 새로운 미검증 주장이 없으며 계산량을 정확도 순위와 동일시하지 않는다.
    B:
      percent: 100.0
      criteria:
        B1:
          rating: 2
          evidence:
          - 변경 diff는 서술어·일반 설명어·약어 첫 정의이며 수식·인용·수치가 보존되었다.
          - 기존 직접 확인 근거 6c0ef42f…yaml의 Aryasetiawan cond-mat/9712013 Eq56–58 및 Golze1912.04893 Eq20,29–37/AppB, §IV.2를 동일
            과학 주장에 재사용한다. 이는 이번 평가자의 직접 원문 열람 기록이 아니다.
          - 초기 판단 뒤 동일 SHA의 독립 reference report를 대조했다. Golze §IV.B/§V/§XI, Klimeš p.6, Kotani Eq10, Held §1·4의 신규 직접 열람은 reference
            담당자의 확인이며 본 평가자의 직접 열람으로 세지 않는다.
          locations:
          - 1–6절 인용
