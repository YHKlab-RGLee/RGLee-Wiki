        B2:
          rating: 2
          evidence:
          - 기존 근거의 독립 저자군 Aryasetiawan/Gunnarsson 및 Golze/Dvorak/Rinke를 유지한다. scGW 복수해 조건은 Tandetzky 원논문의 근거가 추가로 보존된다.
          - 독립 참고문헌 검토의 Golze/Held DMFT 정의, Golze/Kotani QSGW 설명 및 Golze/Klimeš 수렴 범위 확인이 수정된 표현의 동일성을 뒷받침한다.
          locations:
          - 2–4절
          - 기존 근거 B1·B2
          reason: 미러를 독립 출처로 세지 않았으며 이번 국소 윤문을 전체 재감사로 확대하지 않는다.
        B3:
          rating: 2
          evidence:
          - time-ordered 기본식과 spectral function의 retarded 식을 명시적으로 구분하고 Wc=W−v, Sigma−vxc 및 linewidth의 부호를 설명한다.
          locations:
          - 도입
          - 2절 규약 주석
          - 3(2·4)
          reason: 수식·부호·단위·미분 평가점이 보존되어 기존 출처와의 규약 대응이 유효하다.
        B4:
          rating: 2
          evidence:
          - scGW는 동일 물리해 수렴 조건으로 제한하며 좁은 peak의 수명 해석, vertex 생략, 강상관·satellite 한계를 별도로 제시한다. 서지 항목은 변경되지 않았다.
          locations:
          - 3(2)
          - 4·6·8절
          reason: 적용 범위와 비유일성을 숨기지 않는다. 기존 식별정보 확인 근거를 재사용한다.
