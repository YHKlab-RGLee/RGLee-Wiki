  critical_questions:
    dependency_chain: 전자 추가·제거→기준 Hamiltonian→Hedin·screening→G0W0·QP 해→self-consistency→수렴·한계.
    reader_blocker: time-ordered 기본식에서 retarded pole 해석으로 바뀌는 지점은 주의가 필요하지만 본문이 규약과 Z 평가점을 명시한다.
    strongest_revise_case: 약어 확장 및 용어 윤문이 물리적 범위나 해 선택 의미를 바꿨는지 검토했다. 수치·식·가정은 보존되어 새로운 수정 사유는 발견하지 않았다.
  summary: 전체 본문·목차를 독립 평가했고 초기 판단 뒤 기존 근거의 동일 과학 범위를 재사용했다. 수식·예제·모형 구분에 수정할 결함이 없고 정량 기준과 pending-only/strict-render 확인을
    마쳤다. 최종 등록·publication gate는 메인 책임이다. 동일 버전 독립 참고문헌 보고서와 대조한 결과 미해결 수정 사항은 없다.
