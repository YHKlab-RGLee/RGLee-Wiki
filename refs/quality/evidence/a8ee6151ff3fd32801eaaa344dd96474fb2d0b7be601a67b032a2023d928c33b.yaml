  areas:
    A:
      percent: 100.0
      criteria:
        A1:
          rating: 2
          evidence:
          - 도입부가 이미 정한 주기적 원자 Hamiltonian에서 출발해 band와 열린 장치 수송을 검증하는 목적을 먼저 밝힌다.
          - M,m,a와 직교·이웃 cell·ballistic 가정을 선언하고 세 선행 문서 및 공통 기호 대응표를 둔다.
          locations:
          - 도입부 7–30행
          reason: 범위와 필요한 개념을 세부 유도보다 먼저 제시하며 W와 V_i의 다른 역할도 명시한다.
        A2:
          rating: 2
          evidence:
          - H2·H3만 별도로 읽어 주기 기준 → Bloch 표본과 기저 → 투영과 band → 열린 장치 → 비용 → 확장의 의존 순서를 확인했다.
          locations:
          - 전체 H1–H3
          - §§1–6
          reason: 짧은 개념 명사구가 계산 과정과 모형 확장을 구분하고 순서가 본문의 논리와 일치한다.
        A3:
          rating: 2
          evidence:
          - §2는 SVD의 입력을 상태 표본으로 한정하고 Hamiltonian 또는 transmission 오차 최소화와 구분한다.
          - §3은 잔차 직교 조건과 원문제 충족 및 정확한 좌표 변환을 구별한다.
          - §4의 mode 결합 생략과 §6의 산란·비직교 규약은 기본 직교 ballistic 모형의 추가 근사 또는 확장이다.
          locations:
          - §2(1)
          - §3(1–2)
          - §4(1)
          - §6
          reason: 정확한 대수, 부분공간 근사, 관측량 검증의 계층에 혼동이 없다.
        A4:
          rating: 2
          evidence:
          - 구성한 공통 U와 h0,w를 다음 단계의 실공간 장치 block에 재사용한다.
          - §3의 표현 오차·잔차 구별이 §4의 출력 검증으로 이어지고 §7은 네 항목으로 기존 결과만 회수한다.
          locations:
          - §§2–4 전환
          - §7
          reason: 단계의 결과가 뒤의 입력으로 이어지고 요약에 새로운 검증 대상 주장을 넣지 않는다.
    B:
      percent: 100.0
      criteria:
        B1:
          rating: 2
          evidence:
          - '변경 구절 직접 확인: Huang arXiv:1710.08064 §II Eqs.(4)–(6), §IV(A,B); Mil’nikov SISPAD 2011 pp.315–316 Eqs.(1)–(4);
            Shin arXiv:2107.10511v2 §§III–V Eqs.(2)–(13); Ozaki arXiv:0908.4142 §II(A,B) Eqs.(1)–(10).'
          - 표본 압축의 목적과 별도 band·수송 검증이 원문에서 확인되며 Galerkin 잔차 및 S-cancellation은 그 행렬식을 본문 규약으로 직접 전개한 결과이다.
          - 변경되지 않은 §§4–6 근거는 snapshot SHA가 일치하는 refs/quality/evidence/14453e034838afc3c6c0da68fcc14172ed1ab4460a605c2941bcc1e8876de529.yaml의
            원문 passage 기록만 재사용했다. [4],[5],[7],[8]을 이번 평가자가 새로 열었다고 주장하지 않는다.
          locations:
          - 도입부
          - §2(1)
          - §3(1–2)
          - §6(2)
          - 기존 §§4–6
          - quality/source-checks.md
          reason: 변경 주장과 의존 결론은 직접 원문과 대조했고 유지된 문장은 provenance와 버전이 맞는 기존 근거를 사용했다. 인용이 각 주장 바로 뒤에 있다.
        B2:
          rating: 2
          evidence:
          - '기호·투영: Mil’nikov Eqs.(1)–(4), Huang Eqs.(4)–(6), Shin Eqs.(2),(5).'
          - '표본·연산자·출력 구별: Huang §IV(A,B)와 Shin §§IV.3,V의 각각 별도 구현·검증.'
          - '비직교 전제: Shin Eqs.(6)–(8),(13)와 Ozaki Eqs.(1)–(4)의 궤도 행렬 원소 정의. 두 전제로부터 추가 S가 없는 축소식을 직접 유도한다.'
          - 기존 NEGF는 Grassi와 Lewenkopf/Mucciolo 및 Ozaki, 비용은 Huang과 Grassi, mode 결합은 Shin·Grassi·Luisier, 산란은 Grassi와 Lemus의
            직접 passage 기록을 재사용했다.
          - 같은 논문의 DOI와 preprint는 한 근거로 세고 [1]–[3]의 방법 계보와 별도 구현이라는 차이를 구분했다.
          locations:
          - §§1–6 인용 묶음
          - §8
          - quality/source-checks.md
          reason: 각 주장에 독립 저자 집단의 원문 또는 구현 근거 두 개 이상이 같은 적용 범위를 지지하며 원문의 단순 반복을 독립 근거로 세지 않는다.
        B3:
          rating: 2
          evidence:
          - 원문의 실수 transpose를 복소 dagger로 일반화하고 dimensionless q와 본문의 ka를 대응시켰다.
          - W의 행·열 방향에서 Bloch 위상 부호가 일치하며 U†rho 식은 U†U=I로 직접 전개된다.
          - H가 궤도 행렬 원소, S가 overlap임을 Ozaki와 Shin에서 확인하여 S^-1H의 좌표 작용과 S 내적을 분리했다.
          locations:
          - §1(1)
          - §3(1)
          - §6(2)
          reason: 기호 역할·차원·위상·내적·정규화에 모순이 없으며 선행 projection-methods §5와 동일한 규약이다.
        B4:
          rating: 2
          evidence:
          - 표본 오차에서 장치 출력 정확도를 추론하지 않고 두 접촉 구성의 동등성도 자동으로 단정하지 않는다.
          - 계산 이득은 같은 분할의 조밀 block에 한정하며 산란과 비직교는 별도 확장이다.
          - 변경되지 않은 [1]–[8]의 서지 식별 확인은 일치하는 원본 근거에서 재사용하고 [1],[2],[3],[6]의 원문 제목과 내용을 이번에 확인했다.
          locations:
          - §2(1)
          - §3(2)
          - §4(1–2)
          - §§5–6
          - §8
          reason: 원문의 적용 조건을 보존한다. 참고문헌 검토의 DOI 2·6 endpoint 접근 제한은 원문 미확인으로 오인하지 않았으며 전체 URL 재감사는 수행하지 않았다.
    C:
      percent: 100.0
      criteria:
        C1:
          rating: 2
          evidence:
          - band와 Bloch eigenvector를 §1에서 정의하고 공통 U가 특정 k나 band 하나와 대응하지 않는 이유를 §2에서 설명한다.
          - 공통 기호 표는 trial/test와 hopping·potential의 혼동을 예방하고 NEGF·SVD·RGF·CMS·UMS를 첫 본문 사용에 확장한다.
          locations:
          - 도입부
          - §1(1)
          - §2(1)
          - §§5–6
          reason: 선행 개념과 응용 기호의 관계를 독자가 추적할 수 있다.
        C2:
          rating: 2
          evidence:
          - H0,W,H(k),Phi0,U,h0,w,G,T의 크기·역할과 물리적 의미를 식 앞뒤에 설명한다.
          - z와 Etilde를 잔차 전에 정의하고 r_nk와 rho_k를 다른 대상으로 설명한다.
          - §6은 S의 양의 정부호 조건 및 전체 축소 좌표 z를 명시하고 한 번의 S-cancellation을 보인다.
          locations:
          - §§1–4 주요 식 전후
          - §6(2)
          reason: 핵심 식의 가정과 질문이 분명하고 무차원 위상·표현 오차·transmission과 에너지 행렬의 차원을 혼동하지 않는다.
        C3:
          rating: 2
          evidence:
          - UU† 투영으로 버린 진폭은 복원되지 않음을 설명하고 표본 표현이 좋아도 spurious band가 남는 이유를 검증 절차와 연결한다.
          - 장치 전위·접촉·결함이 기준 주기계와 달라 출력 검사가 필요한 이유를 제시한다.
          - Euclidean 직교성이 S_r=I를 뜻하지 않는다는 조건과 산란 도입 뒤 재검증을 명시한다.
          locations:
          - §2(1)
          - §3(2)
          - §4(2)
          - §6(2)
          reason: 보존·손실 정보와 실패 조건이 계산 단계의 원인과 결과로 연결된다.
        C4:
          rating: 2
          evidence:
          - 다섯 표가 각각 기호 대응·작업 순서·행렬 크기·band 검증·출력 검증의 역할을 한다.
          - 26개 display equation은 Bloch 유도, 표본 및 투영 정의, 잔차, Green 함수, 오차 지표와 비용에 사용된다.
          - 가상의 4×6→4×2 예는 실제 물질 데이터로 오인되지 않도록 명시된다.
          locations:
          - 도입부 표 2개
          - §2(2)
          - §3(2)
          - §4(2)
          - 전체 수식
          reason: 설명 요소는 실질적인 비교와 유도에 쓰인다. benchmark 31개 요소와 글자 수의 coverage 통과만으로 이 점수를 부여하지 않았다.
  points: 100.0
  compliance:
    D1:
      status: pass
      evidence:
      - description만 있는 front matter, 단일 H1, 번호 H2·괄호 H3이며 H4가 없다.
      - mkdocs.yml 154–160행의 Model reduction 그룹에서 index가 먼저이고 해당 문서는 한 번 등록된다. 그룹 index 17행의 링크도 대응한다.
      locations:
      - 문서 전체
      - mkdocs.yml
      - docs/computational-science/model-reduction/index.md
      reason: 현재 고정 domain 아래 한 topic 수준의 구조와 metadata·제목 규칙을 충족한다.
    D2:
      status: pass
      evidence:
      - 본문과 표는 한국어 기술 서술체로 관계를 설명하고 핵심 방법·기호는 일관된 영문 표현을 유지한다.
      - NEGF·SVD·RGF·CMS·UMS 첫 확장과 영문 sentence case를 확인했다.
      locations:
      - 도입부
      - §§1–6
      reason: 약어와 기술 문체에 필수 수정 사항을 발견하지 못했다.
    D3:
      status: pass
      evidence:
      - Bloch phase, 켤레전치, block 차원, projector, retarded broadening과 S 내적의 대수를 읽고 검산했다.
      - 새 잔차 식과 비직교 식이 가정 및 근사 구분에 맞으며 Markdown 수식 delimiter도 일관된다.
      locations:
      - §§1–6
      reason: 기호·부호·단위·정확식과 근사식의 모순이 없다. 이번에 MathJax 개별 변환 테스트를 실행했다고 주장하지 않는다.
    D4:
      status: pass
      evidence:
      - 복제 그림과 외부 이미지가 없고 다섯 표의 목적을 앞선 문단이 설명한다.
      - 비교 축은 한국어이며 수식과 차원 예에 본문 해석이 있다.
      locations:
      - 도입부 두 표
      - §2(2)
      - §3(2)
      - §4(2)
      reason: 그림 라이선스 항목은 비해당이며 표가 필요한 비교 역할을 수행한다. viewport screenshot 검사는 하지 않았다.
    D5:
      status: pass
      evidence:
      - 본문 인용 [1]–[8]이 참고문헌과 대응한다. [1],[2],[3],[6] 원문 식별과 관련 passage를 이번에 직접 확인했다.
      - 변경되지 않은 서지 정보와 나머지 원문 식별은 snapshot SHA가 일치하는 기존 evidence의 확인 기록을 재사용했다.
      - 독립 references 결과는 동일 SHA의 변경 범위를 검증했고 원문 2·6에 접근했으며 DOI endpoint 자체의 실패를 별도로 보고했다.
      locations:
      - §8
      - quality/source-checks.md
      - references/result.yaml
      reason: 출처 식별과 주장 대응에 미해결 문제가 없다. DOI 2의 registry metadata를 이번에 새로 조회했다고 기록하지 않는다.
    D6:
      status: pass
      evidence:
      - 직접 실행한 benchmark는 글자 8878/8177.80 및 설명요소 31/29.20로 통과했다.
      - 메인의 check-pending.log는 현재 문서의 review pending만 보고하고 내부 링크·nav·registry hash 관련 오류가 없다.
      - 메인의 strict-render.log는 고정 버전에서 strict MkDocs rendering 성공 6.45초를 기록한다.
      - 메타데이터·nav와 SHA를 직접 확인했으며 최종 등록 후 publication gate는 메인이 수행한다.
      locations:
      - experiment/model-reduction/mode-space-reduction/check-pending.log
      - experiment/model-reduction/mode-space-reduction/strict-render.log
      - quality/initial-findings.md
      reason: evaluate-wiki-quality의 pending 단계 strict-render 절차에 따른 현재 버전 검증 근거이다. pending 상태나 standalone rendering을 최종 publication
        pass로 취급하지 않는다.
  critical_zero_failures: []
  forced_revise: []
  critical_questions:
    dependency_chain: 주기 Hamiltonian과 에너지 범위에서 Bloch 표본을 모아 공통 cell 기저를 만들고 Galerkin 투영·band 검증을 거쳐 열린 장치 출력 및 확장 조건을 검증한다.
    reader_blocker: 표본 압축 기저의 직교성이 원래 연산자 또는 transmission 정확도를 보장한다고 오해하기 쉽지만 §2의 목적 구분과 §3의 서로 다른 오차 정의가 이를 해소한다.
    strongest_revise_case: 비직교 식에 S를 추가로 곱하거나 표본 표현 오차를 수송 오차 보장으로 읽는 경우가 가장 강한 수정 사유이나 본문은 두 혼동을 명시적으로 구분하며 직접 원문·대수 확인에서도
      모순을 발견하지 못했다.
  summary: 전체 본문은 기준 모형과 적용·한계를 의존 순서로 설명한다. 추가된 표본·잔차·비직교 규약 연결은 직접 확인한 원문 및 대수와 일치한다. 유지된 주장은 버전이 일치하는 유효 원문 기록을 재사용했고 독립
    참고문헌 결과와 충돌이 없다. Coverage와 현재 버전 strict rendering 근거를 확인했으며 최종 등록·publication gate는 메인이 수행해야 한다.
