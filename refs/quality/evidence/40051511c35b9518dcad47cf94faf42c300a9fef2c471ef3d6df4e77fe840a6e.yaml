    A:
      percent: 100.0
      criteria:
        A1:
          rating: 2
          evidence:
          - 도입이 국소화·공간 선택·hopping 절단을 구별하고 고정 단일입자 Hamiltonian과 선행 projection 식을 명시한다.
          locations:
          - 도입
          - 1절
          reason: 전자구조 연구자의 입력 지식과 문서 범위가 분명하다.
        A2:
          rating: 2
          evidence:
          - 'H1–H3만 별도 읽음: Bloch/Fourier → isolated gauge → trial → disentanglement → spread → Hamiltonian → 검증 → 요약.'
          locations:
          - 전체 H1–H3
          reason: 동일 수준의 명사구이며 계산 의존 관계를 드러낸다.
        A3:
          rating: 2
          evidence:
          - Q는 고정 공간 회전, D는 선택, T=DQ, V=C_BT로 계층을 분리한다. 입력점 정확성과 off-mesh 보간 및 hopping 절단을 따로 설명한다.
          - 밀도와 SCF 갱신을 고정 H의 고유값 보존으로 대체하지 않는다.
          locations:
          - 2절
          - 4–7절
          reason: 일반식·정확한 기저변환·부분공간 근사·보간 근사를 혼동하지 않는다.
        A4:
          rating: 2
          evidence:
          - 3절 마지막 B0는 초기값이며 4절에서 공간을 선택하고 5절에서 공간 내부를 회전한다.
          - 8절의 다섯 요약 항목은 앞선 관계만 회수한다.
          locations:
          - 3–5절 전환
          - 8절
          reason: 결론을 앞세운 각 절과 단계 연결이 일관된다.
    B:
      percent: 100.0
      criteria:
        B1:
          rating: 2
          evidence:
          - 'G1 도입·1–2절, 무손실 Fourier/gauge 및 차원: 직접 확인 https://arxiv.org/pdf/1112.5411 II.A.3 식(14–15), II.B 식(16–17); https://arxiv.org/pdf/2111.09652v1
            II.A 식(2–5),(18–21); https://www.cond-mat.de/events/correl11/manuscripts/kunes.pdf 3.1 식(13–18).'
          - 'G2 2절 위상/대칭 장애: 직접 확인 https://arxiv.org/pdf/1112.5411 II.G p12 및 각주7; https://www.cond-mat.de/events/correl11/manuscripts/kunes.pdf
            3.3 pp4.10–4.11; https://arxiv.org/pdf/2111.09652v1 II.C PDF p7의 topology/symmetry 조건.'
          - 'G3 3절 trial/Gram/Löwdin·rank: 직접 확인 https://arxiv.org/pdf/1112.5411 II.B 식(16–17); https://arxiv.org/pdf/2111.09652v1
            II.A 식(11–14),(19–20). G=A†A와 원래 AO S를 분리했고 작은 고유값 증폭은 역제곱근식의 명시된 대수적 추론이다.'
          - 'G4 4절 outer/frozen·projector·두 단계: 직접 확인 https://arxiv.org/pdf/cond-mat/0108084 III.A–B 식(8–9), III.G PDF pp6–7;
            https://math.berkeley.edu/~linlin/publications/VariationWannier.pdf 2.2 식(2.12–2.15), 3.1 및 3.3 식(3.8–3.10); https://www.cond-mat.de/events/correl11/manuscripts/kunes.pdf
            4.3 pp4.15–4.16.'
          - 'G5 5절 spread·이웃 중첩·finite difference·최솟값: 직접 확인 https://arxiv.org/pdf/1112.5411 II.C–E 식(28–31); https://www.cond-mat.de/events/correl11/manuscripts/kunes.pdf
            4.1 식(33–39); https://math.berkeley.edu/~linlin/publications/VariationWannier.pdf 3.3–3.4와 Appendix A PDF pp23–24.
            가중치 조건과 M 변환은 Appendix A에서 직접 대조했다.'
          - 'G6 6(1) AO V=C_BDQ 및 metric: 직접 확인 https://arxiv.org/pdf/2111.09652v1 식(2–3),(18–21); https://arxiv.org/pdf/cond-mat/0111138
            VII 식(32–40). H가 조립된 matrix element임을 확인하고 V†HV에 S를 중복 삽입하지 않는 항등식을 검산했다.'
          - 'G7 6(2)–7(1) hopping/보간/오차·준비비용: 직접 확인 https://arxiv.org/pdf/1112.5411 VI.A 식(97–101), II.A.3 각주2; https://arxiv.org/pdf/2111.09652v1
            II.B 식(22–25) 및 PDF pp5–6의 cutoff·supercell image·가중치. 홀수 Gamma mesh와 ±R 대표집합의 Hermiticity는 해당 Fourier식으로부터의 제한된
            추론이며, 임의 대표집합의 off-mesh 보장을 주장하지 않는다.'
          - 'G8 7(2) 연산자·점유수·밀도·SCF 한계: 직접 확인 https://arxiv.org/pdf/2111.09652v1 식(21) 직후 일반 연산자 변환; https://arxiv.org/pdf/cond-mat/0111138
            식(32–35),(44–47), XI 힘/Pulay 및 PDF p15의 SCF 문단; https://arxiv.org/pdf/0906.2569 Appendix A.1 식(A.1–A.7), A.2 식(A.8–A.11),
            4.1 힘. F의 covariance와 band만으로 총전하/에너지/힘을 인증할 수 없다는 결론은 위 식을 연결한 본문 명시 추론이다.'
          locations:
          - 도입 및 1–8절의 바로 붙은 인용
          - 9절 원문 링크
          reason: 각 주장군의 원문을 이 평가자가 web PDF로 직접 읽었다. 기존 평가나 작성자 ledger를 재사용하지 않았다. 예제 수치는 교육 모형이며 main 실행 로그를 재사용하고 코드 동일성을
            직접 확인했다.
        B2:
          rating: 2
          evidence:
          - 'G1/G3/G6/G7: [1] Marzari 계열 이론과 [3] Koepernik–Janson–Sun–van den Brink의 독립 FPLO 유도/구현; AO 관계는 [6] Soler 계열 SIESTA
            유도도 대조. B1의 각 URL·식 위치를 따른다.'
          - 'G2/G5: [2] Kuneš의 별도 교재 전개와 [1]을 대조하고 [3]의 대칭 제약 및 [4]의 독립 변분 분석/수치 구현으로 보완. G4는 [5]의 원 알고리즘과 [4]의 독립 제약식 및 변분
            재정식화를 대조했다.'
          - 'G8: SIESTA [6]와 QUANTUM ESPRESSO [7]의 독립 전자구조 구현·밀도/에너지/SCF 유도, 연산자 변환은 [3]. 동일 논문의 PDF·DOI·arXiv는 중복 계수하지 않았다.'
          - 독립성은 공통 원 논문을 단순 인용하는 문헌의 수가 아니라 직접 제시한 수식·재유도·구현을 기준으로 판정했다. [1]과 [5]만 묶어 독립 두 근거로 간주하지 않았다.
          - 초기발견과 직접 대조를 기록한 뒤 wiki_references/result.yaml 및 claim-evidence.md를 읽었다. 같은 SHA의 독립 감사와 충돌 없음. 그 담당자의 추가 수치 검산은
            재사용 증거이며 자신의 직접 실행으로 기록하지 않는다.
          locations:
          - B1의 G1–G8 URL/절/식 mapping
          - 본문 인용 묶음
          reason: 각 주장군에 별도 provenance의 실질적 확인이 있으며 미러 수를 증거 수로 세지 않는다.
        B3:
          rating: 2
          evidence:
          - 초격자 psi와 cell u 정규화는 [1] 식(14–15)의 규약이다. [3]의 lambda=0 Fourier gauge와 대응한다.
          - Kuneš의 표기/부호를 기계 복제하지 않고 [1] 식(28–31) 및 [4] Appendix A의 center·spread 부호를 기준으로 확인했다.
          - G는 J×J trial Gram, S는 M×M AO overlap이다. w_b는 길이²이며 b와 center 내적은 무차원이다.
          locations:
          - 1절
          - 3–6절
          reason: 정규화·기저 좌표·Fourier 부호·차원이 모두 정합적이다.
        B4:
          rating: 2
          evidence:
          - topological/symmetry 제약, finite mesh 근사, local minimum, frozen 입력점 한계, 고정 H와 SCF 범위가 명시된다.
          - '[3] 출판본과 inspected preprint v1을 구별하고 [5]의 2001년 online publication을 APS 페이지에서 확인했다.'
          locations:
          - 2(1)
          - 5(2)
          - 6(2)
          - 7(2)
          - 9절
          reason: 원문 적용 범위를 확장하지 않고 교육 예제를 물질 결과로 제시하지 않는다.
