  critical_questions:
    dependency_chain: 산란 에너지와 준위 모형에서 Fock self-energy·SCBA를 세우고 보존 전류·IETS·LOE 및 수치 수렴으로 확장한다.
    reader_blocker: Retarded 실수부의 Hilbert transform이 가장 어려운 지점이나 주값 식·단위·수치 오차 설명과 코드가 연결되어 있다.
    strongest_revise_case: 원문과 다른 Hilbert 부호나 spin/eV 인자였다면 핵심 수정 사항이나 직접 규약 변환과 독립 수치 검사가 일치하여 해당하지 않는다.
  summary: 전자 전류 중심의 모형 계층, 점유 재분배와 보존, IETS 해석 및 실행 가능한 수렴 검증이 일관된다. 최종 등록·publication build는 main이 수행한다.
