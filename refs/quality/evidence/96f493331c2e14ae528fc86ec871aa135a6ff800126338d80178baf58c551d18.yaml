  areas:
    A:
      percent: 100.0
      criteria:
        A1:
          rating: 2
          evidence:
          - 도입부가 DFT 독자와 전자 전류 범위를 정하고 NEGF·EPC 선행 문서, 직교 기저·전류 부호·spin·bias를 먼저 지정한다.
          locations:
          - 도입부
          - §2
          reason: 선행 지식과 계산 대상이 명확하며 단일 준위가 이후 설명의 공통 기준이다.
        A2:
          rating: 2
          evidence:
          - 산란 에너지 → 준위 모형 → self-energy → SCBA → 전류 보존 → IETS → LOE 한계 → 수치 검증 순서이다.
          locations:
          - H1–H3 전체
          reason: 명사구 제목만으로 물리 개념과 계산의 의존 관계가 드러난다.
        A3:
          rating: 2
          evidence:
          - 일반 접촉 전류와 Landauer 극한을 분리하고 Born self-energy, SCBA, 전류 2차 절단을 비교한다.
          - Hartree 생략과 fixed bath, 상수 전자행렬 LOE 가정을 명시한다.
          locations:
          - §3(2)
          - §4(2)
          - §5(3)
          - §7
          reason: 근사 계층과 정확한 대수 관계를 혼동하지 않는다.
        A4:
          rating: 2
          evidence:
          - 에너지 이동의 필요성에서 점유 갱신으로, 전류식에서 보존과 IETS로 이어진다. 마지막 여섯 항목은 본문 결과를 회수한다.
          locations:
          - §1–§8 전환
          - §9
          reason: 전환과 요약에 새로운 미검증 주장이 없다.
    B:
      percent: 100.0
      criteria:
        B1:
          rating: 2
          evidence:
          - evidence.md에 기록한 Frederiksen III.2–III.5/App.A–C, Galperin 3d/5a/5b/5d, Viljas III/IV/App.C–E를 직접 확인했다.
          - 본문 인용이 주장 직후에 있고 직접 유도·교육용 수치는 그 성격을 명시한다.
          locations:
          - §1–§8
          - §10
          - experiment/quantum-transport/inelastic/quality/evidence.md
          reason: 핵심 전류·self-energy·근사·측정 주장을 원문의 해당 식과 대조하고 수치는 직접 실행했다.
        B2:
          rating: 2
          evidence:
          - Frederiksen와 Galperin의 별도 저자 집단 및 Viljas의 독립 전개를 대조했다.
          - 전류·점유·SCBA는 [1,2], Fock 및 LOE의 에너지 조건은 [1,2,4]로 교차 확인했다.
          locations:
          - §1–§7 인용 묶음
          - evidence.md 직접 출처 대조
          reason: 같은 원고의 미러를 두 근거로 세지 않았으며 수식 유도와 구현 검산도 별도로 수행했다.
        B3:
          rating: 2
          evidence:
          - 본문 Gn=-iG<, Gp=iG>, +e 순전자 주입과 한 spin 규약이 선행 문서와 일치한다.
          - 원문의 전류 방향·spin 인자와 Hilbert kernel 및 Viljas contour self-energy 부호를 변환하여 대조했다.
          - 독립 analytic Hilbert 검사와 충돌 합 검사가 일치했다.
          locations:
          - 도입부
          - §3
          - §5
          - §8 코드
          - independent-output.txt
          reason: 에너지 이동, 전류 부호, 단위 및 정규화의 충돌을 발견하지 않았다.
        B4:
          rating: 2
          evidence:
          - 강결합·좁은 공명·고정 bath·Hartree 생략·비직교 입력의 한계를 설명한다.
          - 저자·journal·DOI는 원문/ArXiv bibliographic record와 대응한다.
          locations:
          - §3(2)
          - §7
          - §8
          - §10
          reason: 적용 범위와 수치 표의 검증 범위를 과장하지 않는다.
    C:
      percent: 100.0
      criteria:
        C1:
          rating: 2
          evidence:
          - 방출·흡수의 에너지 방향과 Pauli 차단을 먼저 설명하고 self-energy 점유 표지를 정의한다.
          - DFT, NEGF, EPC, SCBA, IETS, LOE, FFT는 본문 첫 substantive 사용에 확장한다.
          locations:
          - 도입부
          - §1–§4
          - §6–§8
          reason: DFT 독자가 단일 준위 예시를 따라 복잡한 NEGF 식에 도달할 수 있다.
        C2:
          rating: 2
          evidence:
          - Fock 에너지 이동의 부호, 실수부 주값, 전류 유입·유출 및 단위, effective occupation의 분자·분모를 해설한다.
          locations:
          - §2–§5
          - §8(1)
          reason: 핵심 수식이 답하는 질문과 가정이 주변 문장에 연결된다.
        C3:
          rating: 2
          evidence:
          - 점유와 빈 상태가 방출 문턱을 정하고 탄성 보정이 신호 부호를 바꿀 수 있음을 설명한다.
          - 수렴 잔차·보존·적분 범위·미분 오차 및 물리 근사 오차를 구분한다.
          locations:
          - §5–§8
          reason: 원인에서 관측량까지 이어지며 근사의 보존 정보와 실패 조건을 밝힌다.
        C4:
          rating: 2
          evidence:
          - 그림 1은 산란 에너지, 그림 2는 미분 신호를 보여 준다. 비교표와 실행코드는 근사 구분과 수렴 검사에 직접 쓰인다.
          - 코드 독립 실행 및 conservation/Hilbert 추가 검사가 통과했다.
          locations:
          - 그림 1–2
          - §4 표
          - §7 표
          - §8 코드·수렴표
          reason: 설명 요소가 구체적인 물리 이해와 재현성에 기여한다.
