    check: Both original expositions give the stated construction. The text describes the localization aim, not a theorem
      that every topological manifold admits exponentially localized WFs.
    assumptions: Periodic Bloch representation; a suitable gauge/subspace for localization. No exponential-localization guarantee
      is asserted.
  - id: dimension-vs-localization
    claim: Within a fixed isolated band manifold unitary mixing and Fourier transformation preserve dimension/information;
      reduction comes from band/subspace selection.
    locations:
    - §1(3) second paragraph
    - comparison table Wannier row
    category: scientific
    status: supported
    method: derivation
    sources:
    - *id001
    - *id002
    check: For J retained bands at Nk mesh points, block-diagonal J×J unitary gauge times invertible discrete Fourier transform
      maps J Nk coefficients bijectively to J Nk coefficients. Thus rank is preserved. Selecting J out of a larger Jk manifold
      is rectangular and discards the complement; the cited sources explicitly separate that selection from gauge optimization.
      No numerical example added.
    assumptions: Information refers to the selected isolated subspace, not discarded original bands; exact transformations,
      before any hopping truncation or finite-mesh interpolation error.
  - id: mode-comparison
