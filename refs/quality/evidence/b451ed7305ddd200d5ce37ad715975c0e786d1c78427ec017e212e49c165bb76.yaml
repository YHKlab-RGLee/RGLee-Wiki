    D5:
      status: pass
      evidence:
      - 인용 번호와 서지 목록은 변하지 않았고 기존 식별·주장 대응 확인 근거를 동일 범위에서 재사용한다.
      - 참고문헌 담당은 /current/가 2026.4를 표시하고 기존 표기는 2026.3인 버전 drift를 보고했다. 해당 수치해석 passage의 지원은 유지되며 이번 윤문이 만든 오류는 아니다. 이를 전체
        최신성 검증 통과로 확대하지 않는다.
      locations:
      - §9 및 기존 evidence D5
      reason: 이번 작업은 전체 URL freshness 감사를 수행한 것으로 보고하지 않는다.
    D6:
      status: pass
      evidence:
      - Main sync 후 automatic check는 이 문서 pending만 보고했다. Main strict render 로그는 5.89초 성공이다.
      locations:
      - automatic-check.txt; strict-render.txt
      reason: 현재 버전의 구조·hash 검사와 strict render를 확인했다. 등록 후 최종 publication gate는 main이 실행하며 여기서 이미 실행했다고 주장하지 않는다.
  critical_zero_failures: []
  forced_revise: []
  critical_questions:
    dependency_chain: 궤적·힘 모형을 세우고 ensemble 선택에서 시간·표본화·평형화 판단으로 진행한다.
    reader_blocker: §5 계산 시간은 wall-clock과 혼동할 여지가 있으나 바로 앞 t_run=N_step Δt와 ps/ns 예제가 궤적 길이로 의미를 고정한다.
    strongest_revise_case: 윤문에서 과학 조건이나 단위가 변했을 경우 revise이지만 전체 diff 대조에서 그런 변경은 없었다. 계산 시간 표현도 현재 문맥에서는 차단 사유가 아니다.
  summary: 전체 본문과 제목을 독립 평가한 뒤 source가 일치하는 기존 근거를 과학적으로 불변인 주장에만 재사용했다. 동일 SHA의 참고문헌 보고와 대조해 차단 문제는 없었다. 정량 기준과 실제 strict
    render를 확인했다. GROMACS moving URL 버전 표기의 기존 drift는 별도 유지관리 사항이다.
