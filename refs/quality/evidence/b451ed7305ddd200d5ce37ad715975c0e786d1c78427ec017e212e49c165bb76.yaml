  areas:
    A:
      percent: 100.0
      criteria:
        A1:
          rating: 2
          evidence:
          - MD의 궤적·평균, 힘/적분/표본화 조건 및 고전 핵·ground-state AIMD 범위를 먼저 밝힌다.
          locations:
          - 도입 두 문단
          reason: 목적과 제외 범위가 본문 전개의 기준이다.
        A2:
          rating: 2
          evidence:
          - 궤적→힘 모형→ensemble→시간 설계→평형화→해석 한계 순서이며 H3는 해당 H2를 구체화한다.
          locations:
          - 전체 H2·H3
          reason: 제목만 읽어도 정의와 적용의 의존 관계를 파악할 수 있다.
        A3:
          rating: 2
          evidence:
          - 연속 Hamiltonian과 이산 Verlet, 조화 시험과 실제 다원자계, BO surface와 핵 운동, 입자 enthalpy와 확장계 보존량을 구별한다.
          locations:
          - §1(1),(3), §3(1), §4(2)
          reason: 일반식·근사·수치 검산의 계층을 혼동하지 않는다.
        A4:
          rating: 2
          evidence:
          - Classical MD까지 포함하는 표 도입을 정확히 고쳤고 요약은 힘·ensemble·시간·표본화의 앞선 결론만 회수한다.
          locations:
          - §3 비교표 도입, §7–8
          reason: 절 전환과 요약에 새로운 과학 주장이 없다.
    B:
      percent: 100.0
      criteria:
        B1:
          rating: 2
          evidence:
          - HEAD source 8a8932a76dcbac6c816a82c153e058a3a19b6d7c28223c6889fd983528ae464c가 제공된 기존 evidence source와 일치한다. 전체
            diff에서 수식·수치·인용·과학 조건은 변하지 않았다. Kühne Eq5–6/Li–Chai §2, Merz–Shirts Eq7–12/Bussi Eq3, Grossfield §7.3.2/Chodera
            Eq8–13 직접 확인 기록을 동일 주장 범위에서 재사용한다.
          - 초기 판단 후 동일 SHA의 wiki_references/report.md를 대조했다. 별도 검토자가 Merz–Shirts integrator/kinetic validation, GROMACS Verlet/Berendsen,
            Wiehe–Schmidler Introduction을 직접 확인했다. 이는 참고문헌 담당의 직접 확인이며 본 평가자의 신규 열람으로 계상하지 않는다.
          locations:
          - §1–6 인용; 기존 evidence B1–B2
          reason: 이번 평가자의 신규 원문 열람으로 주장하지 않으며, 문체 변경이 기존 passage 대응을 바꾸지 않았음을 본문 대조로 확인했다.
        B2:
          rating: 2
          evidence:
          - 기존 증거의 Kühne와 Li–Chai, GROMACS와 LAMMPS, Merz–Shirts와 Bussi, Grossfield와 Chodera의 독립 provenance를 유지한다. Grossfield
            2009/2018은 두 독립 근거로 중복 계산하지 않는다.
          locations:
          - §3 BO, §4 ensemble, §5 sampling
          reason: 인용 조합과 의미가 유지되어 기존 독립 근거를 그대로 적용할 수 있다.
        B3:
          rating: 2
          evidence:
          - E0는 핵–핵 반발을 포함하고 핵 운동에너지를 제외한다. H와 mathcal H를 구별하며 g=2 tau_int/delta_t_s 및 등길이 블록 정규화를 명시한다.
          locations:
          - §3(1), §4(2), §5(2)–(3)
          reason: 한국어 치환은 에너지·상관·보존량 규약을 변경하지 않는다.
        B4:
          rating: 2
          evidence:
          - 고전 핵·SCF·단열 분리와 kinetic trapping 한계, 시간 간격의 시작값 성격이 유지된다. 참고문헌 목록은 변경되지 않았다.
          locations:
          - §2(2), §3, §5 경고, §9
          reason: 범위와 조건을 숨기는 확정 표현으로 바뀌지 않았다.
    C:
      percent: 100.0
      criteria:
        C1:
          rating: 2
          evidence:
          - MD/AIMD/BOMD/CPMD를 확장하고 질량·힘·에너지 및 ensemble 뒤에 표본화 설계를 설명한다.
          locations:
          - 도입, §1, §4, §5
          reason: 일반 설명어의 제약조건·불확도·에너지 치환이 읽기 흐름을 개선한다.
        C2:
          rating: 2
          evidence:
          - 조화 진동자 재귀와 수치 진동수, 운동에너지 분산과 온도 폭, 공분산 합과 block 오차에서 정의·가정·사용 목적을 인접 문단으로 설명한다.
          locations:
          - §1(3), §4(4), §5(2)–(3)
          reason: 핵심 수식은 수치 안정성, 온도 분포, 독립 정보량이라는 구체적 질문에 답한다.
        C3:
          rating: 2
          evidence:
          - 안정성이 위상 정확도를 보장하지 않고 평균 온도가 canonical 분포를 보장하지 않으며 긴 궤적이 모형 오차를 고치지 못한다고 설명한다.
          locations:
          - §1(3), §4(3)–(4), §5 경고, §7
          reason: 지배 관계의 적용 조건과 실패 양상을 함께 제시한다.
        C4:
          rating: 2
          evidence:
          - 방법·ensemble·시간 간격·진단 표와 조화/온도/상관 예제가 비교 및 검산 역할을 한다. Benchmark 12355/8630 글자, 27/26.55 요소 통과.
          locations:
          - §3–6 표와 전반 수식
          reason: 설명 요소는 필요한 비교 축과 수량 관계를 제공하며 장식이 없다.
