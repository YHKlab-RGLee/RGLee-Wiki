    B:
      percent: 100.0
      criteria:
        B1:
          rating: 2
          evidence:
          - '직접 열람 원문 URL: [1] https://arxiv.org/html/1910.03193v3 ; [2] https://arxiv.org/html/2102.09618v3 ; [3] https://arxiv.org/html/2103.10974v1
            ; [4] https://arxiv.org/html/2205.11393v2. 아래 passage는 평가자가 직접 확인했으며 다른 agent 요약을 직접 열람으로 세지 않았다.'
          - '도입·§1 함수간 연산자와 좌표: [1] §1, [2] §2 식(2.7–2.10). 단일 입력 해와 함수 집합 학습 차이: [2] §2/§3.1, [3] §2. 입력 u/출력 s를 a/u로 바꾼
            본문 규약을 확인했다.'
          - '§1(2) antiderivative: [1] §4.1.1, [3] §2 식(2.6–2.7) 및 §3 식(3.3)의 서로 다른 실험이 같은 초기값 문제를 사용한다. affine 입력 적분은 본문이
            명시한 직접 계산이며 정확하다.'
          - '§2 branch/trunk·bias·stacked/unstacked: [1] §2.1 식(2)와 Fig.1, [2] §2 식(2.7–2.10). 상수 bias와 일반 tau_0(y)를 구분한다.
            재사용 계산, affine span, rank≤p, 비선형성은 그 식의 직접 대수적 결과로 검산했다.'
          - '§3 sensor·표본 정보: [1] Fig.1/§2.1/§3, [2] §2 Remark2.3 및 §3.2의 독립 encoding 분석. 동일 encoder 입력의 예측 동일성과 1/2 거리 하한은
            직접 삼각부등식 유도이다. 함수 점값과 interpolation 조건을 유지한다.'
          - '§4 자료 tuple과 함수/좌표 표본: [1] §2.2의 (u,y,G(u)(y)) 설명, [3] §2. Loss/risk는 [2] 식(2.11), [3] 식(2.4)/(2.8). 정규화 측도·서로
            다른 Q_i 가중치·물리 단위는 명시된 본문 선택에서 직접 도출된다.'
          - '수정 §5(1): [1] §1의 approximation/optimization/generalization 구별 및 [2] §3.1 Remark3.2의 norm 차이와 독립 L2 분석을 기초로 한다.
            E_infty는 정의이며 mu(K)=1과 두 확률측도에서 sqrt(R)≤E_infty를 직접 적분 검산했다. 기존 compact-uniform 존재 정리를 반복 인용한 결함은 해당 강한 정리 삭제로
            해소됐다.'
          - '§5(2) 오차 분리: [1] §1/§3의 입력 interpolation 및 안정성 분석, [2] §3.2의 encoder/approximator/reconstructor 분해. 복원 입력의 정의역
            가정 아래 삼각부등식과 조건부 Lipschitz 식을 직접 확인했다.'
          - '§6 잔차·미분·loss: [3] §3 식(3.1–3.3), Figs.2–3, Table1; [4] §2.2 및 §3.3 정리3.9–3.10. [4]는 별도의 미분/잔차 오차 분석이며 [3] 실험의
            단순 재인용으로 세지 않았다. 좌표 미분은 고정 branch에 작용하지 않으며 sine 반례의 두 최대값은 직접 미분 검산했다.'
          - '§6(2–3) 초기조건·입력 요구·척도: [3] 식(3.3)의 Q=m와 sensor에서 residual 평가 조건, [4] §2.2의 조건항 및 잔차 목적함수를 확인했다. y*v hard 조건,
            product rule, U*/L와 U*/L²는 본문이 명시한 구성/chain rule로 직접 검산했으며 논문 실험 결과라고 주장하지 않는다.'
          - '§7(1–2) 평가: [1] §3 및 §4 입력/sensor 구분, [2] risk와 generalization 분석, [3] Table1의 held-out 함수별 relative L2 통계. RMS/상대
            오차 및 0 분모, 집계 방식, N,m,p,Q 분리 권고는 정의의 직접 결과이며 실행한 실험 결과가 아니다.'
          - '수정 §7(3): [1] §4.1.1과 [3] §2/§3의 antiderivative를 전제로 r=u_theta prime-a, delta0=u_theta(0)에서 오차=delta0+integral
            r를 직접 유도했다. Cauchy–Schwarz 및 sqrt(y)≤1로 sup 오차≤|delta0|+||r||L2를 확인했다. C1 예측과 연속 입력, [0,1] 범위를 명시하고 임의 PDE로 확대하지
            않는다. [4] §3.4 식(3.12)는 유한 collocation과 연속 norm의 구별을 뒷받침한다.'
          - '§7(3) 표현 비유일성: [1] 식(2), [2] 식(2.9)에서 (Ab)^T(A^-T t)=b^T t를 직접 검산했다. 최종 범위 경고와 §8 요약은 앞선 주장만 회수한다.'
          - 자체 수정본 재검토 기록 후 같은 SHA의 references/audit.md Current-version recheck를 대조했다. 두 finding의 해소와 0 blocker 결론이 독립 검산과
            일치한다. 이전 원문 확인의 범위를 유지하고 다른 검토자의 추가 passage를 자신의 직접 열람으로 전환하지 않았다.
          locations:
          - §1–7 및 참고문헌
          reason: 전체 주장군을 직접 원문 passage 또는 명시된 검산 가능한 도출에 대응했다. 수정한 두 지점도 정의·국소 유도로 검증했다.
        B2:
          rating: 2
          evidence:
          - 구조·sensor·오차는 [1] 원 구조/실험과 [2]의 독립 encoder/reconstructor·근사 오차 분석을 사용한다. 일부 공저자 중복은 있으나 별도 연구 분석이며 미러를 두 출처로 세지
            않았다.
          - Antiderivative는 [1]과 [3]의 별도 실험, physics-informed는 [3]의 원 실험과 [4]의 독립 미분/잔차 분석을 대조했다. Loss·오차 지표는 [2]의 확률 risk와
            [3]의 empirical 평가가 근거이다.
          - 정확한 compact-uniform theorem은 [1]/[2]가 한 원출처를 반복하므로 독립 두 개로 세지 않았다. 수정본은 그 정리 대신 오차를 정의하고 probability risk 상한을
            직접 유도한다. §7 역방향 일반 안정성 주장도 독립 지원된 antiderivative의 국소 유도로 한정했다.
          - 자체 예·권고·대수식은 원문에 그 식이 그대로 있다고 주장하지 않는다. 독립 두 원문에서 검증한 전제와 본문의 명시적 추론을 구별해 확인했다.
          locations:
          - §5(1) 균일 근사식과 [1,2]
          - https://arxiv.org/html/1910.03193v3 §1
          - https://arxiv.org/html/2102.09618v3 §3.1
          reason: 초기 provenance/지원 범위 실패가 해소되었고 남은 비자명한 주장과 도출 전제를 두 독립 연구에 대응했다.
        B3:
          rating: 2
          evidence:
          - 출처의 입력 u/출력 s 또는 G(u)를 a/u로 통일했다. 상수 bias와 tau_0(y)의 차이를 밝히고 공간 측도를 평균으로 정규화했다.
          locations:
          - §2(1), §4(2), §6(3)
          reason: 기호·좌표·정규화 변환이 일관되며 도함수 척도도 맞다.
        B4:
          rating: 2
          evidence:
          - compact 가정, 고정 sensor 한계, L2와 균일 norm 차이, 미분과 함수값 오차 차이를 명시한다. 네 arXiv 원문의 저자·제목·version/year 확인.
          locations:
          - §3, §5–7, §9
          reason: 문헌의 적용 범위를 과장하지 않는다. provenance 문제는 B2/F3에 기록한다.
    C:
