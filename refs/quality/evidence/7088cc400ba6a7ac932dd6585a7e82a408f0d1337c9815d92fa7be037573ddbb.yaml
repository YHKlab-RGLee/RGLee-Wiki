          - 단일준위 정상상태·Boltzmann 통계·같은 온도·축퇴도 조건을 명시하고 강결합과 비조화성 한계를 분리한다.
          locations:
          - 1절 (2)–(3); 6절; 참고문헌
          reason: 출처의 제한을 유지하고 서지·식별자는 변경하지 않았다.
