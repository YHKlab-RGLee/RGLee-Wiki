      criteria:
        A1:
          rating: 2
          evidence:
          - 7–9행에서 목적, PVD/CVD/ALD/MOCVD와 범위 제외를 제시하고 15–19행에서 공급원리와 결정관계를 구분한다.
          locations:
          - 7–19행
          reason: 필요한 기준과 범위가 세부 공정보다 앞선다.
        A2:
          rating: 2
          evidence:
          - 성장/지표→PVD→CVD의 기준 모형→MOCVD/ALD→epitaxy→선택과 계측→요약의 순서이며 H2/H3 모두 간결한 명사구이다.
          locations:
          - H2/H3 전체, 11–275행
          reason: 기본 성장/평가 개념에 의존하는 개별 기술과 모형 적용을 단계적으로 배치한다.
        A3:
          rating: 2
          evidence:
          - CVD 일차·정상상태/기상반응·축적 무시를 먼저 밝히고 정확한 결합식과 두 제한 근사를 분리한다. J→두께 변환은 편입효율을 가정하는 별도 단계다.
          - ALD의 temporal 구현과 일반 원리를 구별하며 mismatch/실제 strain, coherent/relaxed 상태를 분리한다.
          locations:
          - 94–146, 175–214, 228–247행
          reason: 일반 원리·특정 구현·근사·측정의 수준을 혼동하지 않는다.
        A4:
          rating: 2
          evidence:
          - 36행 CVD/ALD 연결,171행 결정관계로 전환,214행 SC 회수,253–273행 비교·요약이 앞의 결과를 회수한다.
          locations:
          - 36,171,214,249–273행
          reason: 각 전환은 이미 정의한 개념을 확장하고 요약에 미검증 수치를 추가하지 않는다.
