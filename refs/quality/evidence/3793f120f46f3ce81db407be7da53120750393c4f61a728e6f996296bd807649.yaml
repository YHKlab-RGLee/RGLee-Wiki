          - '78–88행 sputtering: [10] Sputtering technique와 [11]L22 slides4–6가 운동량 전달/yield/energy를 지지. [11]L23 slides2–5와
            [1]pp.1–2는 피복/입사각/형상별 검증을 지지한다. 높은 yield와 바닥 도달량이 다르다는 설명은 두 정의·수송의 직접 결과이다.'
