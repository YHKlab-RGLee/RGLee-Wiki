            C:m^-3,k:m/s,J:m^-2s^-1을 검산했다. Omega_inc는 J/N 변환의 화학량론 일반화이며 예시1/n_s와 그 한계를 명시한다.'
          - '125–146행 CVD 극한·압력·활성화: [1]pp.9–13와 [12]L24 slides9–11/L25 slides3–11이 일치. PECVD 저온 활성화와 막 특성 비동치는 [2]slides9–10/[12]L25slide11도
