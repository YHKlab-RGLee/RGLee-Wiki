    strongest_revise_case: Gaussian 반공간 적분을 실제 얕은 implant 해법으로 오인하지 않도록 한계를 명시하고, 표면 절단 시 moment와 fit parameter를 구분했다.
  summary: Doping/annealing의 공급원 경계조건과 peak 해석, charge-state·분자 이온 dose 환산, Gaussian 정규화 및 측정 단계의 연결을 바로잡았다.
