  critical_questions:
    dependency_chain: 저장 회로와 노드→hold/read/write→SNM·sizing→window·통계→macro 설계로 이어진다.
    reader_blocker: SNM의 minimum 누락, write의 필수 반전 주장, PU 복원 노드와 write 하강 노드의 혼동을 수정하고 뒤늦은 정의를 이동했다.
    strongest_revise_case: 논리 전환이 없는 write에 t_flip/50% crossing을 요구하면 정상 동작을 실패로 볼 수 있어 범위와 성공 판정을 명시했다.
  summary: SRAM의 SNM 추출을 두 날개별 최대 정사각형 중 minimum으로 일치시키고, 목표값 쓰기와 상태 반전을 구분했다. 노드 역할을 수정하고 offset·half-select 정의를 앞당겼다.
