        B2:
          rating: 2
          evidence:
          - SNM의 두 날개 minimum은 Grossar와 Kumar의 독립 연구로 대조했다. Write의 목표값 저장과 high node discharge는 MIT와 Grossar를 대조했다. Same-value에서
            논리 반전이 불필요하다는 설명은 이 회로·목표값 정의의 직접적인 귀결이다.
          locations:
          - 3절 SNM·2절 write
          reason: 본문 전체의 흐름과 국소 수정의 근거를 대조했다.
        B3:
          rating: 2
          evidence:
          - 각 날개 최대 내접 변을 s_0,s_1로 정의하고 min을 선택하므로 비대칭 셀의 약한 상태를 누락하지 않는다. 두 VTC의 전압축과 평행한 정사각형의 변은 전압 단위이다. 전환 없는 write에는
            50% crossing 지연을 적용하지 않는다.
          locations:
          - SNM 수식·timing 정의
          reason: 본문 전체의 흐름과 국소 수정의 근거를 대조했다.
        B4:
          rating: 2
          evidence:
