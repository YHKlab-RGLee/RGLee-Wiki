    dependency_chain: 전자구조 snapshot에서 SVD/POD 기저를 얻고 내적과 차원을 정한 뒤 축소 고유문제와 새 조건 오차를 검증하며 최적성·QR·비용을 심화한다.
    reader_blocker: 비직교 metric은 어렵지만 좌표변환과 실행 검산이 이를 해소한다.
    strongest_revise_case: exact RRQR 상수의 단일 provenance와 rank 퇴화조건 누락을 가장 강한 revise 근거로 검토했으나 최종 수정에서 각각 삭제·정확한 조건 추가로 해소되었다.
  summary: Snapshot→SVD/POD→V→ROM을 전자구조 상태와 내적에 맞춰 설명하고, 새 조건의 재구성·고유값·잔차를 실행 예제로 검증한다. 최종 수정에서 세 지적을 해소했으며 독립 평가 기준을 충족한다.
