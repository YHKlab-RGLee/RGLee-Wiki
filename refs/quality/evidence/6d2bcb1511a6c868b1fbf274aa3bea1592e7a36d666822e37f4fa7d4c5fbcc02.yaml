    B:
      percent: 100.0
      criteria:
        B1:
          rating: 2
          evidence:
          - '검토 방식: 초기 독립 발견을 기록한 뒤 원문을 직접 확인하고 독립 참고문헌 감사와 대조했다. 이하 직접 확인은 이 평가자의 확인, 독립 감사는 참고문헌 평가자의 확인, 재사용은 변경되지 않은 주장에
            한하여 기존 passage-level 작성 기록을 적용한 것이며 새 직접 확인으로 계산하지 않는다.'
          - '직접 확인 — XC/Hartree 분해와 spin 규약(1,4절): Capelle, A Bird’s-Eye View of Density-Functional Theory, arXiv cond-mat/0211443
            §§4.1.1–4.1.3 Eqs53–64; Lehtola/Blockhuys/Van Alsenoy, An Overview of Self-Consistent Field Calculations Within
            Finite Basis Sets, arXiv1912.12029 §III Eq6 및 Eq8 뒤 Coulomb 식. rho는 본문의 n, 공간 점유수와 spin별 점유수를 구별했다.'
          - '직접 확인 — spin/coordinate scaling, 단전자 상쇄, hole 정규화(6.2–6.4): Capelle Eqs58–63, §6.1 Eq99 및 이어지는 correlation 예외;
            Kaplan/Levy/Perdew, The Predictive Power of Exact Constraints and Appropriate Norms in Density Functional Theory,
            arXiv2207.03855 §III Eqs21–30,34–49,75. 고정 밀도 coupling 평균과 정수 determinant hole을 구별했다.'
          - '직접 확인 — LO 및 GE2(6.5–6.6): Capelle Eq64; Kaplan §III Eqs42,50,56–58; Vilhena/Räsänen/Lehtovaara/Marques, On the
            violation of a local form of the Lieb-Oxford bound, arXiv1204.6332 §II A–B Eqs1–8와 Eq8 뒤 문단. 비유일성 문구는 삭제되었으며 최종
            주장은 적분 조건과 더 강한 국소 충분조건의 구별이다.'
          - '직접 확인 — 총에너지 piecewise linearity, gap, 곡률(6.7): Mori-Sánchez/Cohen/Yang, Localization and Delocalization Errors
            in Density Functional Theory and Implications for Band-Gap Prediction, arXiv0708.3688 Eqs1–10 및 fragment 분석; Kraisler/Kronik,
            Piecewise Linearity of Approximate Density Functionals Revisited, arXiv1211.5950 Eq1–2 및 ensemble 구성; Capelle
            Eqs65–67. 고정 외부 potential의 전체 에너지 조건이며 XC 단독 선형성이나 GKS에 그대로 더하는 처방으로 확대하지 않았다.'
          - '독립 참고문헌 감사에서 추가 직접 확인 — 균일계: Capelle §5.1, Kaplan §II; SCAN norms: Isaacs/Wolverton arXiv1804.06914 p2 Eq3 앞
            문단과 Sun/Ruzsinszky/Perdew arXiv1504.03028 supplement p11; r²SCAN GE4 미복원: Furness et al. arXiv2008.03374 Table
            I와 Kingsbury et al. PR Materials 6,013801 p2; GE2/q: Perdew et al. arXiv0707.2088 Eqs1–2와 p2 reduced-Laplacian
            문단 및 Kaplan Eq50. 모두 본문 범위와 일치한다.'
          locations:
          - '6'
          - direct-checks.md
          - experiment/xc-ladder/writer/claim-ledger.md C01–C15,C18,C20–C29
          reason: 개념과 적용 범위가 원문에 대응하며 인용은 주장 가까이에 있다.
        B2:
          rating: 2
          evidence:
          - '변경 exact constraints의 교차 근거: uniform limit는 Capelle §5.1/Kaplan §II, spin 및 coordinate scaling은 Capelle Eqs59–61,99/Kaplan
            Eqs34–49, 단전자 조건은 Capelle Eqs62–63/Kaplan c2와 Eq75, hole은 Capelle Eq58 뒤 sum rules 및 coupling 평균/Kaplan Eqs23–30,
            LO는 Capelle Eq64/Kaplan Eqs56–58, 국소 충분조건은 Kaplan의 enhancement-factor 구성/Vilhena §II B Eqs7–8이다. Capelle과 Kaplan은
            독립 저자의 해설이며 미러를 추가 출처로 세지 않았다.'
          - GE2는 Perdew et al., Restoring the Density-Gradient Expansion for Exchange in Solids and Surfaces, arXiv0707.2088
            Eqs1–2 및 p2와 Kaplan Eq50으로 대조했다. 일부 저자가 겹치므로 독립 benchmark 재현이라고 주장하지 않는다. 서로 다른 이론적 문헌의 기존 analytic expansion
            확인이다. tau scaling은 Lehtola §XI C 정의/Kaplan Eqs36,43에 직접 좌표변환을 적용한 명시적 대수 결과이다.
          - 전자 수 조건은 독립 연구진 Mori-Sánchez/Cohen/Yang arXiv0708.3688 Eqs1–10와 Kraisler/Kronik arXiv1211.5950 Eq1–2 및 ensemble
            논의로 확인했다. Kaplan 원고의 XC 단독 선형성 표현은 채택하지 않았고 본문은 전체 E0를 사용한다.
          - '재사용 근거 — unchanged LDA와 GGA 형식(2–3절): Capelle §5.1 Eqs82–85 및 §5.2 Eq88; Lehtola §XI A–B Eqs48–52; Sun et al.
            SCAN arXiv1504.03028 Eqs3–4. 전자당 epsilon과 부피당 e, 균일 밀도 자체와 국소 적용, GGA와 truncated gradient expansion을 구별한 기존 직접
            확인 기록을 재사용했다.'
          - '재사용 근거 — unchanged LDA/PBE/PBEsol 성능(2–3절): Csonka et al., Assessing the performance of recent density functionals
            for bulk solids, arXiv0903.4037 lattice/cohesive 비교; Zhang/Reilly/Tkatchenko/Scheffler, Performance of various
            density-functional approximations for cohesive properties of 64 bulk solids, NJP20,063020 §§3–4; Perdew PBEsol
            arXiv0707.2088 pp1–4 Tables I–II. 독립 고체 계산을 함께 사용하며 격자·응집 경향을 보편 법칙으로 확대하지 않았다.'
          - '재사용 근거 — unchanged meta-GGA 지표(4절): Lehtola §XI C Eqs53–55와 Isaacs/Wolverton arXiv1804.06914 Introduction Eqs1–3/Fig2;
            Sun SCAN Eq2와 Bartók/Yates, Regularized SCAN functional, arXiv1903.01007 §II A Table I. 총 tau의 1/2, zero current,
            spin 비편극 기준을 맞추고 alpha를 유일한 결합 분류자로 해석하지 않았다.'
          - '재사용 및 독립 감사 — SCAN/rSCAN/r²SCAN(4절): Bartók/Yates §II A–B와 Furness et al. arXiv2008.03374 Table I/Eqs2–6은 regularization과
            조건 손실을 지지한다. Furness와 동일 연구진의 arXiv2110.00647을 독립 성능 재현으로 세지 않고, 별도 연구진 Kingsbury et al. PR Materials6,013801
            §§I–III/Figs3–4를 조건·물성 범위 대조에 사용했다. 정확도 보편 개선이나 GE4 복원을 주장하지 않는다.'
          - '재사용 근거 — hybrid 형식과 한계(5절): Capelle Eq56 및 §5.3, Lehtola §III Eq6/§XI D, Matsushita/Nakamura/Oshiyama arXiv1104.2769
            §II Eqs3–7; PBE0/HSE 및 gap의 물질 의존성은 Matsushita §§IV–V의 자체 ten-solid 결과와 Garza/Scuseria arXiv1608.04796 Statistical
            Evaluation의 별도 41-solid 결과로 교차 확인한 기존 기록을 적용했다. 금속 응집 한계는 Zhang §3.3, 비용은 Matsushita §II와 Garza discussion이다.'
          - '재사용 근거 — 장거리 dispersion 및 fifth rung(1,4절): Brandenburg et al., Benchmark tests of a strongly constrained semilocal
            functional with a long-range dispersion correction, arXiv1605.06971 §§I–II와 Zhang §3.3의 별도 dispersion 계산이 중간거리/장거리
            차이를 지지한다. 비점유 상태를 쓰는 fifth-rung 위치는 Isaacs Fig1와 Brandenburg Introduction으로만 설명하며 상세 성능으로 확대하지 않았다.'
