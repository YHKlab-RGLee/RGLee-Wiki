        A2:
          rating: 2
          evidence:
          - H1–H3 별도 읽기에서 변환·gauge → projection·직교화 → spread → 부분공간 선택 → 보간 → 검증의 의존 관계가 드러난다.
          locations:
          - 전체 H2/H3
          reason: 명사구 제목과 동일 수준의 단계 분류가 본문 순서와 일치한다.
        A3:
          rating: 2
          evidence:
          - 정사각 unitary와 직사각 isometry를 구분한다.
          - 실공간 spread 정의와 유한 격자 근사식에 각각 정확식과 근사식 표기를 쓴다.
          - Frozen 입력점 보존과 새 점 보간 오차를 구분한다.
          locations:
          - §2(2)
          - §3(1–2)
          - §4(2)
          - §5(1)
          reason: 기저 변환, 공간 절단 및 유한 격자 오차를 서로 다른 모형 단계로 설명한다.
        A4:
          rating: 2
          evidence:
          - §1 마지막 비교표가 후속 세 선택을 연결하고 §6 검증표가 각 식의 실패 조건을 회수한다.
          - §7의 다섯 요약 항목은 이미 설명한 내용이다.
