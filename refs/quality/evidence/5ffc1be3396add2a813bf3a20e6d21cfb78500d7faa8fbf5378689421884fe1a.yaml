      the article's formula. At symmetric μ shifts the two arctans cancel. T=(γ²/4)/(x²+a²), so ∫_{−a}^{a}T dx=(γ/2)[arctan(x/a)]_{−a}^{a}=γπ/4,
      giving I=eγπ/(4h). At equal Fermi functions the Landauer integrand vanishes.
    assumptions: Exact T=0 step functions, wide-band Lorentzian over the entire real axis and one spin; γ has energy units,
