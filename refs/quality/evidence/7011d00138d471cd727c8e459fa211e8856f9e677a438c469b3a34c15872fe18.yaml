    strongest_revise_case: 가장 강한 보완 논점은 정량 LDOS 단위와 선·평면 출력 변수의 미제시이다. 주어진 목적별 예제는 사용할 수 있고 틀린 정규화를 주장하지 않으므로 C3 부분 충족으로 반영하며
      강제 revise 사유로 확대하지 않는다.
  summary: 전문가용 목적별 참조 구조, 구체적인 파일명·입력 변수·단위 표와 독립적인 분석 분기가 요구에 부합한다. A 100%, B 100%, C 85%, 총 95.5점으로 full 평가를 통과한다. 공간 LDOS
    정규화와 선·평면 출력의 세부 조회 정보는 비차단 보완점이며 등록 후 최종 publication gate는 메인이 수행한다.
