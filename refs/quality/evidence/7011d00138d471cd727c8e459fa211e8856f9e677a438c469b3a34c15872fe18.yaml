    A:
      percent: 100.0
      criteria:
        A1:
          rating: 2
          evidence:
          - 도입부가 QE 7.5·비자성 Si·scalar-relativistic 예시와 설치/실행 성능 제외를 명시한다.
          - 1절 두 표가 계산 목적별 입력 및 저장 자료와 산출물 관계를 먼저 제시한다.
          locations:
