          reason: 자연스러운 한국어와 검색 가능한 핵심 용어가 공존한다. DFT 전문가에게 불필요한 입문 이론을 요구하지 않는다.
        C2:
          rating: 2
          evidence:
          - 원자당 에너지 차이에 N, E_i, E_ref를 정의하고 응집 에너지와 구별한다.
          - B0 곡률식에 영압 V0, 셀 E(V), 단위 일관성과 맞춤의 한계를 설명한다.
          - 격자 배율 s와 부피의 세제곱 관계, 에너지 그림축 역변환은 정의에 따른 관계이다.
          locations:
          - 5(1)
          - 6(2)
          - 7(1)
          reason: 작은 수식 집합이 목적에 맞게 정의되어 있으며 근거 없는 계산 결과나 수치 정밀도를 만들지 않는다.
        C3:
          rating: 1
          evidence:
          - cutoff/k점/점유 폭과 목표량의 관계, 저장 파동함수 필요성, 임의 에너지 원점 이동의 역변환을 설명한다.
          - 8절 LDOS/ILDOS 격자 정규화는 확인 지시만 남아 정량 분석을 독립적으로 완료하기 어렵다.
          - 8(4) 선·평면의 원점/벡터/표본 수는 개념만 있고 변수명·alat 규약의 조회 정보는 부족하다.
          locations:
          - 5절
          - 7절
          - 8(3)–8(4)
          reason: 주요 분석 분기는 충분히 사용 가능하지만 전문가용 참조의 정량 공간 분석 깊이에는 보완 여지가 있다. 미정규화 값을 잘못 단정한 것은 아니다.
        C4:
          rating: 2
          evidence:
          - 전자 계산과 후처리 표를 분리하고 입력·결과에 실제 파일 이름을 적었다.
          - 주석 있는 pw.x 입력과 변수표가 문법/단위 조회를 돕는다.
          - 후처리 코드가 파일명, namelist, 추출/변환을 연결한다.
          locations:
          - 1절
          - 2절
          - 6–8절
          reason: 45개 설명 요소는 서로 다른 실제 조회·작업 목적이 있으며 장식적인 분량 채우기가 아니다.
