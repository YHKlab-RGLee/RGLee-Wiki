          - 1(1)–1(2)
          reason: DFT 전문가에게 필요한 프로그램·파일 범위를 바로 제공하며 초급 DFT 설명을 강요하지 않는다.
        A2:
          rating: 2
          evidence:
          - H1–H3 전체를 별도로 읽었다. 프로그램/입력/UPF/출력/설정 뒤 구조·전자구조·실공간 분석으로 분류한다.
          - 7절 DOS/밴드/PDOS와 8절 실공간 분석은 목적별 조회가 가능하고 선행 자료를 각 절에서 설명한다.
          locations:
          - 전체 H1–H3
          - 7(1)–7(3)
          - 8(1)–8(4)
          reason: 전문가용 매뉴얼의 분류와 의존 관계가 드러난다. 2절의 살펴보기는 약간 안내서 어조이나 의미나 구조를 훼손하지 않는다.
        A3:
          rating: 2
          evidence:
          - SCF 반복 수렴과 cutoff/k점 수렴을 분리한다.
          - 고정 구조/고정 셀/변형 셀과 균일 NSCF/경로 계산, 물리량/출력 형식을 구별한다.
          - 예시 수치는 권장 수렴값이 아니며 영압 EOS 곡률과 유한 표본 맞춤을 구별한다.
          locations:
          - 5절
          - 6절
          - 8(1)–8(2)
          reason: 일반 관계, 수치 근사와 소프트웨어 동작을 혼동하지 않는다.
        A4:
          rating: 2
          evidence:
          - 2(3)의 저장 자료 갱신 경고가 7절 분기의 재사용 조건을 설명한다.
          - 6절 최종 구조 SCF에서 7–8절 분석으로 연결되고 9절은 본문 핵심 다섯 가지를 회수한다.
          locations:
          - 2(3)
          - 6(1)
          - 9절
          reason: 요약에 새로운 과학 주장이 없고 순차 튜토리얼로 오인할 필수 실행 사슬도 부과하지 않는다.
    B:
      percent: 100.0
      criteria:
        B1:
          rating: 2
          evidence:
          - 직접 확인 원문 및 재사용 범위는 quality/direct-evidence.md에 기록했다.
          - 동일 SHA의 references/audit.md가 변경된 입출력/변수/코드/후처리 해석을 주장별 원문 위치에 대응하며 본 검토의 직접 확인 내용과 일치한다.
          - UPF·출력 표식·Si 입력 등 그대로인 주장의 원문 위치와 provenance는 이전 두 audit에서 범위 일치를 확인해 재사용했다.
          locations:
          - 1–8절
          - quality/direct-evidence.md
          - references/audit.md
          reason: 전체 기준은 평가하되 동일 주장에 대한 유효한 원문 근거는 재사용했다. 다른 검토자의 직접 확인을 본인의 직접 확인으로 기록하지 않았으며 지원되지 않은 구체적 변경 주장을 발견하지 않았다.
        B2:
          rating: 2
          evidence:
          - QE 공식 문서/소스는 하나의 provenance로 세었다.
          - 공식 구현과 Illinois 입력 실습, Das 원본 계산/loader, SCM interface, Lee 원본 계산 artifact, Wolf 실행 기록, EOS 원본 강의/ASE의 대응 관계를
            확인했다.
          - Fratesi는 INPUTPP 위치에만 적용하고 Wolf는 입력 eV/파일명에만 적용한다. 정규화 지원으로 확대하지 않았다.
          locations:
          - 6–8절
          - references/audit.md 독립성 및 재사용 기록
          - quality/direct-evidence.md
          reason: 각 주장에 맞는 독립적 원자료 또는 분석을 사용한다. 단순 미러·복사한 매뉴얼 문구·과거 판정을 별도 근거로 세지 않는다.
        B3:
          rating: 2
          evidence:
          - 직접 확인한 INPUT_DOS와 INPUT_PP가 degauss Ry / degauss_ldos eV를 구분한다.
          - PROJWFC 출력은 에너지 eV, states/eV와 원자 채널 LDOS를 확인한다.
          - EOS의 au/noncubic와 셀 에너지 Ry, DOS 그림축 역변환이 일관된다.
          locations:
          - 6(2)
          - 7절
          - 8절
          reason: 부호·단위·에너지 원점·투영/공간 의미에서 모순을 발견하지 않았다. LDOS 정규화의 미제시는 C3에 반영한다.
        B4:
          rating: 2
          evidence:
          - 제시 수치는 수렴값이 아니며 spin/SOC 범위를 한정한다.
          - UPF 의존 투영, 비점유 밴드 확보, 밴드 경로의 극값 한계, EOS 잔차와 범위 의존성을 밝힌다.
          - 원문 확인과 기존 식별 근거 재사용 범위를 direct-evidence.md에 분리한다.
          locations:
          - 도입부
          - 3절
          - 6–8절
          - 10절
          reason: 실행하지 않은 결과를 주장하지 않고 적용 범위와 자료 의존성을 밝힌다.
    C:
      percent: 85.0
