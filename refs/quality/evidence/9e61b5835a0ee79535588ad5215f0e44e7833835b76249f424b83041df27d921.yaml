      criteria:
        A1:
          rating: 2
          evidence:
          - 공통 신뢰성 문서를 선행 링크하고 EM 중심 범위를 명시한다. signed J와 Z*를 flux보다 먼저 정의했다.
          locations:
          - 도입·1절
          reason: 방향 규약이 후속 식을 준비한다.
        A2:
          rating: 2
          evidence:
          - 구동력→flux·응력→수명 모형→측정→실제 배선의 한계→요약 순서를 본문과 대조했다.
          locations:
          - 본문 전체·1–6절
          reason: 기존 큰 절 구성은 적절하며 유지했다.
        A3:
          rating: 2
          evidence:
          - 등온·일정 단면·작은 농도 변화와 C≈C0 조건에서 보존식과 응력 진화를 연결한다. Black 경험식과 Blech 정상상태 조건을 구별한다.
          locations:
          - 2–3절
          reason: 생략된 모형 연결을 설명하고 서로 다른 수준의 식을 혼용하지 않는다.
        A4:
          rating: 2
          evidence:
          - 구동력과 경계 조건을 수명 비교표에서 회수하고 실제 via·분기·동적 전류의 제한으로 연결한다.
          locations:
          - 3절 비교표·5–6절
          reason: 요약은 앞선 논지의 회수이며 새 주장이 없다.
    B:
      percent: 100.0
      criteria:
        B1:
          rating: 2
          evidence:
          - Antonova–Looman Table I와 Eq.(1)–(3), pp.868–869의 signed charge와 응력 방향, He–Suo pp.4–5 Eq.(1)–(2)의 flux·질량 보존·탄성
            연결을 직접 확인했다.
          locations:
          - 참고문헌 10–11; ledger source_evidence
          reason: 미변경 주장은 2026-08-14 full pass(content_hash 561728d07fc70727d2845744ea85e7580c9f359614b00f3bd5f472595f56b433)의
            유효 범위를 승계한다. 과거 유료 passage를 새로 확인했다고 주장하지 않는다.
        B2:
          rating: 2
          evidence:
          - ANSYS의 Antonova–Looman 연구와 Intel/Harvard의 He–Suo 연구를 대조했다. 전기력·응력 기울기와 원자 이동의 결합을 서로 다른 구현 및 해석에서 확인했다.
          locations:
          - 참고문헌 10·11
          reason: 양쪽의 응력·좌표 규약을 변환하며 서로 다른 전체 constitutive model이 동일하다고 주장하지 않는다.
        B3:
          rating: 2
          evidence:
          - 압축 양의 σ=-σtensile, signed Z*, J를 채택했다. 무응력 기울기에서 Ja=(DC/kT)FEM, 보존식에서 σt=-BΩ∂xJa를 얻어 양의 확산계수 DBΩ/kT를 확인했다.
          locations:
          - 1–3절 식
          reason: 정상상태 ∂xσ=Z*eρJ/Ω와 Blech의 절댓값 형태도 일치한다.
        B4:
          rating: 2
          evidence:
          - 농도 구배의 독립 Fick 항은 생략하는 근사임을 명시했다. Black 식의 |J|는 전류 크기 표기이며 반대 방향 고장 모드의 같은 계수를 가정하지 않는다.
          locations:
          - 2절 가정·3절 Black 식
          reason: 새로운 물리적 일반화를 추가하지 않고 기존 규약을 정합화했다.
    C:
      percent: 100.0
      criteria:
        C1:
          rating: 2
          evidence:
          - 전기적 힘에서 signed charge를 먼저 설명하고 stress를 압축 양수로 정한다. 화학퍼텐셜의 기울기로 back stress의 방향을 설명한다.
          locations:
          - 1–2절
          reason: 규약이 달라지면 식 전체의 부호도 변환해야 함을 보여준다.
        C2:
          rating: 2
          evidence:
          - D,C,Ω,k,T와 B,C0를 정의하고 원자 축적→압축응력 증가를 설명한다. Flux 단위는 원자 수/면적/시간이며 PDE의 계수는 길이²/시간이다.
          locations:
          - 2절 flux·보존식·Korhonen
          reason: 기호와 차원, 물리적 의미가 연결된다.
        C3:
          rating: 2
          evidence:
          - 일정 flux와 flux divergence를 구별하고 via·분기와 열 구배에 단일 선분 식을 그대로 적용하지 않는다.
          locations:
          - 2절 및 5절
          reason: 미시 이동과 관측되는 저항 고장의 중간 단계를 유지한다.
        C4:
          rating: 2
          evidence:
          - 물리 단계·모형·시험 자료·다른 고장 기작의 표가 각기 다른 비교를 한다. 새 장식 식이나 그림은 없다.
          locations:
          - 표 4개·그림 1개·수식 10개
          reason: 추가 문장은 기존 식의 모순과 누락된 유도를 해결한다.
