        B1:
          rating: 2
          evidence:
          - '원문 키 P: https://docs.python.org/3/library/stdtypes.html Numeric Types notes 1 및 Bitwise Operations. 키 D: https://greenteapress.com/thinkpython2/html/thinkpython2006.html
            §5.1. 키 N: https://numpy.org/doc/stable/reference/generated/numpy.remainder.html 정의. 세 원문을 이번 품질 평가자가 직접 확인했다.'
          - '원문 키 H: Antti Laaksonen, https://cses.fi/book/book.pdf, July 3 2018. 이번 직접 확인 범위는 pp.95–97 비트, pp.200–202 GCD/LCM·합동·지수,
