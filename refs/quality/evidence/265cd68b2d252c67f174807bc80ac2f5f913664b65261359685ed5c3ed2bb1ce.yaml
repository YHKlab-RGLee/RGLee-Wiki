          - '원문 키 S: Victor Shoup, https://shoup.net/ntb/ntb-v2.pdf Version 2. 이번 직접 확인 범위는 §2.2 pp.16–17, §2.3 p.21, §3.3
            pp.57,62, §4.2 pp.77–79이다. 키 G: https://gmplib.org/manual/Integer-Internals §16.1을 직접 확인했다.'
          - '§1 바닥 몫·복원·나누어떨어짐: P Numeric Types와 D §5.1 직접 확인. 음수 포함 나머지 부호·범위: P와 N 정의 직접 확인. b>0 올림 두 식과 첫 배수 및 부호 표는 이
            전제에서 수작업 유도이다.'
          - '§1 정수 divmod 쌍: https://docs.python.org/3/library/functions.html divmod와 https://numpy.org/doc/stable/reference/generated/numpy.divmod.html
            정의. 기존 감사의 실제 passage 확인을 같은 주장 범위로 재사용했으며 현재 독립 참고문헌 담당도 두 원문을 재확인했다. 품질 평가자의 이번 직접 열람으로 기록하지 않는다.'
          - '§2 GCD 공약수 보존·종료·로그 단계·Fibonacci: H pp.200–201 및 https://cp-algorithms.com/algebra/euclid-algorithm.html Algorithm/Time
            Complexity. H 직접 확인과 기존 원문 확인 재사용을 결합했다. 부호 정규화와 0 반환은 명시한 함수 계약에 대한 직접 논증이다.'
          - '§2 양수 LCM과 나누기 우선 곱셈: H p.200 및 https://cp-algorithms.com/algebra/euclid-algorithm.html Least common multiple
            직접 확인. 0 guard와 abs는 저자 정의 계약의 정적 검사이며 Python math API 검증으로 확대하지 않는다.'
          - '§3 소수 정의·제곱근 약수 경계·홀수 후보: H pp.197,199의 기존 원문 관찰 재사용 및 https://cp-algorithms.com/algebra/primality_tests.html
            Trial division 직접 확인. 정수 제곱 조건과 2·3·49의 분기는 수작업으로 확인했다.'
          - '§3 체 p² 시작·제곱근 종료·O(N log log N) 연산·O(N) 항목: H p.200 및 https://cp-algorithms.com/algebra/sieve-of-eratosthenes.html
            Implementation/Asymptotic analysis의 변경 없는 직접 확인 근거를 재사용했다. 현재 독립 참고문헌 감사도 원문을 다시 확인했다. Python 저장 바이트를 주장하지 않는다.'
          - '§3 반복 소인수 제거·남은 소수·곱 불변식·O(sqrt(n)) 검사: H p.199 및 https://cp-algorithms.com/algebra/factorization.html Trial
            division의 기존 직접 확인을 재사용했다. n=1 및 0 거부와 84 예제는 정적 수작업 확인이다.'
          - '§4 합동 정의 및 덧셈·뺄셈·곱셈 보존: H p.201과 S §2.2 직접 확인. m>=2 규약에서 일치한다. 크기 정보 손실은 나머지류 정의로부터 유도되며 나눗셈 제한은 S §2.3과 역원 존재
            조건으로 뒷받침된다.'
          - '§4 반복 제곱·비음수 지수·양수 지수의 로그 곱셈 수: H p.202와 https://cp-algorithms.com/algebra/binary-exp.html Algorithm 직접 확인. result·base^e
            합동 불변식과 7^13 mod 11=2는 수작업 검산했다.'
          - '§4 역원 존재와 유일한 나머지: S §2.3 p.21 및 https://cp-algorithms.com/algebra/module-inverse.html Definition/Extended Euclidean
            직접 확인. 서로소 조건이며 Bézout 계수 자체의 유일성을 주장하지 않는다.'
          - '§4 추가 계수 복원: S §4.2 Theorem 4.3 pp.78–79와 https://cp-algorithms.com/algebra/extended-euclid-algorithm.html Algorithm의
            대입식을 직접 확인했다. g=A_1c_0+rc_1, r=A_0-A_1q에서 (c_1,c_0-qc_1)가 나오는 것은 동일한 선형결합 보존이다. 3의 modulus 10 역원 7도 직접 손계산했다.'
          - '§4 소수 전용 Fermat 역원과 합성수 반례: H pp.202–203 및 https://cp-algorithms.com/algebra/module-inverse.html Binary Exponentiation.
            현재 직접 확인 및 변경 없는 근거를 결합했다. modulus 9·10·4 예제는 원문 정리로부터 수작업 유도이다.'
          - '§5 구별되는 항목의 순열·조합·부분집합과 경계: H pp.208–209 및 https://cp-algorithms.com/combinatorics/binomial-coefficients.html
            Formulas/Properties. 수작업 선택 모형을 확인했으며 library API 계약으로 취급하지 않는다.'
          - '§5 Pascal·대칭성·모든 modulus의 덧셈 계산: H pp.208–209와 https://cp-algorithms.com/combinatorics/binomial-coefficients.html
            Pascal 및 small n 직접 확인. 역순 갱신과 k′=0의 한 항목 공간 및 n회 외부 반복은 코드 범위 수작업 계산이다.'
          - '§5 factorial 역원 n<p 조건과 범위 밖 한계: S §2.3 역원 기준 및 https://cp-algorithms.com/combinatorics/binomial-coefficients.html
            large prime 직접 확인. 조합 자체가 모두 0이라는 주장은 없으며 합성수 예제는 곱셈으로 검산했다.'
          - '§6 유한 비음수 마스크와 AND/OR/XOR: P Bitwise Operations와 H pp.95–97 직접 확인. full XOR와 가장 낮은 비트 분리는 이진 자리 논리에서 유도했다. C++
            고정 폭 부호 규약을 Python에 이식하지 않는다.'
          - '§7 동기화 LCM·올림 최소성·닫힌 구간 횟수: 위 P+D와 H+CP-Algorithms LCM의 독립 전제를 이용한 창작 문제의 직접 유도이다. 12,36,180 누적·답 360·횟수 4와 경계를
            손으로 검산했다.'
          - '§7 다른 offset의 호환 조건·LCM 간격: H p.204 Diophantine 및 https://cp-algorithms.com/algebra/chinese-remainder-theorem.html
            Solution for not coprime moduli의 변경 없는 직접 근거 재사용. 현재 참고문헌 담당의 직접 재확인과도 일치했다. 4·6 주기 예제는 직접 검산했다.'
          - '§8 비트 길이·학교식 연산·공간: S §3.3의 자리 모형과 알고리즘 및 G §16.1 저장 표현을 직접 확인했다. G는 복잡도 정리가 아니라 독립 자리 표현 전제이다. 본문 O(B),O(B²)는
            자리와 자리 쌍을 직접 센 유도이며 Python 시간 보장이 아니다.'
          - '§8 L<=P^M·M회 GCD·O(M(1+log P)) 연산과 T를 포함한 비트 공간: H/CP GCD 경계 및 S/G 정수 표현에서 직접 유도했다. P=1과 상수 변수 개수의 비상수 비트 공간을
            수작업 확인했다. §9는 기존 결론만 회수한다.'
          - '재사용 provenance: 원문 직접 검사 source-map의 SHA 6fe4598591c4c7340b416172d0d59379087943e949a4f0c36bc620479d9cd70c와 보존
            원고 hash가 일치한다. URL로 현 번호에 대응시켜 변경 없는 범위만 사용했다. 현재 독립 참고문헌 담당은 SHA acef02f6aa3d13b39d6239863118c8f471672079d5893a83f73321a6a37bac77의
            16개 서지·17개 URL을 직접 확인했다. 그의 관찰을 품질 평가자의 직접 열람으로 바꾸지 않았다.'
          locations:
          - §1–9 원자 주장과 바로 뒤 인용
          - 참고문헌 1–16
          reason: 실제 직접 확인과 유효한 범위별 근거 재사용을 구별했고 변경 주장 및 계수 유도를 원문과 직접 대조했다.
        B2:
