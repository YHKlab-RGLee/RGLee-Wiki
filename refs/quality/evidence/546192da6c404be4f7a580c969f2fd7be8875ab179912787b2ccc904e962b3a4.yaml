        B2:
          rating: 2
          evidence:
          - F와 tensor 해석은 Liu와 Perturbo의 독립 논문으로 대조했다. 2D 단위는 Gunst와 Ponce, 정규화 소거는 동일 체적 계수를 갖는 Perturbo 식에서 직접 유도했다. 모든
            기존 출처를 새로 열었다고 주장하지 않는다.
          locations:
          - 변경 주장
          reason: 논리 의존 관계와 변경된 식의 정의·조건을 대조했다.
        B3:
          rating: 2
          evidence:
          - 면밀도 m^-2와 sheet conductivity S의 비는 m^2/(V s)이다. F dot v/|v|의 정의역을 v!=0으로 한정했다. 경계 길이를 시간에 더하지 않고 산란율 합과 연결했다.
          locations:
          - 1·5절
          reason: 논리 의존 관계와 변경된 식의 정의·조건을 대조했다.
        B4:
          rating: 2
          evidence:
          - tensor 누적은 확률 누적이 아니라 가중합이며 단조성을 보장하지 않는다고 명시했다. 정규화 소거와 실제 층간 상호작용 수렴을 구분한다. 기존 서지 항목은 유지했다.
          locations:
          - 5·6절
          reason: 논리 의존 관계와 변경된 식의 정의·조건을 대조했다.
