            Ponce2020 Eq.38–40 및 2D mobility 단위를 직접 확인했다. 미변경 주장은 2026-09-07 full pass(content c3214aed4b5f64ccf15d3c6ffb03ce8a4ae1457e689c45f460e033cd09b2364c)의
