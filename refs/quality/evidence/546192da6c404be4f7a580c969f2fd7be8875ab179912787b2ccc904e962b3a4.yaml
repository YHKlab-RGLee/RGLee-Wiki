        A1:
          rating: 2
          evidence:
          - 저전계 bulk/2D band transport를 범위로 정하고 conductivity·농도에서 mobility를 정의한다. 2D 정규화의 단위 혼동을 이 단계에서 해소했다.
          locations:
          - 도입·1절
          reason: 논리 의존 관계와 변경된 식의 정의·조건을 대조했다.
        A2:
          rating: 2
          evidence:
          - 전체 본문을 읽었다. 정의→선형 BTE와 근사→EPC 산란→계산 workflow→길이 척도→추가 산란 순서를 유지했다.
          locations:
          - 본문 전체
          reason: 논리 의존 관계와 변경된 식의 정의·조건을 대조했다.
        A3:
          rating: 2
          evidence:
          - F를 먼저 정의하고 RTA와 반복해의 차이를 설명한 다음 속도 방향 투영을 도입한다. 전기장 방향과 상태 속도 방향을 구분했다.
          locations:
          - 2·3·5절
          reason: 논리 의존 관계와 변경된 식의 정의·조건을 대조했다.
        A4:
          rating: 2
          evidence:
          - 길이 척도에서 경계 산란으로 넘어가는 문장을 6절 산란율 합에 연결했다. 요약은 물질 mobility와 소자 conductance의 차이를 회수한다.
          locations:
          - 5–7절
          reason: 논리 의존 관계와 변경된 식의 정의·조건을 대조했다.
    B:
