            # Direct source inspection


            Date: 2026-09-30. Source numbers are the frozen article bibliography numbers. All fourteen cited URLs resolved
            to the expected work through web access. This is passage inspection, not merely URL validation. PDF page locations
            below use printed page numbers where stated; `PDF index` is zero-based. No copyrighted full text was archived.


            | ID | Original identifier and inspected locations | Support and limits |

            | --- | --- | --- |

            | 1 | Antti Laaksonen, *Competitive Programmer''s Handbook*, draft July 3, 2018, https://cses.fi/book/book.pdf
            ; §8.1 pp.77–79, §8.3 pp.81–82, §9.1 pp.84–85, §9.2 pp.86–88, §9.3 pp.89–92, §9.4 pp.93–94; additionally §28.1
            p.258; chapter 1 Python large integers paragraph | Direct support for positive-sum monotonicity, opposite-end
            sorted pair scan, strict increasing minimum queue, prefix subtraction, 2D inclusion/exclusion, lowbit blocks,
            iterative segment queries, difference boundary events. Source 1D prefix uses zero-based CLOSED intervals; Fenwick
            uses one-based elements. Article conversions are correct. §28.1 supports deferred updates but is outside the stated
            bibliography chapter range. No directly located two-Fenwick range-add/range-sum passage. |

            | 2 | Darren Yao, *An Introduction to the USA Computing Olympiad*, C++ edition, 2020, https://darrenyao.com/usacobook/cpp.pdf
            ; §§11.1–11.2 pp.55–57 (PDF indices 58–60), §14.1 pp.66–67; title page and §1.4 | Direct prefix recurrence, zero
            prefix, inclusive one-based query, four-corner 2D recurrence and query, O(N+Q), O(NM) preprocessing. Opposite-end
            2SUM algorithm supports sorted pair scan. No fixed sliding-sum implementation or budget-window treatment in §14.1;
            those uses require the article''s stated algebraic inference plus other sources. Independent authored exposition,
            not a mirror of [1]. |

            | 3 | cp-algorithms, https://cp-algorithms.com/data_structures/segment_tree.html ; Simplest form/Construction/Sum
            queries/Update queries; Range updates (Lazy Propagation), Assignment on segments | Direct support for O(log n)
            point assignment and range sum, O(n) construction/storage, O(n) prefix-update cost, parent merge, and lazy deferred
            updates. Recursive implementation differs from article''s iterative half-open code. Article derives that code''s
            invariant independently. This page is e-maxx translation provenance; do not count e-maxx mirror separately. |

            | 4 | Zhongtang Luo, Purdue CS31100 Fall 2023, https://www.cs.purdue.edu/homes/luo401/teaching/cs311-fall2023/index.html
            ; Topics 1–3, especially Topic 1 bullet on start/end events and Topic 2 operation taxonomy | Direct support for
            differential/prefix treatment and +a/-a interval events; corroborates query/update taxonomy. The brief landing
            page does not itself give the full difference-array equation or all complexity-table entries. [1,5] provide those.
            |

            | 5 | cp-algorithms, https://cp-algorithms.com/data_structures/fenwick.html ; One-based indexing approach, Range
            operations 1–3; initial complexity description | Direct support for lowbit extraction, i±lowbit transitions, internal
            1-based construction, repeated point-add initialization, boundary events and prefix point-query recovery. Section
            3 explicitly gives two BITs for range additions and range sums. Same editorial provenance as [3,12]; paired with
            [1], not counted as three independent source families. |

            | 6 | USACO Guide, https://usaco.guide/problems/cses-1661-subarray-sums-ii/solution ; Explanation and Implementation
            warning | Directly says to count preceding prefixes equal to current prefix minus target, then add current prefix.
            Expected O(N) and adversarial Python dict warning are explicit. Website extraction ends at `def main()`; complete
            implementation and use of get() not directly visible. This is USACO''s solution to a CSES problem, not Laaksonen''s
            book passage. |

            | 7 | BITS Pilani CS F211, https://www.bits-pilani.ac.in/wp-content/uploads/Homework7-Hashmaps-AVL-RBT.pdf ; Problem
            1, PDF indices 1–2 | Correct bibliographic identity. Poses the integer target-subarray counting task using hashmaps
            and prefix sums; sample includes a negative element. Main algorithm is omitted as an exercise. Its fixed-size
            sample hashmap also cannot prove expected linear complexity. Count it for problem context, not as a second supplied
            algorithm proof. |

            | 8 | Kyle and Freddie, UNSW CPMSoc, *Hashing In The Real World*, T1 Week 4 2024, https://unswcpmsoc.com/workshops/programming/2024/t1w4.pdf
            ; numbered slides 4,6,15–18; Candy PDF indices 45–51 | Directly supplies signed-array example, prefix difference
            target identity and strict earlier-index condition j<i; hashmap maps prefix to index. It does not itself count
            all intervals. Article explicitly turns indices into frequencies; that inference is correct and combines with
            [6]''s actual count algorithm. Hash collision discussion supports qualifying average complexity. |

            | 9 | PSF, https://docs.python.org/3/library/stdtypes.html#dict.get (redirect https://docs.python.org/3/builtins/stdtypes.html),
            served as Python 3.14.7; Numeric Types, Mapping Types/get | Official support for arbitrary precision integers
            and missing-key default return of dict.get. It does not promise constant-time arbitrary-precision arithmetic.
            Exact get API lacks an independently inspected second application in the current citation set. |

            | 10 | USACO Guide, https://usaco.guide/silver/two-pointers ; Resources, Solution—Sum of Two Values, Sliding Window/Solution—Books
            | Explicit opposite-end movement, original-index tuple sort, longest budget-limited contiguous segment, and total
            O(N) pointer moves. Resources links [1,2], so those links themselves add no provenance. Separate Books explanation
            is directly inspected; zero allowance is the article''s explicit nondecreasing extension, manually valid. |

            | 11 | PSF, https://docs.python.org/3/library/collections.html#collections.deque ; deque definition, pop/popleft,
            deque recipes/moving_average | Official API meaning and approximately O(1) append/pop at both ends. Recipe updates
            sum by incoming minus outgoing value. A second PSF page or translation would not be independent. [12] corroborates
            abstract deque algorithm, not Python implementation performance. |

            | 12 | cp-algorithms, https://cp-algorithms.com/data_structures/stack_queue_modification.html ; Queue modification
            methods 1 and 2, amortized explanation | Direct minimum queue dominance, endpoint removal, index storage and inserted-once/removed-once
            argument. C++ code uses strict `>` and retains ties; article uses `>=` with indices and safely retains newest
            ties, aligned with [1]''s strict increasing queue. Does not establish Python collections semantics. |

            | 13 | AtCoder Library, https://atcoder.github.io/ac-library/production/document_en/segtree.html ; opening contract,
            constructor, prod | Explicit associativity and identity; O(log N) queries/updates conditioned on constant-time
            op/e; O(N) construction; ordered half-open prod and empty prod identity. Example min identity 1e9 presumes bounded
            domain; article''s mathematical +infinity correctly avoids inheriting that bound. |

            | 14 | Stanford CS240H Winter 2016, https://www.scs.stanford.edu/16wi-cs240h/slides/phantoms.html ; Patterns abstracted,
            Monoids, Monoids for lists/numbers | Independent algebra support: left/right identity, associativity, list concatenation
            as an order-sensitive monoid, numeric addition identity zero. Not a segment-tree implementation source; using
            two accumulators is article''s stated consequence of preserving order, rather than a quoted Stanford algorithm.
            |


            ## Claim coverage and manual checks


            - §§1–2: [1,2] jointly support range subtraction and 2D four-corner sums after converting conventions. Manual
            examples: [3,-2,0,5] prefixes 0,3,1,1,6; S(1,4)=3. Matrix total 13 minus first-column total 2 gives 11. Each generated
            row is a distinct list comprehension instance; empty matrix produces [[0]]. For h,w>0 the stated O(hw) handles
            rectangular-validation cost too.

            - §3: [1,4,5] support boundary events and reconstruction. Manual events 0,3,-1,0,-3,1 reconstruct 0,3,2,2,-1.
            l=r cancels, r=n uses sentinel and n=0 returns empty output.

            - §4: [6] directly supports counting, [8] independently supports signed prefix-pair identity and prior-index condition.
            Article clearly labels frequency adaptation from [8]. Manual induction validates {0:1}, query-before-insert, no
            empty intervals, repeated prefix multiplicity. Example has seven intervals exactly as listed. All five edge rows
            are correct. All-zero n=200000 gives 20000100000; absolute prefix bound 200000*10^9=2*10^14. Arithmetic rendering
            defect remains R1.

            - §5: [1,2] independent opposite-end treatments support monotonic elimination; negative values do not invalidate
            sorted inequalities. left<right forbids self-pair; empty and singleton arrays return None. Sorting loses original
            adjacency; original-index metadata and count-vs-one-pair distinctions are sound.

            - §6: fixed window follows prefix identity [2] and moving-average update [11]. Nonnegative budget window is explicitly
            derived from positive-source monotonicity [1,10]; zero values do not prevent termination because B>=0 allows an
            empty zero-sum window. Each pointer advances at most n. Negative counterexample [4,-3,2], B=3 correctly has length-three
            answer but positive-only scan loses start 0. A one-window-per-end equality counter fails on [0,0].

            - §7: [1,12] supply independent deque argument and amortization. Retaining newest equal-value candidate is safe
            for minimum value, not earliest argmin. Manual table values are 2,2,1; all removals occur at back, contradicting
            its expiration description (R2). For width k candidates occupy at most k indices, plus output. No per-iteration
            worst-case constant-time claim is made.

            - §8 Fenwick: [1,5] support block interpretation. External index 4 maps to internal 5→6→8; prefix_sum(4) excludes
            it while prefix_sum(5) reads 5+4. Constructor is zero array, add is delta, assignment needs v-u. Empty size accepts
            only empty query. Range-add/point-query composition requires representing/skipping sentinel endpoint n; text is
            conceptual and does not promise that the shown class implements a range_add method.

            - §8 segment: [1,3] support point-update tree and [13,14] merge contract. Manual [1,7) at size 8 visits 9,14 then
            5,6, disjointly covering six elements. Assignment propagates exactly to ancestors. Empty input uses one zero leaf.
            Single accumulator is specific to commutative addition; two ordered accumulators follow from noncommutative monoid
            contract. Two-BIT range-update extension is source gap R3.


            ## Access and independence limitations


            All cited source bodies were accessible as text. Screenshot requests for Yao p.57 and UNSW slide18 failed with
            cache misses; no visual-specific fact is claimed verified from those screenshots. Text equations, surrounding
            derivations and independently available formulae suffice for the checks above. Complete Python implementation
            at [6] was not exposed by rendered source, and attempted raw GitHub retrieval failed; no unseen code is credited.
            No tests, snippets, examples, or builds were run. No author evidence was used for initial findings.'
