            ## Claim coverage and conventions


            - §1 definitions and representations: [1,5,6], with [3,4] for weighted walks. Matrix minimum for parallel edges
            and preserving edge IDs for constraints are stated as consequences of the chosen path model. Negative diagonal
            handling follows [7,8] together with the explicit zero-length base path; no conflict found.

            - §2 BFS: [1,2] support first-discovery shortest distance, parent restoration and linear aggregate work. Positive
            constant edge-cost scaling is a direct multiplication consequence. Python front-removal cost is R3 below. Component
            stack deliberately makes no claim to reproduce recursive DFS timestamps; [10,11,12] support the distinction. Parent-edge
            multigraph caution has independent [15,16]. Tree and forest counts are explicit counting arguments grounded in
            [1,17]. Negative undirected walk warning matches [4,7].

            - §3 implicit grids and state product: [2,19] supply graph search and concrete implicit-state grid application;
            RC work follows four candidates per cell. [2,6] independently use parity product states; the article marks its
            keys/discount models as constructed examples and derives 2^k subsets and N/M counts. Multi-source-specific support
            gap is R1.

            - §4 relaxation and Dijkstra: [3,4] give realizable distance labels and nonnegative finalization. [23,24] provide
            lazy heaps and priority-update behavior. Code''s strict improvement prevents equal-distance rescheduling; stale
            entries are skipped before scanning. Once validly extracted, each vertex scans outgoing edges once. Successful
            relaxation counts give m+1 pushes (directed representation), O(n+m log(m+2)) time and O(n+m) total storage. For
            undirected adjacency there are 2m scans and the same asymptotic bound. No unqualified log m=log n claim remains.

            - 0–1 BFS: [19,21] establish front/back rule with 0/1 weights. Stored costs preserve ordered distances even for
            stale entries. A valid popped vertex cannot subsequently improve under these nonnegative transitions, so scan
            count is linear. Claimed O(n+m) auxiliary bound is conservative and valid. Other weights are excluded explicitly.
            Python end-cost dependence is R3.

            - Bellman–Ford: [4,22] support n−1 passes plus a further relaxation check, including n=1 negative self-loop. The
            article properly avoids the inaccurate statement that in-place kth pass stores only paths of length at most k.
            Its None-on-any-reachable-negative-cycle behavior is explicitly an interface decision, not a claim all vertices
            are affected.

            - Floyd–Warshall: [7,8] support the k-outer recurrence. Article''s D^(k) allows indices 0..k−1, so transition
            via k correctly produces D^(k+1). Infinity checks prevent unreachable negative edges manufacturing finite candidates.
            Initialization min preserves negative self-loop. Rejecting an entire matrix on any negative diagonal is clearly
            documented. O(n³+m) is valid under the chosen unit-cost arithmetic model.

            - §5 topological order theorem supported by [14,25] and [11]; Kahn implementation itself has support gap R2. DAG
            shortest paths [3,4] support negative weights and O(n+m). The conversion from pair neighbors to integer topology
            is explicit.

            - §6 DSU: [27,28] support exact size+compression code; [17,27] support the amortized theorem (source [17] uses
            rank, with [28] confirming size). Parent links are representation links, and deletion is not in the supplied operations.
            MST objective, ties, negative weights, exchange proof and disconnected forest are supported by [17,18,29]. Sorting+initialization+DSU
            aggregation produces the stated bound; parallel/self edges do not invalidate selection.

            - §7 constructed discount problem: states are exactly unused/used; each original directed edge creates three transitions,
            all nonnegative. [2,6] support product-state reasoning and [3,4] support finalization. This is an explicit derivation,
            not an attributed published numerical example. Edge identity plus previous state is necessary for reconstructing
            a particular multigraph walk.


            Manual trace: 0→1→3 costs 16 without discount and 12 with either edge discounted. 0→1→2→3 costs 19; maximal saving
            is 5, giving 14. 0→2→3 costs 15; savings are 3 or 5, giving minimum 10. Pop (4,1,1) proposes 5 at (2,1), already
            2, and 12 at (3,1), equal to current 12. Pop (5,2,0) improves target used from 12 to 10 and sets unused 15. Pop
            (8,1,0) cannot improve any relevant label. Stale (12,3,1) is discarded. All listed boundary outcomes follow from
            initialization, strict comparison and the optional-discount output minimum. No execution performed.


            ## Findings requiring revision


            ### R1 — independent source for multi-source BFS


            Location §3(2), three paragraphs citing [2,20]. Classification: partial support / scope mismatch. [20] directly
            supports multi-source shortest distances; [2]''s multiple searches refer to connected components and its algorithm
            begins with one source. Add and inspect another independently authored source for simultaneous sources and minimum
            distance to the set. Retain the explicit article-specific empty-source convention.


            ### R2 — independent source for Kahn


            Location §5(1), Kahn procedure and complexity. Classification: partial support / scope mismatch. [26] is direct;
            [11] and [25] cover DFS topological sorting. [14] is not independent from [26]. Add an independent indegree-removal
            algorithm source covering queue processing and linear complexity. General DAG source existence is relevant background
            but does not turn a DFS implementation into a second Kahn source.


            ### R3 — Python-specific deque cost corroboration


            Location §2(1), deque/list.pop(0) contrast, and §4(3), end-operation cost premise. Classification: single provenance
            support. [9] is accurate official documentation; other cited algorithm sources use abstract/C++ queues and do
            not establish Python list movement and deque cost. Add independently authored Python data-structure analysis covering
            these exact costs. A second PSF page or mirror is not independent.


            Optional precision: add [28] to §6(1)''s alpha-bound sentence, since it explicitly treats the size+compression
            variant used here. The theorem is correct and this is not an additional blocker.


            Unverifiable access: none. Bibliographic identity errors found: none. Scientific algorithm errors found under
            stated assumptions: none. Review verdict: revise pending R1–R3. No author evidence was consulted; this is a wholly
            independent source inspection.'
