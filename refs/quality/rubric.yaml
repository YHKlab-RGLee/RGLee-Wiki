evaluation_scope:
  included_kinds: [article]
  excluded_kinds: [home, index]
  excluded_reason: "Home과 index는 navigation hub이므로 article 읽기 평가와 정량 비교에서 제외한다."

rating_scale:
  2: "충분히 충족하며 문서 안의 구체적인 근거를 제시할 수 있다."
  1: "부분적으로 충족하지만 중요한 보완점이 남아 있다."
  0: "누락되었거나 잘못되어 문서의 이해 또는 신뢰성을 훼손한다."

scored_areas:
  A:
    name: "목차와 논리적 구성"
    weight: 35
    minimum_percent: 75
    criteria:
      A1:
        weight: 4
        description: "도입부에서 문제, 목적, 범위와 필요한 제외 범위를 분명히 정한다."
        anchors:
          2: "대상·목적·범위가 도입부에 명시되고 제외 범위도 필요할 때 구분된다."
          1: "대상은 알 수 있지만 목적·범위·제외 조건 중 하나가 암묵적이다."
          0: "무엇을 설명하고 어디까지 다루는지 도입부에서 판단하기 어렵다."
      A2:
        weight: 7
        description: "뒤의 내용을 이해하는 데 필요한 선행 개념과 기호를 먼저 배치한다."
        anchors:
          2: "모든 핵심 선행 개념과 기호가 처음 필요한 식·논증보다 앞서 정의된다."
          1: "대부분 선행하지만 일부 정의가 뒤늦거나 다른 문서 링크에 과도하게 의존한다."
          0: "정의되지 않은 개념·기호 때문에 뒤의 핵심 논증을 따라갈 수 없다."
      A3:
        weight: 7
        description: "H2·H3가 일관된 개념 수준을 가지며 제목만으로 논리적 뼈대가 드러난다."
        anchors:
          2: "동일 수준 제목의 분류 기준이 일관되고 제목 순서만으로 설명 경로가 재구성된다."
          1: "전체 흐름은 보이지만 일부 형제 절의 수준·분류 기준이 섞인다."
          0: "자료 나열식 목차이거나 제목 계층이 논리 관계를 왜곡한다."
      A4:
        weight: 10
        description: "기준 또는 일반식에서 출발해 가정, 근사, 개별 현상, 계산·측정, 한계로 진행한다."
        anchors:
          2: "기준식·일반 모형에서 각 가정을 명시하며 근사식과 적용·검증·한계로 단계적으로 내려간다."
          1: "대체로 순차적이지만 한 단계가 생략되거나 근사와 적용의 경계가 한 곳 이상 불명확하다."
          0: "근사식이 기준식보다 먼저 나오거나 서로 다른 모형 계층을 같은 수준으로 섞는다."
      A5:
        weight: 4
        description: "앞 절의 결과가 다음 절의 입력이 되는 의존 관계를 문장으로 연결한다."
        anchors:
          2: "주요 절 전환마다 앞 절의 출력과 다음 절의 목적이 명시적으로 연결된다."
          1: "연결을 추론할 수 있으나 한두 전환이 단절되어 있다."
          0: "절들이 독립된 메모처럼 나열되어 의존 관계를 알기 어렵다."
      A6:
        weight: 3
        description: "요약은 본문의 핵심 관계와 적용 한계를 빠짐없이 반영하고 새 주장을 추가하지 않는다."
        anchors:
          2: "핵심 관계·가정·한계를 균형 있게 회수하며 새 주장이 없다."
          1: "핵심 결론은 회수하지만 중요한 가정·한계 하나가 빠지거나 사소한 반복이 있다."
          0: "본문의 핵심을 왜곡·누락하거나 검증되지 않은 새 주장을 추가한다."
  B:
    name: "논문과 과학적 근거"
    weight: 35
    minimum_percent: 75
    criteria:
      B1:
        weight: 7
        description: "비자명한 주장과 인용 또는 index의 설명과 실제 링크 대상이 직접 대응한다."
        anchors:
          2: "핵심 주장마다 바로 인용이 있고 직접 확인한 passage가 같은 범위의 주장을 지지한다."
          1: "대부분 대응하지만 일부 복합 주장이나 범위 한정의 근거가 느슨하다."
          0: "핵심 주장에 인용이 없거나 인용문헌이 실제 주장을 지지하지 않는다."
      B2:
        weight: 6
        applies_to: [article]
        description: "핵심 주장의 근거가 검색 요약이 아니라 관련 본문, 수식, 표 또는 그림의 직접 확인에 기반한다."
        anchors:
          2: "핵심 주장 전부에 대해 본문·수식·표·그림의 위치와 지지 내용을 확인했다."
          1: "주요 근거는 직접 확인했지만 일부 보조 주장이나 위치 기록이 불완전하다."
          0: "검색 snippet·초록·복사된 참고문헌에 의존하거나 직접 확인 기록이 없다."
      B3:
        weight: 6
        applies_to: [article]
        description: "핵심 주장을 서로 독립적인 출처가 지지하며 미러나 파생 요약을 중복 근거로 세지 않는다."
        anchors:
          2: "각 핵심 주장에 provenance가 다른 출처 두 개 이상이 같은 의미로 대응한다."
          1: "핵심은 교차검증됐지만 일부 비핵심 주장 또는 독립성 설명이 불완전하다."
          0: "핵심 주장에 독립 출처가 두 개 미만이거나 동일 원출처를 중복 계산한다."
      B4:
        weight: 5
        applies_to: [article]
        description: "주장 성격에 맞게 원 논문, 권위 있는 리뷰, 대학원 교재 또는 공식 문서를 선택한다."
        anchors:
          2: "정의·유도·수치·현재 동작 등 주장 유형별로 최상위 출처 조합을 사용한다."
          1: "출처는 신뢰할 수 있으나 더 직접적인 원 논문·표준 문헌이 일부 빠진다."
          0: "접근 가능한 1차·권위 출처 대신 출처 없는 요약이나 부적절한 자료에 의존한다."
      B5:
        weight: 5
        applies_to: [article]
        description: "출처의 가정, 부호, 단위, 좌표, 정규화와 본문의 과학적 규약이 일치한다."
        anchors:
          2: "서로 다른 출처의 규약을 하나로 변환하고 본문 전체에서 일관되게 사용한다."
          1: "주요 규약은 맞지만 한정 조건이나 변환 설명 일부가 생략된다."
          0: "출처 간 규약을 섞어 식·수치·해석의 의미가 달라진다."
      B6:
        weight: 4
        applies_to: [article]
        description: "문헌의 불일치, 적용 범위와 알려진 한계를 숨기지 않고 구분한다."
        anchors:
          2: "합의·차이·불확실성을 조건별로 구분하고 단정 수준을 근거에 맞춘다."
          1: "주요 한계는 있으나 후보 모형 또는 문헌 차이 하나가 충분히 드러나지 않는다."
          0: "해결되지 않은 충돌이나 조건부 결과를 확립된 보편 사실로 서술한다."
      B7:
        weight: 2
        description: "참고문헌 또는 연결 문서의 저자·제목·경로·발행 정보와 식별자가 정확하다."
        anchors:
          2: "표본 검증에서 모든 서지·경로·식별 정보가 원문과 일치한다."
          1: "식별은 가능하지만 사소한 서지 누락이나 표기 불일치가 있다."
          0: "존재하지 않거나 잘못 식별된 문헌·링크가 있다."
  C:
    name: "설명의 이해 가능성"
    weight: 30
    minimum_percent: 75
    criteria:
      C1:
        weight: 4
        description: "핵심 개념과 대표 용어를 처음 사용할 때 독자가 식별할 수 있도록 정의한다."
        anchors:
          2: "핵심 용어가 첫 사용에서 상위 개념·차별점과 함께 정의된다."
          1: "대부분 정의되지만 하나 이상의 핵심 용어가 문맥 추론에 맡겨진다."
          0: "중심 개념의 뜻이 정의되지 않아 문서의 대상을 오해할 수 있다."
      C2:
        weight: 4
        description: "기호, 단위, 좌표, 부호와 정규화 규약을 사용하기 전에 정의한다."
        anchors:
          2: "핵심 식의 모든 기호·단위·규약이 사용 전에 정의되고 일관된다."
          1: "식은 이해 가능하지만 보조 기호나 단위·부호 규약 일부가 늦거나 암묵적이다."
          0: "정의 누락 또는 규약 충돌로 핵심 식을 재현하거나 비교할 수 없다."
      C3:
        weight: 6
        applies_to: [article]
        description: "핵심 수식의 각 항과 수식이 답하는 물리적·계산적 질문을 바로 설명한다."
        anchors:
          2: "핵심 수식마다 항의 의미, 조건, 단위와 식에서 읽을 수 있는 결과를 설명한다."
          1: "기호는 설명하지만 물리적 의미·조건·관측 결과 중 하나가 약하다."
          0: "핵심 수식을 제시만 하거나 잘못 해설해 독자가 의미를 이해할 수 없다."
      C4:
        weight: 4
        description: "물리적 원인 또는 계산 원리, 지배 모형과 관측·계산 결과를 인과적으로 연결한다."
        anchors:
          2: "원인에서 지배 관계를 거쳐 관측·계산 결과까지 중간 논리가 연결된다."
          1: "주요 인과는 맞지만 한 단계가 생략되어 독자가 보충 추론해야 한다."
          0: "상관관계를 원인으로 서술하거나 원인·모형·결과가 분리되어 있다."
      C5:
        weight: 5
        applies_to: [article]
        description: "근사를 도입할 때 적용 조건과 함께 보존되는 정보와 손실되는 정보를 설명한다."
        anchors:
          2: "각 핵심 근사에 적용 조건, 보존량, 손실 정보와 실패 진단이 붙는다."
          1: "적용 조건과 한계는 있으나 무엇을 보존·손실하는지 일부 불분명하다."
          0: "근사를 정확식처럼 사용하거나 유효 범위와 손실 정보를 설명하지 않는다."
      C6:
        weight: 3
        description: "혼동하기 쉬운 개념, 정량 지표와 대안 모형을 명시적으로 구분한다."
        anchors:
          2: "대표적인 혼동 쌍을 정의·식·관측 결과 차이로 구분한다."
          1: "구분은 있으나 독자가 실제 자료에서 판별할 기준이 약하다."
          0: "서로 다른 개념이나 지표를 혼용해 잘못된 결론을 유도한다."
      C7:
        weight: 2
        description: "이론적 변수나 핵심 개념을 실제 계산, 측정, 탐색 또는 판정 절차와 연결한다."
        anchors:
          2: "입력·절차·추출식·보고량과 검증 조건이 재현 가능한 수준으로 연결된다."
          1: "절차와 보고량은 있으나 추출 기준 또는 검증 조건 일부가 빠진다."
          0: "이론량을 실제 자료에서 어떻게 얻는지 알 수 없다."
      C8:
        weight: 2
        description: "표, 수식, 그림과 코드가 장식이나 개수 채우기가 아니라 중요한 관계를 설명한다."
        anchors:
          2: "각 설명 요소가 본문에서 호출되고 비교·유도·절차 중 분명한 역할을 한다."
          1: "대부분 유용하지만 중복되거나 해설이 약한 요소가 있다."
          0: "설명 요소가 장식·분량 채우기이거나 본문의 이해를 오히려 방해한다."

critical_zero:
  - A4
  - B1
  - B2
  - B3
  - C3
  - C5

compliance:
  D1:
    name: "문서 구조"
    checks:
      - "Front matter, H1–H3 깊이, 번호와 navigation·index의 제목이 저장소 규칙과 일치한다."
  D2:
    name: "언어와 용어"
    checks:
      - "한국어 기술 문체, 대표 전문용어, 약어의 첫 정의와 sentence case가 일관된다."
  D3:
    name: "수식과 정량 표현"
    checks:
      - "수식 구분자가 닫히고 기호·단위·차원이 일관되며 정확식과 근사식이 구분된다."
  D4:
    name: "표와 그림"
    checks:
      - "표의 설명과 그림의 대체 텍스트·캡션·출처·라이선스·로컬 경로가 요구사항을 충족한다."
  D5:
    name: "인용과 참고문헌"
    checks:
      - "본문 인용 번호와 참고문헌이 대응하고 서지 정보와 DOI 또는 URL이 식별 가능하다."
  D6:
    name: "링크와 저장소 상태"
    checks:
      - "내부 링크, navigation, index, automatic check, source hash와 strict build가 현재 문서와 일치한다."

forced_revise_rules:
  F1: "중심 이론에서 일반식과 근사식 또는 서로 다른 모형 계층을 혼동한다."
  F2: "핵심 수식이 잘못되었거나 기호, 부호, 단위 또는 차원이 모순된다."
  F3: "핵심 비자명한 주장에 독립적인 근거가 두 개 미만이다."
  F4: "인용한 출처가 주장을 지지하지 않거나 관련 내용을 직접 확인하지 않았다."
  F5: "해결되지 않은 문헌 충돌을 확립된 사실처럼 서술한다."

passing:
  minimum_overall_points: 80
  minimum_area_percent: 75

quantitative:
  minimum_references: 2
  minimum_percent_of_average: 80
