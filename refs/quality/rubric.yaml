version: 3

review_scopes:
  full:
    description: 새 article 또는 과학 본문·수식·수치·인용이 바뀐 article에 적용한다.
  outline:
    description: 과학 내용은 그대로이고 H2·H3 제목이나 논리 순서만 바뀐 article에 적용한다.

rating_scale:
  2: 충분히 충족하며 문서 안의 구체적인 근거를 제시할 수 있다.
  1: 부분적으로 충족하지만 중요한 보완점이 남아 있다.
  0: 누락되었거나 잘못되어 문서의 이해 또는 신뢰성을 훼손한다.

scored_areas:
  A:
    name: 목차와 논리적 구성
    weight: 35
    criteria:
      A1:
        weight: 8
        scopes: [full, outline]
        description: 도입부가 문제·목적·범위를 정하고 필요한 선행 개념과 기호를 먼저 둔다.
      A2:
        weight: 9
        scopes: [full, outline]
        description: H2·H3의 수준과 순서가 정의에서 모형·적용·한계로 이어지는 의존 관계를 드러낸다.
      A3:
        weight: 11
        scopes: [full]
        description: 일반식, 가정, 근사, 개별 현상과 측정·계산을 올바른 모형 계층으로 구분한다.
      A4:
        weight: 7
        scopes: [full, outline]
        description: 절 전환과 요약이 앞선 결과를 회수하며 새로운 미검증 주장을 추가하지 않는다.
  B:
    name: 과학적 근거
    weight: 35
    criteria:
      B1:
        weight: 10
        scopes: [full]
        description: 모든 비자명한 주장에 직접 확인한 출처 passage와 바로 대응하는 인용이 있다.
      B2:
        weight: 10
        scopes: [full]
        description: 각 비자명한 주장을 provenance가 다른 독립 출처 두 개 이상이 같은 의미로 지지한다.
      B3:
        weight: 8
        scopes: [full]
        description: 출처의 가정·부호·단위·좌표·정규화를 본문의 하나의 규약으로 정합화한다.
      B4:
        weight: 7
        scopes: [full]
        description: 출처의 적용 범위·불일치·한계를 숨기지 않고 참고문헌 식별 정보를 정확히 기록한다.
  C:
    name: 설명의 이해 가능성
    weight: 30
    criteria:
      C1:
        weight: 7
        scopes: [full, outline]
        description: 핵심 개념과 대표 용어를 첫 사용에서 정의하고 독자가 읽기 흐름을 따라갈 수 있다.
      C2:
        weight: 9
        scopes: [full]
        description: 핵심 수식의 기호·단위·각 항의 의미와 식이 답하는 질문을 바로 설명한다.
      C3:
        weight: 9
        scopes: [full]
        description: 원인·지배 관계·결과를 연결하고 근사의 조건·보존 정보·손실 정보·실패 조건을 밝힌다.
      C4:
        weight: 5
        scopes: [full]
        description: 표·수식·그림·코드는 장식이 아니라 비교·유도·측정·계산 절차의 필요한 역할을 한다.

critical_zero: [A3, B1, B2, B3, C2, C3]

compliance:
  D1:
    scopes: [full, outline]
    description: 문서 구조, H1–H3, navigation과 metadata가 현재 형식 규칙을 충족한다.
  D2:
    scopes: [full, outline]
    description: 한국어 기술 문체, 대표 전문용어, 약어 정의와 sentence case가 일관된다.
  D3:
    scopes: [full]
    description: 수식 구분자, 기호, 부호, 단위, 차원, 정확식과 근사식이 일관된다.
  D4:
    scopes: [full]
    description: 표와 그림의 설명, 대체 텍스트, 캡션, 출처, 라이선스와 로컬 경로가 유효하다.
  D5:
    scopes: [full]
    description: 본문 인용과 참고문헌이 대응하고 서지 정보와 DOI 또는 URL을 확인했다.
  D6:
    scopes: [full, outline]
    description: 내부 링크, navigation, registry hash, automatic check와 strict build가 현재 문서와 일치한다.

forced_revise_rules:
  F1: 중심 이론에서 일반식과 근사식 또는 서로 다른 모형 계층을 혼동한다.
  F2: 핵심 수식이 잘못되었거나 기호, 부호, 단위 또는 차원이 모순된다.
  F3: 비자명한 주장에 직접 확인한 독립 근거가 두 개 미만이다.
  F4: 인용한 출처가 주장을 지지하지 않거나 관련 내용을 직접 확인하지 않았다.
  F5: 해결되지 않은 문헌 충돌을 확립된 사실처럼 서술한다.

passing:
  minimum_overall_points: 80
  minimum_area_percent: 75

quantitative:
  minimum_peer_count: 2
  minimum_percent_of_peer_average: 80
  peer_order: [topic_group, scientific_domain, all_articles]
