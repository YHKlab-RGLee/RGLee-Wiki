# Version 4: factual verification rules, not an editorial scoring rubric.
version: 4
finding_statuses:
  supported: 확인 범위와 가정 아래 근거 또는 검산이 주장을 지지한다.
  mismatch: 수식·수치·인용·규약 또는 결론의 구체적인 불일치를 확인했다.
  insufficient: 필요한 근거 또는 검산이 부족하여 아직 확인하지 못했다.
  inaccessible: 필요한 원문에 접근하지 못했다.
categories:
  scientific:
    minimum_sources: 2
    description: 과학적 주장·수식·수치·코드 동작과 그 전제 및 종속 결론
  quotation:
    minimum_sources: 1
    description: 인용 대상 원문과 문구·맥락의 일치; 과학적 주장의 근거 독립성은 별도 확인
  bibliography:
    minimum_sources: 1
    description: 원출처의 제목·저자·발행 정보·DOI 또는 URL 식별
  asset:
    minimum_sources: 1
    description: 원본 그림·표 식별, 수정 상태와 재사용 허가; 과학적 의미는 scientific으로 확인
methods:
  source: 원문 passage를 직접 대조한다.
  calculation: 출처가 뒷받침하는 관계에 대입하여 수치·단위·극한을 검산한다.
  derivation: 출처의 전제에서 대수적 관계를 유도하고 가정과 중간 단계를 남긴다.
# supported의 source 개수/식별자/provenance 형식만 자동 검사한다.
# 실제 독립성·의미·범위·주장 누락 여부는 독립 검토자의 책임이다.
