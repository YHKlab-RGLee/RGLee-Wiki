  findings:
  - 원문 551행 전체를 읽었다. 다차원 기준에서 1D로 내려가는 근사 계층과 거시적 capture coefficient로 환산하는 순서가 명확하다.
  - 2절에서 E_im·E_fn·mathcal E_im·Z_i가 정의 없이 등장하고 3절에서 뒤늦게 에너지 분해를 정의했다. 전체 vibronic 에너지와 최저점 기준 진동 에너지를 2절 golden rule 앞에 정의했다.
  - 3절 (5)의 Schrödinger 식은 E_s(Q)에 E_s0를 포함하면서 eigenvalue를 상대 진동 에너지로 썼다. potential을 E_s(Q)-E_s0로 바꾸고 영점 에너지 포함 규약을 명시했다.
  - 다차원 static coupling의 bra f/ket i와 W_if의 bra i/ket f가 반대인데 conjugation이 표시되지 않는다. 복소 상태에서 mode 간 교차항의 규약을 검증해야 한다.
  - SRH의 n1·p1은 emission/capture 비로 정의되지만 뒤에서 Fermi level=결함준위의 평형농도로 설명한다. 축퇴도 비를 포함하는 일반 경우와 단순 경우의 범위를 검증해야 한다.
  - Q_k는 static coupling에서 먼저 쓰이고 질량가중 normal coordinate 정의는 다음 절에 나온다. 필요한 기호 정의를 첫 사용 부근으로 보강할 필요가 있다.
  decision: 선행 정의·진동 에너지 기준·행렬원소 켤레·SRH 상세평형 조건을 보완하고 full pass를 기록했다. 기존 절 구성은 유지했다.
