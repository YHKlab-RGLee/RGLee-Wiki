  decision: 평면 cell height와 수직 fin/sheet 적층을 구분하고 유효 폭 두 식으로 치수 의존 관계를 보강했다. NOR 표의 PDN/PUN 혼동을 수정했다. 기존 절 순서는 유지하고 full pass를 기록했다.
