  reviewed_source_hash: 9049fb14400e6bf7e8e80ec04585b19f1f9c670cf572572898c6f47d38e74175
  dependency_order: 선형 Hamiltonian·DP 입력 → 비탄성 관측량 → Keldysh self-energy·보존 → SCBA·LOE → probe → 열변위 평균 → 선택·검증
  findings:
  - 본문 전체 451행을 읽었다. DP를 입력 근사로 먼저 정의하고 SCBA·LOE의 solver 근사와 분리한다. Probe와 열변위 평균을 별도 절로 비교하는 큰 구조는 유지한다.
  - 1절 mode eigenvector는 정규화되었다고만 기술한다. 질량 정규화된 dynamical-matrix 고유벡터의 정규화와 실수 normal mode 규약을 명시해야 뒤의 M 및 Q 변환과 일관된다.
  - 2절의 phonon Green function D는 정의·Fourier 및 ħ 정규화 없이 convolution에 등장한다. 이후 lesser/greater 이동 에너지 식의 계수를 확인할 수 있는 정의를 앞에 보강할 필요가 있다.
  - 2절 Δ와 Γ가 Hilbert transform으로 연결된다는 문장은 3절의 정적 Hartree 항까지 포함하는 총 self-energy와 동적 Fock 성분을 구분하지 않는다. 정적 항과 principal-value 항의 역할을 명확히 해야 한다.
  - 6절 M→0 기준을 탄도 NEGF로 부르지만 static disorder가 있는 H_D에서는 coherent 기준이다. 앞선 thermal-displacement 절 및 NEGF 문서와 용어를 맞춰야 한다.
  - 5절 resistivity에서 mobility를 얻는 식은 단일 운반자 종류의 밀도와 전도도 관계라는 적용 조건을 명시해야 한다.
  - Retarded self-energy의 Hilbert 복원에서 고에너지에 사라지는 Fock 성분과 별도 정적 Hartree 이동을 구분하고 행렬 Im 규약을 명시했다. Frederiksen cond-mat/0611562 §III.D Eq.38–39와
    Fig.5 설명, Galperin cond-mat/0612085 §5b Eq.35의 동적 항 및 contour-local 항을 직접 확인했다. strict MkDocs build 3.95초 및 git diff --check 통과. Fourier 규약과
    mobility 적용 조건 및 full review는 미완료이다.
  - D의 무차원 mode 좌표·lesser/greater·에너지 Fourier dt/hbar 규약을 정의하여 convolution의 차원을 연결했다. Frederiksen Eq.27/38 및 Galperin Eq.21–22/35 직접 확인. MD conductance의
    spin 중복 제외, 단일 carrier drift mobility·체적 n·q 정의를 보강했다. Markussen1701.02883 Eq.2–5 및 Giustino1603.06965 §X.B의 carrier current/linear response를
    확인. 참고문헌11은 제목에 해당하는 arXiv1206.2003의 서지 PRB87,235312(2013)와 DOI로 수정했다. full review attestation은 아직 미기록이다.
  decision: 기존 절 순서를 유지하고 normal-mode·Fourier 정규화, Hartree/Fock 구분, coherent 극한, mobility의 단일 carrier 및 spin 규약을 보강했다. 참고문헌11의 서지 불일치를 수정했다. full
    review pass, 정량 12489/7214.93자·39/21.07요소 및 strict build 통과.
