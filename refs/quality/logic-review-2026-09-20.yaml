  dependency_order: 길이 척도·위상 구분 → 반고전 BTE → ballistic·quasi-ballistic·diffusive → 모형 선택·길이 추출 → 경계 사례
  findings:
  - 본문 전체를 읽었다. 운동량·에너지·위상 이완을 별도 축으로 둔 뒤 세 regime을 설명한다. BTE·Landauer를 배타적인 방법으로 분류하지 않는 설명과 끝의 경계 사례는 논리적으로 연결된다.
  - 2절의 전류 상태 합에는 별도 축퇴 인자가 없고 5절 전도도에는 g가 추가되지만 두 상태 합의 n이 어떤 spin·valley를 세는지 구분되지 않는다. 한 계수 규약으로 정합화할 필요가 있다.
  - 2절 전류밀도는 부호 있는 q를 쓰고 3절 Landauer 전류는 |q|를 쓰는데 양의 단자 전류 방향이 정의되지 않는다. 입자 흐름과 관습적 전류 부호의 관계를 명시해야 한다.
  - 2절 제목의 공통 출발점은 반고전 영역의 연결임을 명시하면 coherence를 직접 다루는 양자 정식화까지 BTE에서 유도한다는 오해를 줄일 수 있다.
  decision: 전체 상태 합과 전하 전류 방향을 일치시키고 BTE 적용 범위를 절 제목·선행 설명·보간식 한계·요약에 반영했다. Full pass 기록 완료.
