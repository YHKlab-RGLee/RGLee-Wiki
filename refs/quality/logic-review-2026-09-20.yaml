  dependency_order: Hamiltonian·궤적 평균 → classical/AIMD 힘 모형 → ensemble → 시간 간격·상관시간 → 평형화·production → 오차 분류
  findings:
  - 본문 287행 전체를 읽었다. 힘 모형·수치 적분·표본화의 세 조건을 도입부에서 정하고 각각을 본문에서 설명한다. 총 계산 시간 전에 statistical inefficiency를 정의하고 평형 절단 기준에서 이를 재사용하는 연결은 적절하다.
  - 4절 표 아래 H가 NVE 행에서 Hamiltonian을 뜻한다고 설명하지만 실제 표의 NVE 행에는 H가 없다. 1절 Hamiltonian H와 NPH의 enthalpy H를 구분하는 문장으로 바로잡아야 한다.
  - NPH 설명의 thermodynamic enthalpy E+PV와 extended-system barostat의 보존량을 혼동하지 않도록 구분이 필요하다. 구체적인 알고리즘의 보존량을 확인하는 출처 대조가 남아 있다.
  - 3절 BOMD의 E0(R)는 ground-state energy로만 설명되어 전자 에너지인지 핵–핵 반발까지 포함한 BO potential인지 모호하다. 힘의 기울기 대상이므로 1절 U와의 관계를 정의할 필요가 있다.
  - 단계적 평형화·느린 변수·독립 궤적·종료 기준은 시간 설계와 서로 다른 역할이므로 절 통합이나 반복 삭제는 필요하지 않다.
  - BOMD 에너지·ensemble 보존량 정의를 수정하고 조화 적분 검산, canonical 온도 분포 및 상관·block 오차 계산을 보강했다.
