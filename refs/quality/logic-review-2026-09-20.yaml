    passage: 'Wang §2.8.2 pp.30–31 및 §7.2.5 p.167: 내부 N-bit prefetch는 외부 bit당 N개 준비, 외부 bus datarate=N×core datarate. Micron과 독립 저자 자료로 계수 검증.'
  - url: https://comsec.ethz.ch/wp-content/files/trrespass_sp20.pdf
    passage: '§II p.3 Figure3 앞 문단 직접 확인: single-sided는 같은 bank 임의 두 aggressor, double-sided는 같은 victim 양쪽 이웃, one-location은 단일 row 접근. 본문 victim
      개수 기준을 배치 기준으로 고쳤다.'
  - url: https://projectzero.google/2015/03/exploiting-dram-rowhammer-bug-to-gain.html
