- path: docs/computational-materials-science/quantum-transport/carrier-mobility.md
  status: improved
  initial_source_hash: 94019ca10b9e4cbddfb9294202d3ed17c5c476bbd3cc86d037edbe081f4f9085
  full_text_read: true
  reviewed_source_hash: 12a4a78475d200b252211cdb6122e921980a5c76dc83148eae8ac8b311f2a940
  dependency_order: drift/Hall 정의 → 선형 BTE·CRTA → EPC·SERTA·반복해 → 계산 workflow → MFP·유한소자 → 추가 산란·한계
  findings:
  - 본문 338행 전체를 읽었다. 물질 mobility와 소자 conductance를 구분하며 산란 입력 수준에 따른 계산 범위가 명확하다.
  - 5절 Lambda=F·v/|v|는 속도 방향의 투영인데 수송 방향의 scalar mean free path라고 설명한다. 외부 지정 수송축과 velocity 방향을 구분하고 v=0 상태의 처리 및 tensor accumulation 해석을 명시할
    필요가 있다.
  - 5절 warning은 경계 mean free path를 intrinsic tau에 더한다고 표현해 길이와 시간의 혼합을 유도한다. 6절의 역완화시간 합 규약과 일치하도록 수정해야 한다.
