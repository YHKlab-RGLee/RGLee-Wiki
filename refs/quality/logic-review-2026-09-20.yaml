    필요가 있다.
  - FNV 식의 -q DeltaV_far에 사용할 potential의 구체적 부호 정의가 없이 구현에 따르라고 한다. 1절의 전자 에너지 기준과 구분한 하나의 규약을 명시해야 한다.
