  - 1절 P_array,fail≈N_cell P_cell의 조건을 셀 불량률이 작음으로만 제시한다. 큰 array에서는 N_cell P_cell≪1이어야 하므로 조건을 명시해야 한다.
  - 1절 Monte Carlo는 PVT 고정 직후 global parameter를 다시 추출한다고 쓰므로 고정 corner의 조건부 mismatch 추정과 global/local 계층 샘플링을 구별할 필요가 있다.
  - 3절의 회로 topology와 소자 구조는 서로 다른 설계축이며 본문은 이를 비교 기준과 함께 설명한다. 통일된 세대순으로 재작성할 필요가 없다.
  decision: Nominal matching을 좌우 같은 역할 쌍으로 한정하고 global/local 표본화의 두 경우를 구분했다. 유한 표본 추정과 독립 모형 정확식, Ncell Pcell<<1 근사를 구별했다. 조건별 array 확률 후 global
