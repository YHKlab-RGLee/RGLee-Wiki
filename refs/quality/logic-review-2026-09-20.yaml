  dependency_order: 연속 제거 과정·선택비 → 습식 방향성 → plasma synergy → profile·loading → endpoint 검증 → 공정 창
  findings:
  - 매질(wet/dry)과 방향성(isotropic/anisotropic)을 구별하고 plasma chemistry·ion·passivation에서 profile 해석으로 이어지는 큰 구조는 적절하다.
  - 1절은 t_clear를 wafer에서 최초로 목표막이 사라진 시각으로 정의하지만 5절은 production pattern의 endpoint 후보를 같은 t_clear로 기록하도록 한다. 최초 국부 clear와 집계 신호의 endpoint가 일치한다는
    보장이 없으므로 시각과 기준 위치를 구분해야 한다.
  - 1절의 R_B t_OE는 목표막 아래 정지막이 노출된 뒤의 추가 손실 모형이다. 앞서 B에 mask도 포함시켰으므로 mask 전체 소모량과 endpoint 이후 정지막 손실을 같은 식으로 해석하지 않도록 범위를 제한해야 한다.
  decision: 본문 전체를 재확인하고 큰 절 구성은 유지했다. 1절에서 위치별 clear, 최초/전체 clear와 검출 endpoint를 분리했다. 아래층의 국부 노출 적분과 main etch부터 노출되는 mask 손실을 구별하고, 5절 측정 절차의
    기호를 정합화했다. 6절에서 완전 clear와 허용 손실의 시간 창을 도출했다. Full pass와 strict build를 확인했다.
