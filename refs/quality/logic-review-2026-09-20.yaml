- path: docs/device-physics/semiconductor-process/doping-and-annealing.md
  status: improved
  initial_source_hash: 0813972f2e49bec4c1cb8fc8e67f612fc2453ea936c689b6e7b25b8b309d5385
  full_text_read: true
  reviewed_source_hash: d8786cce5732a79208c20a97b78c3cac3ca084417356e0144d24b6bc131949af
  dependency_order: 평형 확산 기준 → implantation profile → channeling·손상 → activation → 비평형 TED → chemical/electrical 계측 → 누적 공정
  findings:
  - 평형 확산을 기준으로 제시한 뒤 implantation 손상에서 TED로 확장하는 순서가 적절하다. SIMS와 전기적 계측의 차이는 activation 정의 뒤에서 회수한다.
  - 2절 beam current 적분을 면적으로 나눈 값은 전하 면적밀도이며 cm^-2의 이온 dose가 되려면 이온당 전하량으로 나누어야 한다. charge state와 도펀트 원자 수의 관계를 명시해야 한다.
  - 2절 Q=sqrt(2π) ΔRp Cp는 Gaussian을 전체 실수축에 적분한 정규화이다. 기판 x≥0에서 표면 밖 꼬리를 무시할 수 있는 조건을 명시해 dose 보존과 profile의 적용 범위를 연결해야 한다.
  - 1절 constant-source와 limited-source 해는 도입했지만 반무한 영역·표면 조건을 명시하면 두 해의 서로 다른 공급 조건을 더 분명히 구분할 수 있다. peak 변화에 대한 결론도 고정 Cs와 유한 dose를 구별해야 한다.
  decision: 본문 전체와 heading 순서를 재확인하고 기존 큰 구성을 유지했다. 반무한 diffusion의 공급/무유속 조건과 서로 다른 peak 변화를 구별했다. Ion dose에 ze를 포함하고 분자 ion의 도펀트 원자 수를 환산했다.
    Gaussian dose는 전체 축과 기판 반공간 적분을 구분하고 표면 truncation의 한계를 밝혔다. 계측 단계와 참고문헌2의 저자 이니셜을 정정했다. Full pass 및 strict build를 확인했다.
