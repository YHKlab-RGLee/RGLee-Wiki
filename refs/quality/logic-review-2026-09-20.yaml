- path: docs/computational-materials-science/many-body-perturbation/gw-approximation.md
  status: improved
  initial_source_hash: ba742fe0670e1fe2b1bd9f232987d97a10c5d40ee7a97bd61a2ca8d1db1dac2e
  full_text_read: true
  reviewed_source_hash: cff59e9bf2340d5cb737c7e6a1d10b6c79de1402762604243f781ca2fbda6588
  dependency_order: 전자 추가·제거와 QP → Hedin·screening → G0W0 절차 → self-consistency 분류 → 수렴 → 한계
  findings:
  - 본문 351행 전체를 읽었다. 관측하는 charged excitation을 먼저 정하고 KS와 optical gap을 구분하는 도입, Hedin에서 G0W0로 내려오는 순서와 계산 후 수렴·한계는 적절하다.
  - 2절 Dyson G=G0+G0 Sigma G의 G0가 단순히 기준 Green function으로 정의되고, 1·3절에서는 KS 시작점으로 설명한다. Sigma가 Hartree를 뺀 exchange-correlation self-energy라면 기준에
    따라 v_xc 차감과 Hartree 갱신을 구분해야 한다. 기준 연산자를 명시하여 이중 계산 혼동을 해소할 필요가 있다.
  - 3절 (3)의 W0^c가 정의되지 않은 채 convolution에 등장한다. W0-v와 bare exchange 분리의 의미를 식 전에 설명해야 한다. Sigma_nk의 orbital 대각 matrix element 정의도 Z 식 앞에서 명시할 필요가
    있다.
  - 3절 (2)는 KS 에너지에서 평가한 선형화 Z를 뒤의 QP linewidth 식에 그대로 쓴다. 실제 pole의 residue와 KS점 선형화 근사를 구분하고 gamma의 half-width 규약을 밝혀야 한다.
  - 4절 scGW 표의 시작점 의존성 제거를 SCF 해의 유일성 보장으로 읽지 않도록 수렴해와 복수 정상해 가능성의 범위를 출처와 대조할 필요가 있다.
  decision: 기준 Green 함수·self-energy·Z·scGW 조건 수정에 이어 선형화 유도와 다중 pole 예제를 보강했다. 정량·계산 검산·strict build 통과.
