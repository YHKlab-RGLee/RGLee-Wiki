  findings:
  - 전체 절 흐름은 기하 제약에서 소자 배치와 물리 인터페이스를 거쳐 평가로 연결되어 적절하다. 3절 Euler ordering의 NAND 예시가 4절 실제 layout 해석을 준비한다.
  - 1–2절과 요약에서 cell height가 fin 수와 sheet 수를 같은 방식으로 제한한다고 반복한다. 수평 nanosheet의 수직 적층 수와 평면상 sheet 폭을 구분해야 하며 FinFET의 fin 배치와 동일시하면 기하 의존 관계를 오해하게
    된다.
