  - 전극 self-energy만 사용한 계산을 ballistic으로 단정하지만 H_D에 탄성 무질서를 포함하면 phase-coherent diffusive 수송도 가능하다. transport-regimes의 위상·운동량 축 구분과 정합화해야 한다.
  - 표면 g_alpha로 G_alphaD를 쓰는 Schur 식에서 alpha가 전체 전극인지 경계 표면 블록인지 불명확하다. 전체전극 소거와 표면 projection의 차원을 구분할 필요가 있다.
  - A=G Gamma G†에는 bound-state 배제 조건을 명시하지만 G<와 density 식에도 동일한 점유 조건이 필요한지 설명을 연결해야 한다.
  - Landauer 식의 +e 및 왼쪽→오른쪽 양의 전류 안내는 전자 입자 흐름과 관습적 전하 전류의 부호를 구분할 필요가 있다. 단일 준위의 f_eff 비율은 energy-dependent Gamma에도 성립하므로 wide-band 조건이 필수 조건처럼
    제시되지 않도록 확인해야 한다.
