  findings:
  - 본문 전체 462행을 읽었다. 유한계·고정핵·영온·spin 비편극의 기준을 도입부에서 한정한 뒤 밀도와 범함수를 정의한다.
  - 정확한 F의 변분 상한과 근사 XC의 정확도를 먼저 구분하고 Ts와 Exc를 정의한 뒤 KS 방정식을 제시한다. 고윳값 합의 이중 계산 보정은 실제 계산 절보다 먼저 설명되어 총에너지 비교의 기준을 제공한다.
  - LDA·GGA·meta-GGA·hybrid의 입력 정보와 KS/GKS 연산자 차이를 구분한다. Spin별 점유수는 일반 계산 절보다 앞서 정의된다.
  - 총에너지 차로 I·A·기본 gap을 정의한 뒤 KS gap·미분 불연속·ensemble 선형성을 연결한다. 설명식 후 물리적 이유를 보강하는 순서이며 필수 개념이 누락된 비약으로 보이지 않는다.
  - SCF 반복·기저·적분 오차와 모형 오차를 분리하고 요약이 기존 본문을 회수한다. 중복 제거 또는 재배치가 필요한 부분을 찾지 못했다.
  decision: 기존 구조와 본문을 유지한다. 논리 검토에 따른 과학 주장 변경이 없어 새 full review나 출처 재감사를 수행하지 않고 기존 유효 검토를 보존한다.
