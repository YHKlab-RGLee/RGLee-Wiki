  dependency_order: 고정핵 Hamiltonian → determinant·RDM → 에너지 → 제약 변분·Fock → 유한 basis·SCF → spin 제약 → 해석 한계
  findings:
  - 반대칭화·점유 공간·pair density를 먼저 정의해 exchange 에너지와 비국소 Fock kernel을 유도한다. 일반 spin-orbital에서 RHF와 AO 행렬로 좁혀 가는 큰 순서는 적절하다.
  - 6절 (1)은 정확한 바닥상태 에너지보다 낮아질 수 없다는 변분 상한이 SCF의 실제 최솟값 수렴을 전제로 한다고 서술한다. 정규화된 임의의 trial state의 상한 성질과 HF 최소값 도달 여부를 구분해야 하며, 1·3·4절의 정상점/최소점
    구분과 정합화해야 한다.
  - 3절 (2)의 생성·소멸 연산자 a†, a는 정의 없이 등장한다. 점유–비점유 회전의 의미를 이해하도록 해당 연산자가 orbital 점유를 바꾸는 역할을 식 앞에서 간단히 정의할 필요가 있다.
  - 4절 SCF 수렴·안정성과 6절 basis 수렴·correlation은 서로 다른 오차 축을 설명하므로 통합 삭제할 중복이 아니다.
  decision: 생성·소멸 연산자와 점유/비점유 기호를 회전식 앞에 정의했다. 변분 상한과 SCF 최소점 도달을 구분하도록 6절을 수정했다. 기존 절 구성과 수식을 유지했다. 변경 주장별 독립 출처 직접 확인 후 full pass 기록을 완료했다.
