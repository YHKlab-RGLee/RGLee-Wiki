- path: docs/device-physics/memory-device/dram-advance.md
  status: improved
  initial_source_hash: 5532d4886a0daf2baa1765e0fe1f86fe3bf08231ae91720c85769a5171aad6e0
  full_text_read: true
  reviewed_source_hash: 0b4dbb74df025203ebc9782ca9d94e99d4ac39e51940baa681d203e0031b9055
  dependency_order: 전하·누설·배선 병목 → 소자 구조 발전 → cell 면적 비교 → 공정 신뢰성 → 불량·RowHammer → 전력·interface → 차세대 방향
  findings:
  - F와 kF²의 의미가 3절 (4)에 뒤늦게 정의된다. 2절부터 6F²·4F²를 구조 변경의 동기로 사용하므로 정의와 비교 규약을 앞당겨야 한다.
  - 8절 n-bit prefetch를 한 core access가 준비하는 data 수라고 정의하면서 R_data≈2 n f_core로 써 DDR 양 edge 효과를 두 번 센다. Core 전송과 외부 clock·pin data rate의 관계를 일관되게
    다시 정의해야 한다.
  - 6절 single-sided를 한쪽 victim만 있는 경우로 정의하지만 single/double-sided는 victim에 대한 aggressor 배치를 구별한다. 용어 정의 수정이 필요하다.
  - 2절과 3절은 각각 channel 기하와 평면 cell footprint라는 별도 관점이므로 통합 삭제하지 않는다. 4절 공정 손실→5절 failure 관측→6절 disturbance 사례의 순서도 적절하다.
  - 참고문헌 12의 DOI가 DRAM basic의 Liu et al. ISCA 2013 retention 논문 DOI와 같지만 저자·제목·저널이 다르다. Retention·VRT 근거를 재사용하기 전에 서지 정합성을 확인해야 한다.
  decision: F 정의를 선행 배치하고 prefetch 배수 중복·Rowhammer 배치 분류·retention 서지 오류를 정정했다. 참고문헌12의 실제 지원 범위를 대조해 구조 split과 확률 유도 인용에서 제거하고 관측 불량 비율과 i.i.d.
    array 모형을 구분했다. VRT를 capacitor dielectric의 직접 결과로 단정하던 부분은 제거했다. Full review 통과.
