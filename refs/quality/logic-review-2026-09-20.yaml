    passage: 'Micron TN-46-05 pp.1–3 직접 확인: DDR pin rate=2×clock, 2n prefetch는 내부 버스 폭 2배 및 내부 column access 1회당 외부 두 word. n은 문헌에서 bus width
      표기이므로 본문의 배수 n과 혼동하지 않고 해석했다.'
