- path: docs/device-physics/memory-device/sram.md
  status: improved
  initial_source_hash: b0e6dfebb58ae7d88f04029835e561fa98deea566e13ecad72f3300e9d2fd0f2
  full_text_read: true
  reviewed_source_hash: f491c33e81148e7151f0a5ef5f5b52bd1e60b7419864d3806ff34909cce08ec3
  dependency_order: 6T feedback·계층 → hold/read/write → 정적 안정성·전압 한계 → 동적 window·통계 → 주변회로·확장
  findings:
  - Offset과 half-select를 1–4절에서 먼저 사용하고 실질적인 정의는 5절에 둔다. 5절의 정의를 각각 감지와 array/half-select 첫 설명으로 앞당겨 의존 순서를 개선할 수 있다.
  - 3절 본문은 두 butterfly 날개 중 작은 정사각형이 SNM을 제한한다고 설명하지만 Measurement 식은 날개 구분 없이 max를 취한다. 각 날개 최대 내접 정사각형의 최소값임을 식에서도 명시해야 한다.
  - 2절의 write는 상태가 반드시 바뀌어야 한다는 일반 문장은 같은 값을 다시 쓰는 경우를 배제한다. 이어지는 1→0 예시의 전환 조건과 일반 쓰기의 성공 조건을 분리해야 한다.
  - 1절 PU 역할의 낮은 내부 노드를 VDD로 복원한다는 문구와 3절 AX가 낮은 노드를 끌어내린다는 문구는 정상 보존 및 높은 노드의 write 전환 설명과 혼동된다. 회로 상태에 맞게 표현을 수정해야 한다.
  - 3절 PVT·mismatch 설명과 4절 통계 설명은 조건 정의와 샘플링 방법이라는 별도 역할이 있으므로 일괄 삭제할 중복은 아니다.
  decision: Offset·half-select 정의를 첫 사용 앞으로 옮겼다. PU/PD 유지 노드와 write 하강 노드, 두 날개 minimum SNM, 같은 값 쓰기와 반대 값 전환의 구분을 수정하고 본문·수식·caption·요약을 일치시켰다.
    Full pass 기록 완료.
