  - Lorentzian mapping의 순서 보존 문구는 식의 단조 감소와 충돌한다. 비율의 정의역과 D의 비음성에서 ELF의 감소 방향으로 연결하도록 수정했다.
  - 5절 (3) 마지막 문단은 5절 (2)의 해석 순서를 반복하여 제거했다. 비교표의 사례와 독립 지표는 유지했다.
  - 출처 대조 중 참고문헌 9의 저자·제목·연도가 링크된 ABINIT 보고서와 불일치함을 확인해 표지에 맞췄다.
  decision: curvature의 비음성과 정규화 비에 대한 단조 감소를 정의에서 유도하고 중복을 제거했다. Räsänen §II Eq.(12–14),(17–19)와 Lherbier Chapter 3 Eq.(3.1–3.4),(3.9–3.14)를 직접
    대조한 후 full pass를 기록했다.
