  - 2절 pulse 번호를 k=0,1,2,...로 정의하지만 N_ISPP=min{k:VT(k)≥Vvfy}를 pulse 수라고 부른다. 첫 pulse에서 통과하면 0회가 되므로 번호·횟수 규약을 통일해야 한다.
  - 5절 I_string≈V_BL/R_total은 source 기준 0이라는 조건이 없고, 측정에서는 source-line bias도 기록하도록 한다. V_BL의 기준을 명시하거나 BL–source 전위차를 분자로 써야 한다.
  - 3절은 상태 경계 오류와 실제 RBER를 구별하고 Gaussian tail 한계를 제한한다. 6절 비교표는 앞선 설계 변수의 상호작용을 회수하므로 불필요한 중복으로 삭제하지 않는다.
