            rating: 2
            evidence:
            - agent 구조는 ReAct 원 논문과 독립 survey, 현재 API는 공식 문서와 독립 실습 자료, 보안은 OWASP 두 자료로 교차검증된다.
            locations:
            - 참고문헌 1–2
            - 3–17
            reason: 서로 다른 provenance의 근거가 핵심 주장군을 지지한다.
          B4:
            rating: 2
            evidence:
            - 현재 API에는 공식 문서, 개념에는 원 논문·survey, 보안에는 OWASP를 선택했다.
            locations:
            - '## 9. 참고문헌'
            reason: 주장 성격에 맞는 상위 출처를 사용한다.
          B5:
            rating: 2
            evidence:
            - state update, reducer, thread_id와 recursion_limit의 위치를 현행 Python API 규약으로 일관되게 쓴다.
            locations:
            - '## 4'
            - '## 5'
            reason: 버전과 설정 규약이 섞이지 않는다.
          B6:
            rating: 2
            evidence:
            - model 경로의 비결정성, checkpoint가 외부 부작용을 취소하지 않는 점과 middleware의 보안 한계를 명시한다.
            locations:
            - '## 3 (2) 말미'
            - '## 5 (1)'
            - '## 7 (2)'
            reason: 적용 범위와 실패 조건을 보편적 보장과 구분한다.
          B7:
            rating: 2
            evidence:
            - ReAct·survey의 서지와 LangChain·OWASP 공식 URL을 원문에서 식별했다.
            locations:
            - '## 9. 참고문헌'
            reason: 표본 검증한 제목·식별자와 링크가 일치한다.
