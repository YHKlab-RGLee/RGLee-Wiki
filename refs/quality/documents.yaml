            rating: 2
            evidence:
            - 표준 agent loop에서 맞춤 graph, 종료 조건, checkpoint, 검증·보안으로 구체화한다.
            locations:
            - '## 1'
            - '## 4–7'
            reason: 일반 모형에서 실행 제약과 운영 검증으로 단계적으로 내려간다.
          A5:
            rating: 2
            evidence:
            - LangChain 기본 loop의 한계가 LangGraph 제어 흐름과 결합 패턴의 입력으로 연결된다.
            locations:
            - '## 2 말미'
            - '## 4 도입'
            - '## 6 도입'
            reason: 주요 절 사이의 의존 관계가 문장으로 연결된다.
          A6:
            rating: 2
            evidence:
            - 요약이 agent 정의, 두 framework, checkpoint 한계와 운영 통제를 회수한다.
            locations:
            - '## 8. 요약'
            reason: 본문의 핵심과 한계를 새 주장 없이 압축한다.
      B:
        name: 논문과 과학적 근거
        points: 35.0
        maximum: 35.0
        percent: 100.0
        criteria:
          B1:
            rating: 2
            evidence:
            - API 동작에는 LangChain 공식 문서, agent 개념과 위험에는 논문·OWASP 인용이 바로 붙는다.
            locations:
            - 도입부 [1–5]
            - '## 3–5'
            - '## 7'
            reason: 핵심 주장과 인용의 범위가 직접 대응한다.
          B2:
            rating: 2
            evidence:
            - Graph API의 reducer·recursion limit, persistence의 checkpoint, interrupts의 재실행 규칙을 공식 본문에서 확인했다.
