# Independent factual verification. Replace placeholders; do not paste whole source texts.
scope: facts
source_hash: "REPLACE_WITH_CURRENT_SHA256"
assets: {}  # local Markdown image paths (docs/...) and SHA-256 at review time; {} if none
model:
  name: ""
  reasoning_effort: ""
  source: ""
coverage:
  mode: full  # full: all claims; changes: changes since the last verified version and dependencies
  baseline_source_hash: null  # changes requires the exact SHA from quality.sh baseline
  checked: [검증한 주장 묶음과 문서 위치]
  dependencies: []  # affected definitions, assumptions and downstream conclusions
  reused_evidence: []  # changes must identify previous evidence and unchanged supported scope
  # - path: refs/quality/evidence/<file>.yaml
  #   sha256: <SHA-256 of the evidence file bytes>
  #   scope: 변경되지 않은 주장·가정과 근거를 재사용할 수 있는 이유
findings:
  - id: claim-1
    claim: 검증 가능한 주장 또는 같은 전제의 주장 묶음
    locations: [절·식·문장 위치]
    category: scientific
    status: insufficient  # supported / mismatch / insufficient / inaccessible
    method: source  # source / calculation / derivation
    sources: []
    # - id: DOI or stable original URL and bibliographic identity
    #   provenance: 실제 원출처를 구별하는 식별자; 같은 논문의 미러는 동일하게 기록
    #   locator: 원문 페이지·절·식·표·그림 번호
    #   supports: 직접 확인한 내용과 주장의 대응 (원문 전체를 복사하지 않는다)
    check: 원문 비교 결과 또는 재현 가능한 계산·유도; 불일치나 미확인 이유
    assumptions: 가정·범위·기호·부호·단위; 해당하지 않으면 그 이유
summary: 확인 범위와 미해결 사항을 요약한다. 미확인은 오류와 구별한다.
