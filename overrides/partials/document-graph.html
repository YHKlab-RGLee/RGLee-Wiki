<section class="document-graph" aria-label="전체 문서 관계 그래프">
  <div class="document-graph__heading"><strong>문서 지도</strong><span data-count></span></div>
  <p>분야에서 주제로, 주제에서 문서로 이어집니다. 문서를 선택하면 해당 페이지로 이동합니다.</p>
  <div class="document-graph__tools">
    <label>문서 찾기 <input type="search" placeholder="제목 검색" aria-label="그래프 문서 검색"></label>
    <label><input type="checkbox" checked> 문서 간 링크</label>
    <button type="button" data-zoom="in" aria-label="확대">＋</button>
    <button type="button" data-zoom="out" aria-label="축소">−</button>
    <button type="button" data-zoom="reset">전체 보기</button>
  </div>
  <div class="document-graph__legend"><span>● 분야</span><span>● 주제</span><span>● 문서</span> · 실선: 목차 · 점선: 문서 링크</div>
  <svg viewBox="-600 -560 1200 1120" role="group" aria-label="분야와 주제별 문서 연결 지도"></svg>
  <p class="document-graph__status" aria-live="polite">노드에 마우스를 올리거나 키보드로 선택하면 연결을 강조합니다. 확대 후 드래그로 이동할 수 있습니다.</p>
  <noscript>그래프를 보려면 JavaScript를 켜십시오. 전체 문서는 아래 목차에서 찾을 수 있습니다.</noscript>
  <script type="application/json" class="document-graph__data">{{ config.extra.document_graph | tojson }}</script>
</section>
<style>{% include "partials/document-graph.css" %}</style>
<script>{% include "partials/document-graph.js" %}</script>
