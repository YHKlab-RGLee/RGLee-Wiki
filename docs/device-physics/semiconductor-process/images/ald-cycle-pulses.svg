<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="530" viewBox="0 0 1180 530" role="img"><title>Educational illustration for semiconductor thin-film deposition</title><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11" stroke="#64748B" stroke-width="2" fill="none"/></marker></defs><rect width="1180" height="530" fill="#F8FAFC"/><style>text{font-family:Arial,'Noto Sans',sans-serif}</style><text x="34" y="47" font-size="30" font-weight="700" fill="#0F172A" text-anchor="start">ALD: 순차적인 표면 포화반응과 가스 pulse</text><text x="34" y="79" font-size="20" font-weight="500" fill="#64748B" text-anchor="start">예시: TMA/H₂O를 사용하는 Al₂O₃ ALD (개념도)</text><rect x="34" y="110" width="263" height="95" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/><text x="54" y="145" font-size="22" font-weight="700" fill="#1D4ED8" text-anchor="start">1. TMA exposure</text><text x="54" y="179" font-size="17" font-weight="500" fill="#334155" text-anchor="start">표면 –OH와 반응</text><rect x="324" y="110" width="263" height="95" rx="14" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="344" y="145" font-size="22" font-weight="700" fill="#475569" text-anchor="start">2. Purge</text><text x="344" y="179" font-size="17" font-weight="500" fill="#334155" text-anchor="start">기상 TMA 및 부산물 제거</text><rect x="614" y="110" width="263" height="95" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/><text x="634" y="145" font-size="22" font-weight="700" fill="#1D4ED8" text-anchor="start">3. H₂O exposure</text><text x="634" y="179" font-size="17" font-weight="500" fill="#334155" text-anchor="start">표면 –CH₃와 반응</text><rect x="904" y="110" width="263" height="95" rx="14" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="924" y="145" font-size="22" font-weight="700" fill="#475569" text-anchor="start">4. Purge</text><text x="924" y="179" font-size="17" font-weight="500" fill="#334155" text-anchor="start">기상 H₂O 및 부산물 제거</text><path d="M297 158 L318 158" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M587 158 L608 158" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M877 158 L898 158" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="34" y="255" font-size="22" font-weight="700" fill="#0F172A" text-anchor="start">전구체 주입 sequence (정성적 도식)</text><path d="M103 442 L1126 442" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M103 442 L103 286" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="101" y="274" font-size="18" font-weight="500" fill="#334155" text-anchor="start">Gas input</text><rect x="147" y="313" width="75" height="129" rx="1" fill="#BFDBFE" stroke="#2563EB" stroke-width="1"/><text x="184" y="304" font-size="18" font-weight="700" fill="#1D4ED8" text-anchor="middle">A</text><rect x="437" y="313" width="75" height="129" rx="1" fill="#BFDBFE" stroke="#2563EB" stroke-width="1"/><text x="474" y="304" font-size="18" font-weight="700" fill="#1D4ED8" text-anchor="middle">A</text><rect x="727" y="313" width="75" height="129" rx="1" fill="#BFDBFE" stroke="#2563EB" stroke-width="1"/><text x="764" y="304" font-size="18" font-weight="700" fill="#1D4ED8" text-anchor="middle">A</text><rect x="290" y="348" width="75" height="94" rx="1" fill="#BBF7D0" stroke="#16A34A" stroke-width="1"/><text x="327" y="338" font-size="18" font-weight="700" fill="#15803D" text-anchor="middle">B</text><rect x="580" y="348" width="75" height="94" rx="1" fill="#BBF7D0" stroke="#16A34A" stroke-width="1"/><text x="617" y="338" font-size="18" font-weight="700" fill="#15803D" text-anchor="middle">B</text><rect x="870" y="348" width="75" height="94" rx="1" fill="#BBF7D0" stroke="#16A34A" stroke-width="1"/><text x="907" y="338" font-size="18" font-weight="700" fill="#15803D" text-anchor="middle">B</text><text x="1004" y="471" font-size="21" font-weight="500" fill="#334155" text-anchor="start">시간 →</text><text x="35" y="500" font-size="18" font-weight="500" fill="#64748B" text-anchor="start">A = TMA, B = H₂O. Purge 구간은 유입 pulse 사이의 빈 구간으로 표시.</text></svg>