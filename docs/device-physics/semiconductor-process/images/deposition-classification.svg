<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 460" width="1160" height="460" role="img"><title>Thin-film deposition educational schematic</title><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11" stroke="#64748B" stroke-width="2" fill="none"/></marker></defs><rect width="1160" height="460" fill="#F8FAFC"/><style>text{font-family:Arial,'Noto Sans',sans-serif}</style><text x="36" y="48" font-size="31" font-weight="700" fill="#0F172A" text-anchor="start">박막 증착의 두 가지 분류 기준</text><text x="36" y="78" font-size="19" font-weight="500" fill="#475569" text-anchor="start">물질을 어떻게 공급·반응시키는가?   vs.   형성된 막의 결정은 어떻게 배열되는가?</text><rect x="34" y="105" width="720" height="318" rx="20" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/><text x="58" y="146" font-size="25" font-weight="700" fill="#1D4ED8" text-anchor="start">공급 방식 · 반응 메커니즘</text><rect x="60" y="165" width="198" height="206" rx="14" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="2"/><text x="84" y="209" font-size="26" font-weight="700" fill="#1E40AF" text-anchor="start">PVD</text><text x="84" y="247" font-size="18" font-weight="500" fill="#233047" text-anchor="start">• Evaporation</text><text x="84" y="278" font-size="18" font-weight="500" fill="#233047" text-anchor="start">• Sputtering</text><text x="84" y="319" font-size="17" font-weight="500" fill="#64748B" text-anchor="start">물리적 입자 방출</text><rect x="278" y="165" width="218" height="206" rx="14" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="2"/><text x="302" y="209" font-size="26" font-weight="700" fill="#1E40AF" text-anchor="start">CVD</text><text x="302" y="245" font-size="18" font-weight="500" fill="#233047" text-anchor="start">• LPCVD</text><text x="302" y="273" font-size="18" font-weight="500" fill="#233047" text-anchor="start">• PECVD</text><text x="302" y="301" font-size="18" font-weight="500" fill="#233047" text-anchor="start">• MOCVD</text><text x="302" y="337" font-size="17" font-weight="500" fill="#64748B" text-anchor="start">연속 기상 반응</text><rect x="516" y="165" width="210" height="206" rx="14" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="2"/><text x="540" y="209" font-size="26" font-weight="700" fill="#1E40AF" text-anchor="start">ALD</text><text x="540" y="245" font-size="18" font-weight="500" fill="#233047" text-anchor="start">• Thermal</text><text x="540" y="273" font-size="18" font-weight="500" fill="#233047" text-anchor="start">• Plasma-enhanced</text><text x="540" y="320" font-size="17" font-weight="500" fill="#64748B" text-anchor="start">순차 포화반응</text><rect x="794" y="105" width="330" height="318" rx="20" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2"/><text x="816" y="146" font-size="25" font-weight="700" fill="#166534" text-anchor="start">결정학적 성장 관계</text><rect x="814" y="169" width="290" height="96" rx="14" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="2"/><text x="836" y="210" font-size="25" font-weight="700" fill="#166534" text-anchor="start">Epitaxy</text><text x="836" y="240" font-size="17" font-weight="500" fill="#233047" text-anchor="start">기판에 대해 결정방향 정렬</text><rect x="814" y="284" width="290" height="98" rx="14" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="2"/><text x="836" y="324" font-size="22" font-weight="700" fill="#166534" text-anchor="start">Non-epitaxial</text><text x="836" y="350" font-size="18" font-weight="500" fill="#233047" text-anchor="start">다결정 / 비정질 등</text><path d="M385 375 C540 442 845 448 910 273" fill="" stroke="#16A34A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="554" y="437" font-size="17" font-weight="700" fill="#166534" text-anchor="start">MOCVD/MOVPE 등은 두 기준에 동시에 해당</text></svg>