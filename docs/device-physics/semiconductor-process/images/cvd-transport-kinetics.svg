<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 510" width="1200" height="510" role="img"><title>Thin-film deposition educational schematic</title><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11" stroke="#64748B" stroke-width="2" fill="none"/></marker></defs><rect width="1200" height="510" fill="#F8FAFC"/><style>text{font-family:Arial,'Noto Sans',sans-serif}</style><text x="34" y="48" font-size="30" font-weight="700" fill="#0F172A" text-anchor="start">CVD: 기체 수송과 표면 반응이 함께 성장률을 결정</text><rect x="34" y="85" width="563" height="378" rx="14" fill="#fff" stroke="#CBD5E1" stroke-width="2"/><rect x="622" y="85" width="544" height="378" rx="14" fill="#fff" stroke="#CBD5E1" stroke-width="2"/><text x="60" y="126" font-size="25" font-weight="700" fill="#1D4ED8" text-anchor="start">반응 경로</text><rect x="78" y="151" width="460" height="63" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2"/><text x="100" y="188" font-size="22" font-weight="500" fill="#233047" text-anchor="start">Bulk gas: precursor 농도 Cg</text><rect x="78" y="239" width="460" height="61" rx="12" fill="#E0F2FE" stroke="#7DD3FC" stroke-width="2"/><text x="100" y="277" font-size="21" font-weight="500" fill="#233047" text-anchor="start">Boundary layer: 물질전달 hg</text><rect x="78" y="326" width="460" height="64" rx="12" fill="#FFEDD5" stroke="#FDBA74" stroke-width="2"/><text x="100" y="365" font-size="20" font-weight="500" fill="#233047" text-anchor="start">Surface: 반응 속도 ks, 표면 농도 Cs</text><path d="M310 215 L310 237" fill="" stroke="#64748B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M310 302 L310 325" fill="" stroke="#64748B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="295" y="440" font-size="21" font-weight="600" fill="#0F172A" text-anchor="middle">J = hg(Cg − Cs) = ks Cs</text><text x="648" y="126" font-size="24" font-weight="700" fill="#1D4ED8" text-anchor="start">온도 변화에 따른 정성적 경향</text><path d="M713 396 L1110 396" fill="" stroke="#0F172A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><path d="M713 396 L713 171" fill="" stroke="#0F172A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)"/><text x="906" y="438" font-size="21" font-weight="600" fill="#334155" text-anchor="middle">기판 온도 T →</text><text x="651" y="165" font-size="19" font-weight="500" fill="#233047" text-anchor="start">성장률</text><path d="M730 382 C790 377 830 345 876 295 S965 244 1083 244" fill="none" stroke="#2563EB" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M730 374 C805 369 866 360 922 342 S1014 268 1085 195" fill="none" stroke="#EA580C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray='10 8'/><text x="777" y="328" font-size="19" font-weight="500" fill="#1D4ED8" text-anchor="start">반응 제한</text><text x="1029" y="233" font-size="19" font-weight="600" fill="#1D4ED8" text-anchor="middle">전달 제한</text><text x="900" y="182" font-size="16" font-weight="500" fill="#C2410C" text-anchor="middle">점선: 반응 상수의 예시적 추세</text><text x="896" y="477" font-size="17" font-weight="500" fill="#64748B" text-anchor="middle">실제 곡선은 전구체 · 유량 · 압력 · 반응기 구조에 의존</text></svg>