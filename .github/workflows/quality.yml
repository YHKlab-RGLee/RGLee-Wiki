name: Validate wiki changes

on:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Test quality checker
        run: python -m unittest discover -s .agents/skills/evaluate-wiki-quality -p 'test_*.py'
      - name: Read-only quality gate and strict build
        run: ./build.sh build
